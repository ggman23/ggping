# Mise à jour du site depuis un téléphone : récupère les données (API FFTT, plus les données
# envoyées par le PC : dossier import et pages de pingpocket.fr), chiffre les pages avec le mot
# de passe du club et les publie sur GitHub Pages. Le PC lance aussi ce workflow après chaque
# lancement de lancer.bat (si le lien avec le téléphone est réglé : option 7). Une copie part
# aussi sur Netlify (ggping.netlify.app) si le secret NETLIFY_AUTH_TOKEN existe.
# Lancement : bouton « Mettre à jour » de la page d'accueil du site, ou GitHub (appli ou site) :
# Actions > Mise à jour du site > Run workflow. Mise en place : voir PUBLICATION.md.
name: Mise à jour du site

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages à mettre à jour
        type: choice
        options: [tout, resultats, effectif, virtuel, adversaires]
        default: tout
      netlify:
        description: Envoyer aussi sur Netlify, l'adresse donnée au club (15 crédits Netlify) ; sinon GitHub et Cloudflare seulement
        type: boolean
        default: false
      forcer_netlify:
        description: Envoyer la copie Netlify même si rien n'a changé (15 crédits Netlify)
        type: boolean
        default: false
  schedule:
    # Tous les lundis, GitHub et Cloudflare (gratuits) : vers 7 h (heure de Paris en hiver, 8 h en été),
    # puis vers 22 h 30 (23 h 30 en été) pour les résultats saisis dans la journée du lundi. La seconde
    # ne relit presque rien d'autre (parties des adversaires gardées 24 h, feuilles déjà saisies gardées).
    # Netlify (15 crédits par envoi, 300 par mois) seulement à la main : bouton « les 3 sites », case
    # netlify, ou PC.
    - cron: "7 6 * * 1"
    - cron: "37 21 * * 1"

permissions:
  # contents: write : commit vide en fin de mise à jour, pour GitHub Pages (voir ttvaires/pages.py)
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour-du-site
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Données déjà téléchargées (cache)
        uses: actions/cache@v4
        with:
          path: cache
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      - name: Mot de passe du site
        env:
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
        run: |
          if [ -z "$MOT_DE_PASSE_SITE" ]; then
            echo "::error::Ajoutez le secret MOT_DE_PASSE_SITE (Settings > Secrets and variables > Actions). Rien n'est publié sans mot de passe."
            exit 1
          fi

      - name: Données envoyées par le PC (dossier import, pages de pingpocket.fr)
        env:
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
        run: python -m ttvaires.synchro --recevoir

      - name: Récupération des données
        env:
          CHOIX: ${{ inputs.pages || 'tout' }}
          SURNOMS: ${{ secrets.SURNOMS }}  # noms affichés sur le récapitulatif (facultatif, voir PUBLICATION.md)
          # Compte licencié FFTT : l'API de la FFTT demande une connexion depuis le 31/10/2026
          FFTT_IDENTIFIANT: ${{ secrets.FFTT_IDENTIFIANT }}
          FFTT_MOT_DE_PASSE: ${{ secrets.FFTT_MOT_DE_PASSE }}
        run: |
          case "$CHOIX" in
            tout) ARGS="--resultats --effectif --virtuel --adversaires" ;;
            resultats|effectif|virtuel|adversaires) ARGS="--$CHOIX" ;;
            *) echo "::error::Choix inconnu : $CHOIX"; exit 1 ;;
          esac
          # pingpocket.fr refuse les serveurs de GitHub : on utilise ses pages envoyées par le PC
          python -m ttvaires $ARGS --pas-de-navigateur --pingpocket-cache

      - name: Réglage de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Pages déjà en ligne (gardées si elles ne sont pas régénérées)
        run: python -m ttvaires.publier --recuperer "${{ steps.pages.outputs.base_url }}"

      - name: Chiffrement des pages et page d'accueil
        id: chiffrement
        env:
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
        run: python -m ttvaires.publier

      # Archives des journées passées (la J3 dès que la J4 a commencé ; J1, J2... si elles manquent) :
      # refaites à la date de la veille de la journée suivante, publiées une fois pour toutes.
      - name: Archives des journées passées
        continue-on-error: true  # une archive ratée est refaite la fois suivante ; le site est publié quand même
        env:
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
          SURNOMS: ${{ secrets.SURNOMS }}
          FFTT_IDENTIFIANT: ${{ secrets.FFTT_IDENTIFIANT }}
          FFTT_MOT_DE_PASSE: ${{ secrets.FFTT_MOT_DE_PASSE }}
        run: python -m ttvaires.archives --pingpocket-cache

      # Site GitHub publié : le site, plus l'espace club dans club/ (même mot de passe que sur Netlify) :
      # https://ggman23.github.io/ggping/club/ ; GitHub Pages ne compte pas les mises en ligne.
      - name: Espace club sur le site GitHub (/club/)
        env:
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
          MOT_DE_PASSE_CLUB: ${{ secrets.MOT_DE_PASSE_CLUB }}
          GOATCOUNTER: ${{ vars.GOATCOUNTER || secrets.GOATCOUNTER }}
          UMAMI: ${{ vars.UMAMI || secrets.UMAMI || '23cfef06-9803-4df0-b7e7-6631a2490f82' }}
        run: python -m ttvaires.netlify --github site-github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-github

      # Publication restée bloquée par l'essai du 10/11 (elle empêche les suivantes) : annulée
      - name: Publication bloquée (nettoyage)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ttvaires.pages nettoyer

      - name: Publication
        id: deploiement
        uses: actions/deploy-pages@v4

      # Copie de secours sur Netlify : accueil public (adversaires), /club/ (espace club, secret
      # MOT_DE_PASSE_CLUB) et /gg/ (copie du site re-chiffrée, secret MOT_DE_PASSE_GG), avec les
      # statistiques de visite si la variable GOATCOUNTER existe.
      # Faite même si GitHub Pages est en panne, dès que le site est prêt. Sans le secret
      # NETLIFY_AUTH_TOKEN, cette étape ne fait rien (voir PUBLICATION.md).
      - name: Copie de secours sur Netlify
        if: ${{ !cancelled() && steps.chiffrement.outcome == 'success' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE: ${{ vars.NETLIFY_SITE }}
          MOT_DE_PASSE_SITE: ${{ secrets.MOT_DE_PASSE_SITE }}
          MOT_DE_PASSE_GG: ${{ secrets.MOT_DE_PASSE_GG }}
          MOT_DE_PASSE_CLUB: ${{ secrets.MOT_DE_PASSE_CLUB }}
          # Statistiques de visite (facultatif, voir PUBLICATION.md) : variable GOATCOUNTER, ou secret du même nom
          GOATCOUNTER: ${{ vars.GOATCOUNTER || secrets.GOATCOUNTER }}
          SURNOMS: ${{ secrets.SURNOMS }}  # dans l'empreinte du contenu : un surnom changé refait la copie
          # Une copie identique à celle en ligne n'est pas renvoyée (15 crédits Netlify par envoi), sauf si on force
          FORCER_NETLIFY: ${{ inputs.forcer_netlify }}
          # Netlify seulement si on le demande (bouton « les 3 sites », case netlify, PC), jamais pour la
          # mise à jour automatique du lundi ; sinon la copie est préparée pour Cloudflare et Netlify n'est
          # pas touché
          NETLIFY_ENVOI: ${{ inputs.netlify || inputs.forcer_netlify || false }}
          # Umami Cloud : identifiant du site (public : il figure dans les pages) ; une variable UMAMI le remplace
          UMAMI: ${{ vars.UMAMI || secrets.UMAMI || '23cfef06-9803-4df0-b7e7-6631a2490f82' }}
        run: python -m ttvaires.netlify

      # Copie sur Cloudflare Pages (gratuit : 500 mises en ligne par mois) : la même que pour Netlify.
      # Sans les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID, ces deux étapes ne font rien.
      - name: Copie sur Cloudflare Pages (projet, contenu nouveau ?)
        id: cloudflare
        if: ${{ !cancelled() && steps.chiffrement.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJET: ${{ vars.CLOUDFLARE_PROJET }}
          FORCER: ${{ inputs.forcer_netlify }}
        run: python -m ttvaires.cloudflare

      - name: Copie sur Cloudflare Pages (envoi)
        if: ${{ !cancelled() && steps.cloudflare.outputs.envoyer == 'true' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-netlify --project-name=${{ steps.cloudflare.outputs.projet }} --branch=main --commit-dirty=true

      # GitHub Pages ne met en ligne qu'une publication par commit du code : un commit vide pour que
      # la prochaine mise à jour (bouton, PC ou lundi) tourne sur un commit nouveau (ttvaires/pages.py)
      - name: Commit pour la prochaine mise à jour
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ttvaires.pages commit-suivant
