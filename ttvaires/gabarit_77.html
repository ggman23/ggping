<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CVTT Vaires · clubs du 77</title>
<style>
:root { color-scheme: light dark; --fond: #eef1f5; --surface: #fff; --surface2: #f3f5f8; --texte: #1c2330; --doux: #5b6576;
  --bord: #dde1e7; --grille: #e8ebef; --accent: #1f5fbf; --accent-fond: #e8f0fc; --bandeau: #173b60; --bandeau-texte: #fff;
  /* Vaires : ligne surlignée en jaune, barre jaune ; les autres clubs en gris (mise en avant d'un seul club) */
  --vaires-fond: #fff1b8; --vaires-bord: #e0a800; --barre-vaires: #eda100; --barre: #b9c0cb; --barre-choisie: #2a78d6;
  --att: #8a5a00; --att-fond: #fff4d6; }
@media (prefers-color-scheme: dark) { :root { --fond: #12151b; --surface: #1b2029; --surface2: #232a35; --texte: #e6e9ef;
  --doux: #9aa4b5; --bord: #313a48; --grille: #2a313d; --accent: #7fb0ff; --accent-fond: #1d2a40; --bandeau: #0f2236;
  --vaires-fond: #3d3214; --vaires-bord: #c98500; --barre-vaires: #c98500; --barre: #4a5361; --barre-choisie: #3987e5;
  --att: #f3cd6b; --att-fond: #3a3014; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
button, select, input { font: inherit; }
.barre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bandeau); color: var(--bandeau-texte); }
.barre .titres { flex: 1 1 auto; min-width: 0; }
.barre b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .titres span { display: block; font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.espaces { display: flex; gap: 8px; flex: none; }
.espaces a { border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff;
  border-radius: 9px; padding: 7px 11px; font-size: 14.5px; font-weight: 600; text-decoration: none; white-space: nowrap; text-align: center; }
/* Onglets */
.onglets { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; padding: 8px 14px 0; background: var(--fond); border-bottom: 1px solid var(--bord);
  overflow-x: auto; }
.onglets a { padding: 8px 14px; border-radius: 9px 9px 0 0; color: var(--doux); text-decoration: none; font-weight: 600; white-space: nowrap; border: 1px solid transparent; border-bottom: 0; }
.onglets a[aria-current="page"] { background: var(--surface); color: var(--texte); border-color: var(--bord); margin-bottom: -1px; }
main { max-width: 1240px; margin: 0 auto; padding: 14px 14px 40px; }
.carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.carte h2 { font-size: 17px; margin: 0 0 4px; }
.intro { color: var(--doux); font-size: 13.5px; margin: 0 0 10px; }
/* Filtres : une ligne au-dessus du contenu qu'ils filtrent */
.filtres { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 12px; }
.filtres label { font-size: 13px; color: var(--doux); display: inline-flex; align-items: center; gap: 6px; }
select, input[type=search] { font-size: 14.5px; padding: 7px 10px; border: 1px solid var(--bord); border-radius: 8px; background: var(--surface); color: var(--texte); max-width: 100%; }
input[type=search] { width: 190px; }
.bascule { display: inline-flex; border: 1px solid var(--bord); border-radius: 8px; overflow: hidden; }
.bascule button { border: 0; padding: 6px 11px; background: var(--surface); color: var(--texte); cursor: pointer; font-size: 13.5px; }
.bascule button + button { border-left: 1px solid var(--bord); }
.bascule button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.cats { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.cats button { border: 1px solid var(--bord); background: var(--surface); color: var(--texte); border-radius: 99px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.cats button[aria-pressed="true"] { background: var(--accent-fond); border-color: var(--accent); color: var(--accent); font-weight: 600; }
/* Tableau des clubs */
.defil { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--bord); text-align: left; white-space: nowrap; }
th { color: var(--doux); font-weight: 600; font-size: 12.5px; position: sticky; top: 0; background: var(--surface); }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--accent); }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 10px; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 10px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.club { position: sticky; left: 0; background: var(--surface); }
tr.vaires td { background: var(--vaires-fond); font-weight: 650; }
tr.vaires td:first-child { box-shadow: inset 4px 0 0 var(--vaires-bord); }
td .doux, .doux { color: var(--doux); font-size: 12.5px; font-weight: 400; }
button.nom { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; text-align: left; }
button.nom:hover { text-decoration: underline; }
.rang { color: var(--doux); font-variant-numeric: tabular-nums; }
.niv { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 5px; background: var(--surface2); margin-right: 3px; }
.vide { color: var(--doux); padding: 10px 2px; }
.note { font-size: 12.5px; color: var(--doux); margin: 10px 2px 0; }
/* Rappel, dans chaque vue, que seuls certains joueurs sont comptés */
.filtre-actif { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--att-fond); color: var(--att);
  border-radius: 8px; padding: 7px 10px; font-size: 13.5px; margin: 0 0 10px; }
.filtre-actif button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
/* Classement : barres horizontales, une par club */
.barres { display: grid; grid-template-columns: 34px minmax(110px, 230px) minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 13.5px; }
.barres .r { color: var(--doux); text-align: right; font-variant-numeric: tabular-nums; }
.barres .nomb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barres .ligne { display: flex; align-items: center; gap: 8px; min-width: 0; }
.barres .b { height: 16px; border-radius: 0 4px 4px 0; background: var(--barre); min-width: 2px; }
.barres .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
.barres .vaires { background: var(--vaires-fond); font-weight: 650; border-radius: 4px; }
.barres .vaires .b { background: var(--barre-vaires); }
.barres .choisi .b { background: var(--barre-choisie); }
.position { font-size: 15px; margin: 0 0 10px; }
.position b { background: var(--vaires-fond); padding: 1px 6px; border-radius: 5px; }
/* Comparaison */
.choix { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.puce { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--bord); border-radius: 99px; padding: 3px 4px 3px 11px; font-size: 13.5px; background: var(--surface2); }
.puce.vaires { background: var(--vaires-fond); border-color: var(--vaires-bord); }
.puce button { border: 0; background: none; color: var(--doux); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 99px; }
.bouton { border: 1px solid var(--bord); background: var(--surface); color: var(--texte); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.bouton:hover { border-color: var(--accent); }
.mesures { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; }
.mesure { border: 1px solid var(--bord); border-radius: 10px; padding: 10px 12px; }
.mesure h3 { font-size: 14px; margin: 0 0 8px; }
.mesure .barres { grid-template-columns: minmax(80px, 140px) minmax(0, 1fr); }
/* Fiche d'un club */
dialog { border: 1px solid var(--bord); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
  background: var(--surface); color: var(--texte); }
dialog::backdrop { background: rgba(10, 15, 25, .45); }
.fiche { padding: 16px 18px 18px; }
.fiche h2 { margin: 0 32px 2px 0; font-size: 20px; }
.fermer { position: absolute; right: 10px; top: 10px; border: 0; background: var(--surface2); border-radius: 99px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; color: var(--texte); }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.tuile { background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.tuile .n { font-size: 12.5px; color: var(--doux); }
.tuile b { display: block; font-size: 20px; }
.repart { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin: 6px 0 4px; gap: 2px; background: var(--surface); }
.repart i { display: block; height: 100%; }
/* Classement des joueurs */
#table-joueurs td.joueur { white-space: normal; min-width: 150px; }
#table-joueurs .club-sous { display: none; }
#table-joueurs td.prog { font-variant-numeric: tabular-nums; }
.plus-lignes { margin: 12px 0 0; }
.lien { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
@media (max-width: 700px) {
  /* Jeunes : virtuels et +/− à l'écran ; les points mensuels, la colonne sexe et les parties s'effacent */
  #table-joueurs .col-club, #table-joueurs.avec-virt .col-sexe, #table-joueurs.avec-virt .col-points, #table-joueurs .col-parties { display: none; }
  #table-joueurs .club-sous { display: block; }
  #table-joueurs.avec-virt td.joueur { min-width: 120px; }
}
@media (max-width: 700px) {
  main { padding: 10px 8px 32px; }
  .carte { padding: 12px 10px; }
  th, td { padding: 6px 6px; }
  .barres { grid-template-columns: 28px minmax(90px, 40%) minmax(0, 1fr); gap: 4px 6px; }
  input[type=search] { width: 100%; }
  .filtres label { flex: 1 1 100%; flex-wrap: wrap; min-width: 0; }
  .filtres label select { flex: 1 1 auto; min-width: 0; width: 100%; }
}
@media (max-width: 520px) {
  .espaces { order: 3; flex-basis: 100%; }
  .espaces a { flex: 1 1 0; padding: 7px 6px; }
  /* Les cinq onglets tiennent sur un écran de téléphone (360 px) : « Joueurs » visible sans faire défiler */
  .onglets { gap: 0; padding: 6px 4px 0; justify-content: space-between; }
  .onglets a { padding: 8px 5px; font-size: 13px; }
}
</style>
</head>
<body>
<header class="barre">
  <div class="titres"><b>CVTT Vaires · clubs du 77</b><span id="sous-titre"></span></div>
  <nav class="espaces" aria-label="Autres espaces">
    <a id="vers-club" href="../club/">Club</a>
    <a id="vers-indivs" href="../indivs/">Indivs</a>
    <a id="vers-tournois" href="../tournois/">Tournois</a>
    <a id="vers-cal" href="../cal/">Calendrier</a>
  </nav>
</header>
<nav class="onglets" aria-label="Vues">
  <a href="#clubs" data-vue="clubs">Clubs</a>
  <a href="#classements" data-vue="classements">Classements</a>
  <a href="#comparer" data-vue="comparer">Comparer</a>
  <a href="#poules" data-vue="poules">Poules</a>
  <a href="#joueurs" data-vue="joueurs">Joueurs</a>
</nav>
<main>
  <section class="carte" id="filtres-joueurs" aria-label="Joueurs comptés">
    <div class="filtres">
      <label>Joueurs
        <span class="bascule" id="sexe"><button type="button" data-v="T">Femmes et hommes</button><button type="button" data-v="F">Femmes seulement</button><button type="button" data-v="M">Hommes seulement</button></span></label>
      <label>Catégories <span class="cats" id="cats"></span></label>
      <label>Licences
        <span class="bascule" id="loisir"><button type="button" data-v="1" title="Compétition et loisir : le nombre de licenciés de la FFTT">Toutes</button><button type="button" data-v="0" title="Sans les licences loisir (pas de points, pas de compétition)">Compétition</button></span></label>
    </div>
    <p class="intro" id="resume-filtres" style="margin:0"></p>
  </section>
  <div id="vue"></div>
</main>
<dialog id="fiche" aria-labelledby="fiche-titre"><button class="fermer" type="button" aria-label="Fermer">×</button><div class="fiche" id="fiche-corps"></div></dialog>
<script>
"use strict";
const D = __DONNEES_JSON__;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lire = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* navigation privée */ } };
const fr = (x) => (x == null ? "—" : Number(x).toLocaleString("fr-FR", { maximumFractionDigits: 0 }));
const CATS = { P: "Poussins", B: "Benjamins", M: "Minimes", C: "Cadets", J: "Juniors", S: "Seniors", V: "Vétérans" };
const ORDRE = D.ordre_niveaux || [];
const rangNiveau = (n) => (ORDRE.includes(n) ? ORDRE.indexOf(n) : ORDRE.length);
const CLUBS = D.clubs || [];
const PAR_NUM = new Map(CLUBS.map((c) => [c.numero, c]));
// Jeunes (poussins à juniors) : points virtuels calculés par la mise à jour (6e élément d'un joueur)
const JEUNES = ["P", "B", "M", "C", "J"];
const AVEC_VIRTUELS = CLUBS.some((c) => (c.joueurs || []).some((j) => j[5]));
const signe = (x) => (x == null ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toLocaleString("fr-FR", { maximumFractionDigits: 1 }));
const nomCourt = (c) => c.nom;

/* Espaces voisins (même mot de passe), y compris sur le site GitHub (…/ggping/77/) */
function racine() { const p = location.pathname, i = p.search(/\/(gg\/)?77(\/|\.html)/); return i >= 0 ? p.slice(0, i) : p.replace(/\/[^/]*$/, ""); }
const BASE = location.protocol === "file:" ? ".." : racine();
for (const [id, chemin] of [["vers-club", "club"], ["vers-indivs", "indivs"], ["vers-tournois", "tournois"], ["vers-cal", "cal"]])
  document.getElementById(id).href = `${BASE}/${chemin}/`;
document.getElementById("sous-titre").textContent = `Saison ${D.saison} · phase ${D.phase} · ${CLUBS.length} clubs engagés en championnat`
  + (D.genere_le ? ` · données du ${D.genere_le.slice(8, 10)}/${D.genere_le.slice(5, 7)}` : "");

/* ---------- Joueurs comptés : sexe, catégories, licences loisir (retenus sur l'appareil) ---------- */
/* Joueurs comptés : tous au départ de chaque visite (un réglage oublié fausserait la lecture des autres
   onglets) ; un bandeau le rappelle dans chaque vue tant qu'il n'est pas « tout » */
const PAR_DEFAUT = () => ({ sexe: "T", cats: new Set(D.categories), loisir: "1" });
let filtre = PAR_DEFAUT();
const filtreComplet = () => filtre.sexe === "T" && filtre.loisir === "1" && D.categories.every((c) => filtre.cats.has(c));
function bandeauFiltre() {
  if (filtreComplet()) return "";
  const morceaux = [filtre.sexe === "F" ? "femmes seulement" : filtre.sexe === "M" ? "hommes seulement" : "",
    D.categories.every((c) => filtre.cats.has(c)) ? "" : [...filtre.cats].map((c) => CATS[c].toLowerCase()).join(", "),
    filtre.loisir === "1" ? "" : "sans les licences loisir"].filter(Boolean);
  return `<p class="filtre-actif" role="status">Comptés : ${esc(morceaux.join(" · "))} (réglage en haut de la page)
    <button type="button" data-tout-compter>Tout compter</button></p>`;
}
function boutonsFiltres() {
  for (const id of ["sexe", "loisir"]) document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === filtre[id])));
  const tous = D.categories.every((c) => filtre.cats.has(c)), jeunes = ["P", "B", "M", "C", "J"], adultes = ["S", "V"];
  const egal = (l) => filtre.cats.size === l.length && l.every((c) => filtre.cats.has(c));
  document.getElementById("cats").innerHTML =
    `<button type="button" data-p="tous" aria-pressed="${tous}">Toutes</button><button type="button" data-p="jeunes" aria-pressed="${egal(jeunes)}">Jeunes</button>`
    + `<button type="button" data-p="adultes" aria-pressed="${egal(adultes)}">Adultes</button>`
    + D.categories.map((c) => `<button type="button" data-c="${c}" aria-pressed="${!tous && filtre.cats.has(c)}" title="${esc(CATS[c])}">${c}</button>`).join("");
  const morceaux = [filtre.sexe === "F" ? "femmes seulement" : filtre.sexe === "M" ? "hommes seulement" : "femmes et hommes",
    tous ? "toutes catégories" : [...filtre.cats].map((c) => CATS[c].toLowerCase()).join(", "),
    filtre.loisir === "1" ? "toutes les licences, loisir comprises (le nombre de licenciés de la FFTT)" : "licences compétition seulement (sans les licences loisir)"];
  document.getElementById("resume-filtres").textContent = `Comptés : ${morceaux.join(" · ")} (licences de la saison).`;
}
document.getElementById("sexe").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { filtre.sexe = b.dataset.v; changer(); } });
document.getElementById("loisir").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { filtre.loisir = b.dataset.v; changer(); } });
document.getElementById("cats").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.p) filtre.cats = new Set(b.dataset.p === "jeunes" ? ["P", "B", "M", "C", "J"] : b.dataset.p === "adultes" ? ["S", "V"] : D.categories);
  else {
    const tous = D.categories.every((c) => filtre.cats.has(c));
    if (tous) filtre.cats = new Set([b.dataset.c]);
    else { filtre.cats.has(b.dataset.c) ? filtre.cats.delete(b.dataset.c) : filtre.cats.add(b.dataset.c); if (!filtre.cats.size) filtre.cats = new Set(D.categories); }
  }
  changer();
});
function changer() { calculer(); colonnes(); boutonsFiltres(); afficher(); }

/* ---------- Statistiques de chaque club, pour les joueurs comptés ---------- */
let S = new Map();
function calculer() {
  S = new Map();
  for (const c of CLUBS) {
    const eqM = c.equipes.filter((e) => !e.feminin), eqF = c.equipes.filter((e) => e.feminin);
    const s = { club: c, equipes: c.equipes.length, equipesM: eqM.length, equipesF: eqF.length,
      niveau: c.meilleur_niveau, rangNiveau: rangNiveau(c.meilleur_niveau), connu: !!c.joueurs };
    if (c.joueurs) {
      const js = c.joueurs.filter(([p, sx, cat, lo]) => (filtre.sexe === "T" || sx === filtre.sexe) && filtre.cats.has(lettre(cat))
        && (filtre.loisir === "1" || !lo));
      const pts = js.map((j) => j[0]).filter((p) => p).sort((a, b) => b - a);
      const moy = (n) => (pts.length ? Math.round(pts.slice(0, n).reduce((a, b) => a + b, 0) / Math.min(n, pts.length)) : null);
      Object.assign(s, { joueurs: js.length, loisir: js.filter((j) => j[3]).length,
        F: js.filter((j) => j[1] === "F").length, M: js.filter((j) => j[1] === "M").length,
        cats: Object.fromEntries(D.categories.map((k) => [k, js.filter((j) => lettre(j[2]) === k).length])),
        meilleur: pts[0] ?? null, top4: moy(4), top10: moy(10), mille: pts.filter((p) => p >= 1000).length });
      // Jeunes dont les points virtuels sont connus (licences compétition) : niveau et points gagnés depuis le début de la phase
      const jv = js.filter((j) => !j[3] && j[5] && JEUNES.includes(lettre(j[2])));
      const virt = jv.map((j) => j[5][0]).sort((a, b) => b - a);
      Object.assign(s, { jeunesTop4: virt.length ? Math.round(virt.slice(0, 4).reduce((a, b) => a + b, 0) / Math.min(4, virt.length)) : null,
        jeunesProg: jv.length ? Math.round(jv.reduce((a, j) => a + j[5][1], 0)) : null });
    }
    S.set(c.numero, s);
  }
}

/* ---------- Vue « Clubs » : tableau triable et filtrable ---------- */
const TOUTES_COLONNES = [
  { cle: "joueurs", titre: "Joueurs", n: true, aide: "Licenciés de la saison comptés (voir « Licences »)" },
  { cle: "loisir", titre: "dont loisir", n: true, aide: "Licences loisir : ni points ni compétition", loisir: true },
  { cle: "F", titre: "Femmes", n: true }, { cle: "M", titre: "Hommes", n: true },
  ...D.categories.map((k) => ({ cle: "cat:" + k, titre: k, n: true, aide: CATS[k] })),
  { cle: "meilleur", titre: "Meilleur", n: true, aide: "Points du meilleur joueur" },
  { cle: "top4", titre: "Top 4", n: true, aide: "Moyenne des points des 4 meilleurs" },
  { cle: "top10", titre: "Top 10", n: true, aide: "Moyenne des points des 10 meilleurs" },
  { cle: "mille", titre: "≥ 1000", n: true, aide: "Joueurs à 1000 points ou plus" },
  { cle: "equipes", titre: "Équipes", n: true, aide: "Équipes engagées (masculines et féminines)" },
  { cle: "niveau", titre: "Divisions", n: false, aide: "Équipes par division (F : féminines) ; tri : la division de la meilleure équipe" },
];
let COLONNES = [];
const colonnes = () => { COLONNES = TOUTES_COLONNES.filter((c) => !c.loisir || filtre.loisir === "1"); };
const valeur = (s, cle) => (cle === "nom" ? s.club.nom : cle === "niveau" ? (s.niveau ? -s.rangNiveau : null)
  : cle.startsWith("cat:") ? (s.cats ? s.cats[cle.slice(4)] : null) : s[cle]);
let tri = { cle: "top4", sens: -1 }, recherche = "", niveauFiltre = "";
try { const t = JSON.parse(lire("77-tri") || "null"); if (t && t.cle) tri = t; } catch (e) { /* réglage illisible */ }
function trier(liste) {
  return liste.slice().sort((a, b) => {
    const va = valeur(a, tri.cle), vb = valeur(b, tri.cle);
    if (va == null && vb == null) return a.club.nom.localeCompare(b.club.nom, "fr");
    if (va == null) return 1; if (vb == null) return -1;
    return (typeof va === "string" ? va.localeCompare(vb, "fr") : va - vb) * tri.sens || a.club.nom.localeCompare(b.club.nom, "fr");
  });
}
const niveaux = (c) => Object.entries(c.niveaux).sort((a, b) => (a[0].startsWith("F:") - b[0].startsWith("F:")) || rangNiveau(a[0].replace("F:", "")) - rangNiveau(b[0].replace("F:", "")))
  .map(([n, k]) => `<span class="niv" title="${k} équipe${k > 1 ? "s" : ""}${n.startsWith("F:") ? " féminine" + (k > 1 ? "s" : "") : ""} en ${esc(n.replace("F:", ""))}">${esc(n.replace("F:", "F "))}${k > 1 ? " ×" + k : ""}</span>`).join("");
function vueClubs() {
  const niveauxConnus = [...new Set(CLUBS.flatMap((c) => c.equipes.filter((e) => !e.feminin).map((e) => e.niveau)))].filter(Boolean).sort((a, b) => rangNiveau(a) - rangNiveau(b));
  let liste = [...S.values()].filter((s) => (!recherche || s.club.nom.toLowerCase().includes(recherche.toLowerCase()))
    && (!niveauFiltre || s.club.equipes.some((e) => !e.feminin && e.niveau === niveauFiltre)));
  liste = trier(liste);
  const entete = `<tr><th>#</th><th aria-sort="${tri.cle === "nom" ? (tri.sens > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-tri="nom">Club</button></th>`
    + COLONNES.map((c) => `<th class="${c.n ? "n" : ""}" aria-sort="${tri.cle === c.cle ? (tri.sens > 0 ? "ascending" : "descending") : "none"}"${c.aide ? ` title="${esc(c.aide)}"` : ""}><button type="button" data-tri="${c.cle}">${esc(c.titre)}</button></th>`).join("") + "</tr>";
  const lignes = liste.map((s, i) => `<tr class="${s.club.vaires ? "vaires" : ""}"><td class="rang">${i + 1}</td>

      ${COLONNES.map((c) => c.cle === "niveau" ? `<td>${niveaux(s.club) || "—"}</td>` : `<td class="n">${s.connu || c.cle === "equipes" ? fr(valeur(s, c.cle)) : "—"}</td>`).join("")}</tr>`).join("");
  return `<section class="carte"><h2>Les clubs du 77</h2>${bandeauFiltre()}
    <p class="intro">Touche un en-tête pour trier, un club pour sa fiche. La ligne de Vaires est en jaune. Points : points mensuels des joueurs comptés.</p>
    <div class="filtres">
      <input type="search" id="recherche" placeholder="Chercher un club" value="${esc(recherche)}" aria-label="Chercher un club">
      <label>Division <select id="niveau"><option value="">Toutes</option>${niveauxConnus.map((n) => `<option${n === niveauFiltre ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
    </div>

}
function noteDonnees() {
  const sans = CLUBS.filter((c) => !c.joueurs).length;
  return `<p class="note">Équipes : API de la FFTT (phase ${D.phase}). Joueurs : listes de licenciés de pingpocket.fr lues par le PC (licences de la saison).`
    + (sans ? ` ${sans} club${sans > 1 ? "s" : ""} sans liste pour l'instant (« — ») : ${sans > 1 ? "elles arrivent" : "elle arrive"} aux prochains lancements sur le PC.` : "") + "</p>";
}

/* ---------- Vue « Classements » : un club par barre, Vaires en jaune ---------- */
const MESURES = [
  { cle: "joueurs", titre: "Nombre de joueurs" }, { cle: "top4", titre: "Niveau : moyenne des 4 meilleurs (points)" },
  { cle: "top10", titre: "Niveau : moyenne des 10 meilleurs (points)" }, { cle: "meilleur", titre: "Meilleur joueur (points)" },
  { cle: "mille", titre: "Joueurs à 1000 points ou plus" }, { cle: "F", titre: "Nombre de joueuses" },
  { cle: "equipes", titre: "Équipes engagées" }, { cle: "niveau", titre: "Division de la meilleure équipe" },
  ...(AVEC_VIRTUELS ? [{ cle: "jeunesTop4", titre: "Jeunes : moyenne des 4 meilleurs (points virtuels)" },
    { cle: "jeunesProg", titre: "Jeunes : points gagnés depuis le début de la phase (total)" }] : []),
];
let mesure = MESURES.some((m) => m.cle === lire("77-mesure")) ? lire("77-mesure") : "top4";
function barres(liste, cle, avecRang = true, choisis = new Set()) {
  const vals = liste.map((s) => valeur(s, cle)).filter((v) => v != null);
  const max = cle === "niveau" ? 0 : Math.max(1, ...vals), min = cle === "niveau" ? Math.min(...vals) : 0;
  return `<div class="barres">${liste.map((s, i) => {
    const v = valeur(s, cle);
    const largeur = v == null ? 0 : cle === "niveau" ? 100 * (v - min + 1) / (1 - min) : 100 * v / max;
    const texte = cle === "niveau" ? (s.niveau || "—") : fr(v);
    const cls = s.club.vaires ? "vaires" : choisis.has(s.club.numero) ? "choisi" : "";
    return `${avecRang ? `<span class="r ${cls}">${i + 1}</span>` : ""}<span class="nomb ${cls}" title="${esc(s.club.nom)}">${esc(s.club.nom)}</span>
      <span class="ligne ${cls}"><span class="b" style="width:${Math.max(0, Math.min(100, largeur)) * 0.82}%"></span><span class="v">${texte}</span></span>`;
  }).join("")}</div>`;
}
function vueClassements() {
  const tries = [...S.values()].filter((s) => valeur(s, mesure) != null)
    .sort((a, b) => valeur(b, mesure) - valeur(a, mesure) || a.club.nom.localeCompare(b.club.nom, "fr"));
  const i = tries.findIndex((s) => s.club.vaires), m = MESURES.find((x) => x.cle === mesure);
  return `<section class="carte"><h2>Où se situe Vaires</h2>${bandeauFiltre()}
    <div class="filtres"><label>Classer selon <select id="mesure">${MESURES.map((x) => `<option value="${x.cle}"${x.cle === mesure ? " selected" : ""}>${esc(x.titre)}</option>`).join("")}</select></label></div>
    <p class="position">${i >= 0 ? `Vaires : <b>${i + 1}<sup>${i ? "e" : "er"}</sup> sur ${tries.length}</b> · ${esc(m.titre.toLowerCase())} : ${mesure === "niveau" ? esc(tries[i].niveau) : fr(valeur(tries[i], mesure))}` : "Vaires n'a pas encore de données pour ce classement."}</p>
    ${barres(tries, mesure)}${noteDonnees()}</section>`;
}

/* ---------- Vue « Comparer » : jusqu'à 8 clubs, ou ceux d'une poule ---------- */
const MAX = 8;

try { choisis = JSON.parse(lire("77-choisis") || "[]").filter((n) => PAR_NUM.has(n)).slice(0, MAX); } catch (e) { choisis = []; }
if (!choisis.length) { const v = CLUBS.find((c) => c.vaires); if (v) choisis = [v.numero]; }

function vueComparer() {
  const options = CLUBS.slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr")).map((c) => `<option value="${esc(c.numero)}"${choisis.includes(c.numero) ? " disabled" : ""}>${esc(c.nom)}</option>`).join("");

  return `<section class="carte"><h2>Comparer des clubs</h2>${bandeauFiltre()}

    <div class="filtres">

function optionsPoules(poules, choisie) {

/* ---------- Vue « Poules » : les équipes d'une poule par force estimée (les favoris d'abord) ---------- */
let pouleChoisie = lire("77-poule");
function vuePoules() {
  const poules = (D.poules || []).filter((p) => p.equipes.some((e) => e.dans_le_77));

  const forces = p.equipes.map((e) => e.force).filter((x) => x != null), max = Math.max(1, ...forces);
  const lignes = p.equipes.map((e, i) => { const club = PAR_NUM.get(e.club);
    return `<tr class="${e.vaires ? "vaires" : ""}"><td class="rang">${e.force != null ? i + 1 : ""}</td>

/* ---------- Catégories précises de la FFTT : « M1 » = minimes 1, « V45 » = vétérans 45 ---------- */
const lettre = (cat) => (cat || "").charAt(0).toUpperCase();
const libelleCat = (cat) => { const l = lettre(cat), reste = (cat || "").slice(1); return CATS[l] ? `${CATS[l]}${reste ? " " + reste : ""}` : cat || "—"; };
const ordreCat = (a, b) => D.categories.indexOf(lettre(a)) - D.categories.indexOf(lettre(b))
  || (parseInt(a.slice(1), 10) || 0) - (parseInt(b.slice(1), 10) || 0) || a.localeCompare(b);

/* ---------- Vue « Joueurs » : tous les joueurs du département, triables et filtrables ---------- */
// Licences compétition seulement (les licences loisir n'ont pas de points) ; une ligne par joueur
const JOUEURS = CLUBS.flatMap((c) => (c.joueurs || []).filter((j) => !j[3]).map((j) => (
  { points: j[0], sexe: j[1], cat: j[2], nom: j[4] || "", club: c.numero, clubNom: c.nom, vaires: c.vaires,
    jeune: JEUNES.includes(lettre(j[2])), virt: j[5] ? j[5][0] : null, prog: j[5] ? j[5][1] : null,
    v: j[5] ? j[5][2] : null, d: j[5] ? j[5][3] : null })));
const sansAccent = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
for (const j of JOUEURS) j.cle = sansAccent(j.nom);
const CATS_PRECISES = [...new Set(JOUEURS.map((j) => j.cat).filter(Boolean))].sort(ordreCat);
let vj = { sexe: "T", cat: "", club: "", q: "", tri: { cle: "points", sens: -1 }, n: 200 };
const garderCat = (j) => !vj.cat || (vj.cat === "jeunes" ? j.jeune : vj.cat.endsWith("*") ? lettre(j.cat) === vj.cat[0] : j.cat === vj.cat);
// Colonnes des points virtuels : quand la catégorie choisie est une catégorie de jeunes
const catJeunes = () => AVEC_VIRTUELS && (vj.cat === "jeunes" || (vj.cat !== "" && JEUNES.includes(vj.cat[0])));
function vueJoueurs() {
  const q = sansAccent(vj.q.trim()), avecVirt = catJeunes();
  const garde = JOUEURS.filter((j) => (vj.sexe === "T" || j.sexe === vj.sexe) && garderCat(j)
    && (!vj.club || j.club === vj.club) && (!q || j.cle.includes(q)));
  const sens = vj.tri.sens, cle = !avecVirt && (vj.tri.cle === "virt" || vj.tri.cle === "prog") ? "points" : vj.tri.cle;
  // Rang (ex aequo : même rang) : selon les points virtuels ou la progression si on trie par eux, sinon les points mensuels
  const cleRang = cle === "virt" || cle === "prog" ? cle : "points";
  const parRang = garde.slice().sort((a, b) => (a[cleRang] == null) - (b[cleRang] == null) || (b[cleRang] || 0) - (a[cleRang] || 0)
    || (b.points || 0) - (a.points || 0));
  const rang = new Map();
  parRang.forEach((j, i) => rang.set(j, j[cleRang] == null ? null
    : i && parRang[i - 1][cleRang] === j[cleRang] ? rang.get(parRang[i - 1]) : i + 1));
  const comparer = (a, b) => {
    if (cle === "nom") return a.nom.localeCompare(b.nom, "fr") * sens;
    if (cle === "club") return a.clubNom.localeCompare(b.clubNom, "fr") * sens;
    if (cle === "cat") return ordreCat(a.cat || "Z", b.cat || "Z") * sens;
    const va = a[cle], vb = b[cle];
    return va == null || vb == null ? (va == null) - (vb == null) : (va - vb) * sens;  // inconnus à la fin
  };
  const lignes = garde.slice().sort((a, b) => comparer(a, b) || (b.points || 0) - (a.points || 0) || a.nom.localeCompare(b.nom, "fr"));
  const groupes = D.categories.filter((l) => CATS_PRECISES.some((c) => lettre(c) === l));
  const optionsCat = `<option value="">Toutes les catégories</option><option value="jeunes"${vj.cat === "jeunes" ? " selected" : ""}>Jeunes (poussins à juniors)</option>`
    + groupes.map((l) => {
    const fines = CATS_PRECISES.filter((c) => lettre(c) === l);
    return `<optgroup label="${esc(CATS[l])}"><option value="${l}*"${vj.cat === l + "*" ? " selected" : ""}>${esc(CATS[l])} (toutes)</option>`
      + (fines.length > 1 || fines[0] !== l ? fines.map((c) => `<option value="${esc(c)}"${vj.cat === c ? " selected" : ""}>${esc(libelleCat(c))}</option>`).join("") : "")
      + "</optgroup>"; }).join("");
  const optionsClub = `<option value="">Tous les clubs</option>` + CLUBS.slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr"))
    .filter((c) => c.joueurs).map((c) => `<option value="${esc(c.numero)}"${vj.club === c.numero ? " selected" : ""}>${esc(c.nom)}</option>`).join("");
  const th = (k, titre, cls = "", aide = "") => `<th class="${cls}" aria-sort="${cle === k ? (sens > 0 ? "ascending" : "descending") : "none"}"${aide ? ` title="${esc(aide)}"` : ""}><button type="button" data-tri-j="${k}">${titre}</button></th>`;
  const vaires = parRang.filter((j) => j.vaires && rang.get(j) != null);
  const affiche = lignes.slice(0, vj.n);
  const V = D.virtuels_jeunes, debutPhase = D.debut_phase ? `${D.debut_phase.slice(8, 10)}/${D.debut_phase.slice(5, 7)}/${D.debut_phase.slice(0, 4)}` : "—";
  const sansVirt = avecVirt ? garde.filter((j) => j.virt == null).length : 0;
  const premier = vaires.length ? rang.get(vaires[0]) : null;
  return `<section class="carte"><h2>Les joueurs du 77</h2>
    <p class="intro">Tous les licenciés compétition des clubs du département, classés par points mensuels (le classement officiel du mois)${avecVirt
      ? `, avec pour les jeunes leurs <b>points virtuels</b> et les points gagnés ou perdus depuis le début de la phase (+/−), toutes compétitions` : ""}.
      Les joueurs de Vaires sont en jaune.</p>
    <div class="filtres">
      <span class="bascule" id="sexe-j"><button type="button" data-v="T" aria-pressed="${vj.sexe === "T"}">Femmes et hommes</button><button type="button" data-v="F" aria-pressed="${vj.sexe === "F"}">Femmes</button><button type="button" data-v="M" aria-pressed="${vj.sexe === "M"}">Hommes</button></span>
      <label>Catégorie <select id="cat-j">${optionsCat}</select></label>
      <label>Club <select id="club-j">${optionsClub}</select></label>
      <input type="search" id="recherche-j" placeholder="Chercher un joueur" value="${esc(vj.q)}" aria-label="Chercher un joueur">
    </div>
    ${AVEC_VIRTUELS && !avecVirt ? `<p class="note"><button type="button" class="lien" data-jeunes-prog>Voir les jeunes classés par progression</button> (points virtuels, catégorie « Jeunes » ou une catégorie de jeunes)</p>` : ""}
    <p class="position">${fr(garde.length)} joueur${garde.length > 1 ? "s" : ""}${vaires.length && !vj.club ? ` · Vaires : ${vaires.length}, ${cleRang === "prog" ? "la meilleure progression" : "le mieux classé"} ${premier}<sup>${premier === 1 ? "er" : "e"}</sup>` : ""}</p>
    <div class="defil"><table id="table-joueurs" class="${avecVirt ? "avec-virt" : ""}"><tr><th class="n">#</th>${th("nom", "Joueur")}${th("club", "Club", "col-club")}${th("cat", "Cat.")}<th class="col-sexe">Sexe</th>${th("points", "Points", "n col-points", "Points mensuels (classement officiel du mois)")}${avecVirt
      ? th("virt", "Virtuels", "n", "Points virtuels : points de la phase + points gagnés ou perdus depuis, toutes compétitions") + th("prog", "+/−", "n", `Points gagnés ou perdus depuis le début de la phase (${debutPhase})`) + '<th class="n col-parties">Parties</th>' : ""}</tr>
      ${affiche.map((j) => `<tr class="${j.vaires ? "vaires" : ""}"><td class="n rang">${rang.get(j) ?? "—"}</td>
        <td class="joueur">${esc(j.nom)}<span class="club-sous doux">${esc(j.clubNom)}${avecVirt && j.sexe === "F" ? " · F" : ""}</span></td>
        <td class="col-club"><button type="button" class="nom" data-club="${esc(j.club)}">${esc(j.clubNom)}</button></td>
        <td title="${esc(libelleCat(j.cat))}">${esc(j.cat || "—")}</td><td class="col-sexe">${j.sexe === "F" ? "F" : "H"}</td><td class="n col-points">${fr(j.points)}</td>${avecVirt
          ? `<td class="n">${fr(j.virt)}</td><td class="n prog"${j.v != null ? ` title="${j.v} victoire${j.v > 1 ? "s" : ""}, ${j.d} défaite${j.d > 1 ? "s" : ""}"` : ""}>${j.prog == null ? "—" : signe(j.prog)}</td>
            <td class="n col-parties">${j.v == null ? "—" : `${j.v} V · ${j.d} D`}</td>` : ""}</tr>`).join("")}</table></div>
    ${lignes.length > vj.n ? `<button type="button" class="bouton plus-lignes" id="plus-j">Afficher ${Math.min(200, lignes.length - vj.n)} de plus (${fr(lignes.length - vj.n)} restants)</button>` : ""}
    <p class="note">Points mensuels des listes de licenciés de pingpocket.fr (lues par le PC). ${AVEC_VIRTUELS || V
      ? `Points virtuels des jeunes (licences compétition) : calculés comme pour les adversaires, d'après les parties de la saison connues de la FFTT
        (championnat, critérium, tournois…), relues tous les 3 jours au plus${V ? ` ; ${fr(V.connus)} jeunes sur ${fr(V.jeunes)} connus${V.reportes ? `, ${fr(V.reportes)} aux prochaines mises à jour` : ""}` : ""}${sansVirt ? ` (« — » : ${fr(sansVirt)} pas encore lus)` : ""}.`
      : "Points virtuels des jeunes : calculés par la mise à jour en ligne du site."}
      Catégories de la FFTT : P poussins, B1 et B2 benjamins, M1 et M2 minimes, C1 et C2 cadets,
      J1 à J3 juniors, S seniors, V40… vétérans. Sans les licences loisir. ${CLUBS.filter((c) => !c.joueurs).length ? `${CLUBS.filter((c) => !c.joueurs).length} club(s) sans liste pour l'instant.` : ""}</p>
  </section>`;
}

/* ---------- Fiche d'un club ---------- */
function ficheClub(num) {
  const c = PAR_NUM.get(num), s = S.get(num);
  if (!c) return;
  const tuile = (n, v) => `<div class="tuile"><span class="n">${esc(n)}</span><b>${v}</b></div>`;
  const cats = s.cats ? D.categories.map((k) => `<span class="niv" title="${esc(CATS[k])}">${k} ${s.cats[k]}</span>`).join("") : "";
  const meilleurs = (c.joueurs || []).filter((j) => !j[3]).sort((a, b) => (b[0] || 0) - (a[0] || 0)).slice(0, 10);
  // Jeunes du club (points virtuels connus) : ceux qui ont gagné le plus de points depuis le début de la phase
  const jeunes = (c.joueurs || []).filter((j) => !j[3] && j[5] && JEUNES.includes(lettre(j[2])));
  const enProgres = jeunes.slice().sort((a, b) => b[5][1] - a[5][1] || b[5][0] - a[5][0]).slice(0, 8);
  document.getElementById("fiche-corps").innerHTML = `<h2 id="fiche-titre">${esc(c.nom)}</h2>
    <p class="intro">N° ${esc(c.numero)}${c.date_liste ? ` · liste des licenciés du ${c.date_liste.slice(8, 10)}/${c.date_liste.slice(5, 7)}` : " · liste des licenciés pas encore lue"}</p>
    <div class="tuiles">${tuile("Joueurs comptés", s.connu ? fr(s.joueurs) : "—")}${tuile("Femmes / hommes", s.connu ? `${s.F} / ${s.M}` : "—")}
      ${tuile("Moyenne des 4 meilleurs", fr(s.top4))}${tuile("Moyenne des 10 meilleurs", fr(s.top10))}${tuile("Équipes", s.equipes)}</div>
    ${cats ? `<p>${cats}</p>` : ""}
    <h3>Équipes</h3>${c.equipes.length ? `<table><tr><th>Équipe</th><th>Division</th><th class="n">Force estimée</th></tr>${c.equipes.map((e) =>
      `<tr><td>${esc(e.nom)}${e.feminin ? ' <span class="doux">féminine</span>' : ""}</td><td>${esc(e.division)}</td><td class="n">${fr(e.force)}</td></tr>`).join("")}</table>` : '<p class="vide">Aucune.</p>'}
    <h3>Meilleurs joueurs</h3>${meilleurs.length ? `<table><tr><th>Joueur</th><th>Cat.</th><th class="n">Points</th></tr>${meilleurs.map((j) =>
      `<tr><td>${esc(j[4])}${j[1] === "F" ? ' <span class="doux">F</span>' : ""}</td><td>${esc(j[2] || "—")}</td><td class="n">${fr(j[0])}</td></tr>`).join("")}</table>
      <p class="note"><a href="#joueurs" data-voir-club="${esc(c.numero)}">Tous les joueurs du club</a></p>` : '<p class="vide">Liste des licenciés pas encore lue.</p>'}
    ${jeunes.length ? `<h3>Jeunes en progression</h3>
      <p class="intro">${fr(jeunes.length)} jeune${jeunes.length > 1 ? "s" : ""} en compétition · ${signe(jeunes.reduce((a, j) => a + j[5][1], 0))} points à eux tous depuis le début de la phase</p>
      <table><tr><th>Joueur</th><th>Cat.</th><th class="n">Virtuels</th><th class="n">+/−</th></tr>${enProgres.map((j) =>
      `<tr><td>${esc(j[4])}${j[1] === "F" ? ' <span class="doux">F</span>' : ""}</td><td>${esc(j[2])}</td><td class="n">${fr(j[5][0])}</td><td class="n">${signe(j[5][1])}</td></tr>`).join("")}</table>
      <p class="note"><a href="#joueurs" data-voir-club="${esc(c.numero)}" data-jeunes>Tous les jeunes du club</a></p>` : ""}`;
  const d = document.getElementById("fiche");
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}
document.querySelector("#fiche .fermer").addEventListener("click", () => document.getElementById("fiche").close());
document.getElementById("fiche").addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-voir-club]");
  if (!a) return;
  vj = { ...vj, club: a.dataset.voirClub, q: "", n: 200, ...("jeunes" in a.dataset ? { cat: "jeunes", tri: { cle: "prog", sens: -1 } } : { cat: "" }) };
  document.getElementById("fiche").close();
  if (location.hash === "#joueurs") afficher();
});

/* ---------- Affichage et évènements ---------- */
const VUES = { clubs: vueClubs, classements: vueClassements, comparer: vueComparer, poules: vuePoules, joueurs: vueJoueurs };
let vue = "clubs";
function afficher() {
  const h = location.hash.slice(1);
  vue = VUES[h] ? h : (VUES[lire("77-vue")] ? lire("77-vue") : "clubs");
  ecrire("77-vue", vue);
  document.querySelectorAll(".onglets a").forEach((a) => a.setAttribute("aria-current", a.dataset.vue === vue ? "page" : "false"));
  document.getElementById("filtres-joueurs").hidden = vue === "poules" || vue === "joueurs";
  document.getElementById("vue").innerHTML = VUES[vue]();
  const r = document.getElementById("recherche");
  if (r) r.addEventListener("input", () => { recherche = r.value; const pos = r.selectionStart; afficher(); const n = document.getElementById("recherche"); n.focus(); n.setSelectionRange(pos, pos); });
  const rj = document.getElementById("recherche-j");
  if (rj) rj.addEventListener("input", () => { vj.q = rj.value; vj.n = 200; const pos = rj.selectionStart; afficher(); const n = document.getElementById("recherche-j"); n.focus(); n.setSelectionRange(pos, pos); });
}
document.getElementById("vue").addEventListener("click", (ev) => {
  if (ev.target.closest("[data-tout-compter]")) { filtre = PAR_DEFAUT(); changer(); return; }
  const tj = ev.target.closest("[data-tri-j]");
  if (tj) { const k = tj.dataset.triJ; vj.tri = { cle: k, sens: vj.tri.cle === k ? -vj.tri.sens : ["points", "virt", "prog"].includes(k) ? -1 : 1 }; afficher(); return; }
  if (ev.target.closest("[data-jeunes-prog]")) { vj = { ...vj, cat: "jeunes", tri: { cle: "prog", sens: -1 }, n: 200 }; afficher(); return; }
  const sj = ev.target.closest("#sexe-j button"); if (sj) { vj.sexe = sj.dataset.v; vj.n = 200; afficher(); return; }
  if (ev.target.id === "plus-j") { vj.n += 200; afficher(); return; }
  const t = ev.target.closest("[data-tri]");
  if (t) { const cle = t.dataset.tri; tri = { cle, sens: tri.cle === cle ? -tri.sens : cle === "nom" ? 1 : -1 }; ecrire("77-tri", JSON.stringify(tri)); afficher(); return; }
  const c = ev.target.closest("[data-club]"); if (c) { ficheClub(c.dataset.club); return; }
  const r = ev.target.closest("[data-retirer]"); if (r) { choisis = choisis.filter((n) => n !== r.dataset.retirer); sauverChoix(); afficher(); return; }
  if (ev.target.id === "vider") { choisis = []; sauverChoix(); afficher(); return; }
  if (ev.target.id === "comparer-poule") { prendrePoule(ev.target.dataset.poule); location.hash = "#comparer"; }
});
function prendrePoule(id) {
  const p = (D.poules || []).find((x) => String(x.id) === String(id));
  if (!p) return;
  choisis = [...new Set(p.equipes.filter((e) => PAR_NUM.has(e.club)).map((e) => e.club))].slice(0, MAX);
  sauverChoix();
}
document.getElementById("vue").addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "niveau") { niveauFiltre = t.value; afficher(); }
  else if (t.id === "mesure") { mesure = t.value; ecrire("77-mesure", mesure); afficher(); }
  else if (t.id === "ajout" && t.value) { if (choisis.length < MAX) choisis.push(t.value); sauverChoix(); afficher(); }
  else if (t.id === "poule-comparer" && t.value) { prendrePoule(t.value); afficher(); }
  else if (t.id === "poule") { pouleChoisie = t.value; ecrire("77-poule", t.value); afficher(); }
  else if (t.id === "cat-j") { vj.cat = t.value; vj.n = 200; afficher(); }
  else if (t.id === "club-j") { vj.club = t.value; vj.n = 200; afficher(); }
});
window.addEventListener("hashchange", afficher);
calculer(); colonnes(); boutonsFiltres(); afficher();
</script>
</body>
