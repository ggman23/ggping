<!doctype html>
<html lang="fr" data-racine="../" data-page="equipes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="cvtt-cle" content="cvtt-vaires-cle-club">
<meta name="theme-color" content="#0f2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVTT Vaires">
<title>Équipes · CVTT Vaires</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone-192.png">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<link rel="stylesheet" href="../commun.css?v=__VERSION__">
</head>
<body>
<main id="contenu"></main>
<script src="../commun.js?v=__VERSION__"></script>
<script>
"use strict";
const { $, esc, svg, COMPET } = V2;
const rang = (n) => n == null ? "–" : n === 1 ? "1er" : `${n}e`;

function carteEquipe(t) {
  const prochaine = t.rencontres.find(V2.aVenir), dernier = [...t.rencontres].reverse().find((r) => r.score);
  return `<a class="carte match ${t.comp}" href="#${t.cle}">
    <span class="picto">${svg(t.comp, true)}</span>
    <span class="quoi"><span class="equipe">${esc(t.nom)}</span> <span class="petit">· ${esc(t.age || t.division || "")}</span>
      <span class="quand">${esc(t.poule || "")}${prochaine ? ` · ${esc(V2.dateCourte(prochaine.date))} ${prochaine.exempt ? "exempt" : (prochaine.domicile ? "reçoit " : "chez ") + esc(prochaine.adversaire)}` : ""}</span></span>
    <span class="droite"><span class="score ${t.rang === 1 ? "v" : ""}" title="Place dans la poule">${rang(t.rang)}${t.nbEquipes ? `<small style="font-weight:600"> /${t.nbEquipes}</small>` : ""}</span>
      ${dernier ? `<span class="puce">dernier : <b class="${dernier.issue === "v" ? "hausse" : dernier.issue === "d" ? "baisse" : ""}">${dernier.score[0]}–${dernier.score[1]}</b></span>` : ""}</span></a>`;
}

function liste(eq) {
  V2.titre("Équipes", `${eq.length} équipes engagées`);
  const parComp = Object.keys(COMPET).map((c) => [c, eq.filter((t) => t.comp === c)]).filter(([, l]) => l.length);
  return V2.sousNav("equipes", "vaires") + parComp.map(([c, l]) => `<div class="section"><h2>${esc(COMPET[c].nom)}</h2></div><div class="pile">${l.map(carteEquipe).join("")}</div>`).join("")
    + `<p class="petit" style="margin-top:20px">Touche une équipe : sa poule, son calendrier, ses résultats et ses joueurs habituels.</p>`;
}

/* Vue par équipe : les pages du site actuel ouvertes sur cette équipe seulement (#seule/<code>) et ses images
   (prochain adversaire, feuille de match, joueurs disponibles et brûlés, progression), comme dans l'espace club. */
const PAGES_EQUIPE = [["vaires.html", "Adversaires", "Prochain adversaire, ses joueurs, compo probable"],
  ["rencontres_vaires.html", "Feuilles de match", "Chaque rencontre jouée : parties et scores"],
  ["classements_vaires.html", "Classement de la poule", "Points, victoires, nuls, défaites, départages"],
  ["effectif_vaires.html", "Effectif et brûlages", "Joueurs possibles et brûlés pour l'équipe"],
  ["progression_vaires.html", "Progression des joueurs", "Les joueurs de l'équipe semaine après semaine"],
  ["resultats_vaires.html", "Résultats des joueurs", "Points gagnés ou perdus à chaque journée"]];
const codeEquipe = (t) => t.comp === "femmes" ? `v${t.numero}f` : `v${t.numero}`;  // v2, v1f (pages du site) ; Paris, jeunes : v1...
function pagesEtImages(t, club) {
  const tuile = (href, ic, titre, texte) => `<a href="${href}">${svg(ic)}<span class="grow"><span class="nom" style="display:block">${esc(titre)}</span>
    <span class="petit">${esc(texte)}</span></span></a>`;
  const docs = club?.documents || [];
  let pages;
  if (t.comp === "paris" || t.comp === "jeunes") {
    pages = [tuile(`../../${t.comp}/#seule/${codeEquipe(t)}`, "page", `${COMPET[t.comp].nom} : ${t.nom}`, "Poule, calendrier, adversaires et leurs joueurs (site actuel)")];
    if (t.comp === "paris") pages.push(tuile("../../paris/#dispo", "agenda", "Disponibilités des joueurs", "Qui est disponible pour chaque journée (site actuel)"));
  } else {
    pages = PAGES_EQUIPE.filter(([f]) => docs.some((d) => d.fichier === f))
      .map(([f, titre, texte]) => tuile(`../club/#doc/${encodeURIComponent(f)}/seule/${codeEquipe(t)}`, "page", titre, texte));
  }
  const suffixe = new RegExp(`_${codeEquipe(t).toUpperCase()}(?:_|\\.)`);
  const images = t.comp === "paris" ? docs.filter((d) => d.groupe === "paris")
    : t.comp === "jeunes" ? [] : docs.filter((d) => d.type === "image" && suffixe.test(d.fichier));
  const affiche = t.comp === "paris" ? (club?.ressources || []).flatMap((r) => r.documents.map((d) => ({ ...d, rubrique: r.nom }))).filter((d) => /paris/.test(d.fichier)) : [];
  return `<div class="section"><h2>Les pages de ${esc(t.nom)}</h2><span class="petit">sur cette équipe seulement</span></div>
    <div class="liste">${pages.join("")}</div>`
    + (images.length || affiche.length ? `<div class="section"><h2>Les images de ${esc(t.nom)}</h2><span class="petit">à partager</span></div>
      <div class="liste">${images.map((d) => tuile(`../club/#doc/${encodeURIComponent(d.fichier)}`, "image", d.titre, d.date ? V2.dateCourte(d.date) : "")).join("")}
        ${affiche.map((d) => tuile(`../club/#res/${encodeURIComponent(d.rubrique)}/${encodeURIComponent(d.fichier)}`, "image", d.titre, d.rubrique)).join("")}</div>` : "");
}

async function detail(t) {
  V2.titre(t.nom, `${COMPET[t.comp].court} · ${t.age || t.division || ""}${t.poule ? " · " + t.poule : ""}`);
  const prochaine = t.rencontres.find(V2.aVenir);
  const lignes = t.classement;
  const vide = !lignes.some((l) => l.points != null);
  const classement = lignes.length ? `<div class="carte defile" style="padding:6px 4px"><table class="tableau"><thead><tr><th>#</th><th>Équipe</th>
      <th class="n">Pts</th><th class="n">J</th><th class="n">V</th><th class="n">N</th><th class="n">D</th></tr></thead><tbody>
      ${lignes.map((l, i) => `<tr class="${l.nous ? "nous" : ""}"><td>${l.rang ?? (vide ? "" : i + 1)}${l.departage ? ` <span title="${esc(l.departage)}">≡</span>` : ""}</td>
        <td style="white-space:normal">${esc(V2.joli(l.libelle))}</td><td class="n"><b>${l.points ?? "–"}</b></td><td class="n">${l.joues ?? "–"}</td>
        <td class="n">${l.v ?? "–"}</td><td class="n">${l.n ?? "–"}</td><td class="n">${l.d ?? "–"}</td></tr>`).join("")}</tbody></table>
      ${vide ? '<p class="petit" style="margin:8px">Classement disponible après la première journée.</p>' : ""}</div>` : "";
  let joueurs = "";
  if (t.comp === "france" || t.comp === "femmes") {
    const js = (await V2.joueurs().catch(() => [])).filter((j) => j.equipe && j.equipe.replace(/^V/, "") === `${t.numero}${t.comp === "femmes" ? " F" : ""}`);
    if (js.length) joueurs = `<div class="section"><h2>Joueurs habituels</h2><span class="petit">classement virtuel</span></div>
      <div class="liste">${js.map((j) => `<a href="../joueurs/#${esc(j.id)}" class="${j.id === V2.moi() ? "moi" : ""}"><span class="grow nom">${esc(j.nomComplet)}</span>
        <span>${V2.nombre(j.virtuels ?? j.officiels)}</span><span class="petit" style="min-width:42px;text-align:right">${j.gain == null ? "" : V2.signe(j.gain)}</span></a>`).join("")}</div>`;
  }
  const club = await V2.facultatif("club");
  return (prochaine ? `<div class="section"><h2>Prochaine rencontre</h2></div>${V2.carteMatch(prochaine, { journee: true })}` : "")
    + `<div class="section"><h2>Classement de la poule</h2></div>${classement}`
    + `<div class="section"><h2>Calendrier et résultats</h2></div>
       <div class="boutons" style="margin-bottom:10px"><button class="bouton second" type="button" id="ics">${svg("agenda")} Ajouter à mon agenda</button></div>
       <div class="pile">${t.rencontres.map((r) => V2.carteMatch(r, { journee: true })).join("")}</div>`
    + joueurs
    + pagesEtImages(t, club);
}

V2.demarrer({ titre: "Équipes" }, async () => {
  const m = $("#contenu");
  m.innerHTML = V2.squelettes(5);
  const eq = await V2.equipes();
  const afficher = async () => {
    const t = eq.find((x) => x.cle === decodeURIComponent(location.hash.slice(1)));
    m.innerHTML = t ? await detail(t) : liste(eq);
    m.classList.remove("apparait"); void m.offsetWidth; m.classList.add("apparait");
    const b = $("#ics");
    if (b && t) b.addEventListener("click", () => V2.ics(t.rencontres, `cvtt-vaires-${t.cle}.ics`));
    if (t) V2.ecrire(V2.R.dernier, t.cle);
    window.scrollTo(0, 0);
  };
  window.addEventListener("hashchange", afficher);
  await afficher();
});
</script>
</body>
</html>
