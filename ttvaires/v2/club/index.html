<!doctype html>
<html lang="fr" data-racine="../" data-page="club">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="cvtt-cle" content="cvtt-vaires-cle-club">
<meta name="theme-color" content="#0f2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVTT Vaires">
<title>Club · CVTT Vaires</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone-192.png">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<link rel="stylesheet" href="../commun.css?v=__VERSION__">
<style>
a.carte.tuile, .tuile { display: flex; gap: 12px; align-items: center; }
.tuile .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; background: var(--accent-fond); color: var(--accent); }
.tuile .ic svg { width: 22px; height: 22px; }
.tuile .ic.img { background: var(--paris-fond); color: var(--paris); }
.tuile .ic.doc { background: var(--jeunes-fond); color: var(--jeunes); }
.tuile .ic.esp { background: var(--dom-fond); color: var(--dom); }
/* Rubriques (28/11) : de grosses cartes sur l'accueil du club, une rangée de boutons dans chaque rubrique */
a.carte.rub { display: flex; gap: 14px; align-items: center; padding: 16px; }
.rub .pastille { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.rub .pastille svg { width: 27px; height: 27px; }
.rub b { font-size: 1.12rem; }
details.groupe { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); margin: 0 0 10px; overflow: hidden; }
details.groupe > summary { cursor: pointer; padding: 13px 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; list-style: none; }
details.groupe > summary::-webkit-details-marker { display: none; }
details.groupe > summary::before { content: "▸"; color: var(--doux); }
details.groupe[open] > summary::before { content: "▾"; }
details.groupe > summary .petit { margin-left: auto; }
details.groupe .liste { border: 0; border-top: 1px solid var(--bord); border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<main id="contenu"></main>
<script src="../commun.js?v=__VERSION__"></script>
<script>
"use strict";
const { $, esc, svg } = V2;
const GROUPES = ["récapitulatif", "programme", "paris", "jeunes", "classements", "adversaires", "résultats", "rencontres", "effectif", "classement virtuel", "progression", "individuels"];
const TITRES = { "récapitulatif": "Récapitulatif de la journée", "programme": "Programme des équipes", "paris": "Championnat de Paris",
  "jeunes": "Championnat des jeunes",
  "classements": "Classements des poules", "adversaires": "Adversaires", "résultats": "Résultats des joueurs", "rencontres": "Feuilles de match",
  "effectif": "Effectif et brûlages", "classement virtuel": "Classement virtuel", "progression": "Progression des joueurs", "individuels": "Individuels" };
const ESPACES = { paris: "Championnat de Paris", jeunes: "Championnat des jeunes", 77: "Clubs du 77", indivs: "Individuels (critérium)",
                  tournois: "Tournois autour de Vaires", cal: "Calendrier du comité" };
const taille = (o) => !o ? "" : o >= 1e6 ? `${(o / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} Mo` : `${Math.max(1, Math.round(o / 1e3))} Ko`;
let url = null;

const tuile = (href, ic, cls, titre, sous, nouveau) => `<a class="carte tuile" href="${href}"><span class="ic ${cls}">${svg(ic)}</span>
  <span style="min-width:0;flex:1"><b>${esc(titre)}</b>${sous ? `<br><span class="petit">${esc(sous)}</span>` : ""}</span>
  ${nouveau ? '<span class="puce nouveau">nouveau</span>' : ""}</a>`;

/* ---------- Rubriques : France, Paris, jeunes, joueurs, documents ; « Tout » garde la page complète ---------- */
const RUBRIQUES = [
  { id: "france", nom: "Championnat de France", texte: "Vaires 1 à 6 et Vaires 1 F : adversaires, feuilles, poules, résultats, brûlages", comp: "france" },
  { id: "paris", nom: "Championnat de Paris", texte: "Vaires 1 à 3 : poules, adversaires, feuilles de match, résultats, disponibilités", comp: "paris" },
  { id: "jeunes", nom: "Championnat des jeunes", texte: "Moins de 15 et moins de 13 ans : poules, adversaires, feuilles de match", comp: "jeunes" },
  { id: "joueurs", nom: "Joueurs du club", texte: "Classement virtuel, progression, fiches des joueurs", couleur: "#2b8a3e", ic: "joueurs" },
  { id: "individuels", nom: "Individuels", texte: "Critérium : poules et résultats des joueurs de Vaires", couleur: "#e8590c", ic: "etoile", lien: "../indivs/" },
  { id: "documents", nom: "Documents du club", texte: "Affiche, matériel, préparation mentale", couleur: "#8a5a00", ic: "club" },
  { id: "tout", nom: "Tout", texte: "Toutes les pages et toutes les images sur une seule page", couleur: "#495057", ic: "page" },
];
const RUB = Object.fromEntries(RUBRIQUES.map((r) => [r.id, r]));
const PAGES_JOUEURS = ["classement_virtuel.html", "progression_vaires.html", "fiches_vaires.html"];
const PAGES_CHAMP = { paris: ["rencontres_vaires.html", "classements_vaires.html", "resultats_vaires.html", "effectif_vaires.html"],
  jeunes: ["rencontres_vaires.html", "classements_vaires.html", "resultats_vaires.html"] };  // pages à sélecteur
const GROUPES_FRANCE = ["récapitulatif", "classements", "rencontres", "résultats", "adversaires", "effectif"];
const TYPES_CHAMP = [[/recap_/, "Récapitulatif de la journée"], [/classements_/, "Classements des poules"], [/rencontres_/, "Feuilles de match"],
  [/resultats_/, "Résultats des joueurs"], [/effectif_/, "Effectif et brûlages"], [/adversaires_/, "Prochains adversaires"],
  [/progression_/, "Progression des joueurs"], [/infographie/, "Infographie"], [/affiche/, "Affiche du championnat"], [/./, "Autres images"]];
const pastille = (r) => r.comp ? `<span class="pastille" style="background:var(--${r.comp})">${svg(r.comp, true)}</span>`
  : `<span class="pastille" style="background:${r.couleur}">${svg(r.ic)}</span>`;
const changer = (actif) => `<nav class="segments sous" aria-label="Rubriques du club">${RUBRIQUES.map((r) =>
  `<a href="${r.lien || "#r/" + r.id}" class="${r.id === actif ? "actif" : ""}">${esc(r.nom.replace(/^Championnat (de |des )/, "").replace(/^./, (c) => c.toUpperCase()).replace(" du club", ""))}</a>`).join("")}</nav>`;
function groupeImages(titre, liste, ouvert) {
  if (!liste.length) return "";
  return `<details class="groupe"${ouvert ? " open" : ""}><summary>${esc(titre)}<span class="petit">${liste.length} image${liste.length > 1 ? "s" : ""}</span></summary>
    <div class="liste">${liste.map((d) => `<a href="${d.rubrique ? `#res/${encodeURIComponent(d.rubrique)}/${encodeURIComponent(d.fichier)}` : `#doc/${encodeURIComponent(d.fichier)}`}">
      ${svg("image")}<span class="grow nom">${esc(d.titre)}</span>${V2.estNouveau(d.date) ? '<span class="puce nouveau">nouveau</span>' : ""}</a>`).join("")}</div></details>`;
}
function accueilRubriques(club, eq) {
  V2.titre("Club", "Choisis une rubrique");
  const mienne = eq.find((t) => t.cle === V2.lire(V2.R.equipe));
  return (mienne ? `<a class="carte" href="../equipes/#${mienne.cle}" style="display:flex;gap:12px;align-items:center;margin-bottom:10px">${svg("etoile")}
      <span><b>Mon équipe : ${esc(mienne.nom)}</b><br><span class="petit">tout sur ton équipe ›</span></span></a>` : "")
    + `<div class="pile">${RUBRIQUES.map((r) => `<a class="carte rub" href="${r.lien || "#r/" + r.id}">${pastille(r)}
      <span><b>${esc(r.nom)}</b><br><span class="petit">${esc(r.texte)}</span></span></a>`).join("")}</div>
    <div class="section"><h2>Autres espaces</h2></div><div class="liste">
      <a href="../77/">${svg("page")}<span class="grow nom">Clubs du 77</span></a><a href="../tournois/">${svg("page")}<span class="grow nom">Tournois</span></a>
      <a href="../agenda/#calendrier">${svg("agenda")}<span class="grow nom">Calendrier</span></a></div>
    <div class="section"><h2>Réglages</h2></div><div class="liste"><button type="button" id="ouvrir-reglages">${svg("reglages")}<span class="grow nom">Mon espace, taille du texte, apparence</span></button>
      <a href="../../club/">${svg("retour")}<span class="grow nom">Revenir au site actuel</span></a></div>`;
}
function vueRubrique(club, eq, id) {
  const r = RUB[id];
  V2.titre(r.nom, "Club");
  const docs = club.documents || [], images = docs.filter((d) => d.type === "image"), pages = docs.filter((d) => d.type !== "image");
  const prog = images.filter((d) => d.groupe === "programme");
  const tete = changer(id) + `<p class="petit" style="margin:4px 2px 12px">${esc(r.texte)}.</p>`;
  if (id === "documents") return tete + ((club.ressources || []).map((rb) => `<div class="section"><h2>${esc(rb.nom)}</h2></div><div class="grille">${rb.documents.map((d) =>
    tuile(`#res/${encodeURIComponent(rb.nom)}/${encodeURIComponent(d.fichier)}`, d.type === "image" ? "image" : "page", "doc", d.titre,
      [d.description, d.type === "pdf" ? "PDF" : "", d.taille ? taille(d.taille) : ""].filter(Boolean).join(" · "), false)).join("")}</div>`).join("")
    || '<p class="vide">Aucun document pour le moment.</p>');
  let liste = [], groupes = [];
  if (id === "france") {
    liste = pages.filter((d) => !PAGES_JOUEURS.includes(d.fichier)).map((d) => tuile(`#doc/${encodeURIComponent(d.fichier)}`, d.type === "excel" ? "telecharger" : "page", "", d.titre,
      [d.description, verifie(d.verification)].filter(Boolean).join(" · "), V2.estNouveau(d.date)));
    groupes = [...GROUPES_FRANCE.map((g) => [TITRES[g] || g, images.filter((d) => d.groupe === g)]), ["Programme des équipes", prog]];
  } else if (id === "paris" || id === "jeunes") {
    liste = [tuile(`../../${id}/`, "page", "", `${r.nom} : poules et adversaires`, "Calendrier, salles, classement, joueurs des clubs adverses", false)];
    if (id === "paris") liste.push(tuile("../../paris/#dispo", "agenda", "", "Disponibilités des joueurs", "Qui est disponible pour chaque journée", false));
    liste.push(...PAGES_CHAMP[id].map((f) => pages.find((d) => d.fichier === f)).filter(Boolean).map((d) =>
      tuile(`#doc/${encodeURIComponent(d.fichier)}/${id}`, "page", "", d.titre, `${r.nom} seulement`, false)));
    const siennes = [...images.filter((d) => d.groupe === id),
      ...(id === "paris" ? (club.ressources || []).flatMap((rb) => rb.documents.filter((d) => d.type === "image" && /paris/i.test(d.fichier)).map((d) => ({ ...d, rubrique: rb.nom }))) : [])];
    groupes = [...TYPES_CHAMP.map(([, titre]) => [titre, siennes.filter((d) => (TYPES_CHAMP.find(([m]) => m.test(d.fichier)) || [])[1] === titre)]), ["Programme des équipes", prog]];
  } else if (id === "joueurs") {
    liste = PAGES_JOUEURS.map((f) => pages.find((d) => d.fichier === f)).filter(Boolean).map((d) => tuile(`#doc/${encodeURIComponent(d.fichier)}`, "page", "", d.titre, d.description, V2.estNouveau(d.date)));
    liste.unshift(tuile("../joueurs/", "joueurs", "", "Joueurs de Vaires", "Points, courbe et fiche de chaque joueur (v2)", false));
    groupes = [["Classement virtuel", images.filter((d) => d.groupe === "classement virtuel")], ["Progression des joueurs", images.filter((d) => d.groupe === "progression")]];
  }
  const equipes = r.comp ? eq.filter((t) => r.comp === "france" ? ["france", "femmes"].includes(t.comp) : t.comp === r.comp) : [];
  const avec = groupes.filter(([, l]) => l.length);
  return tete
    + (equipes.length ? `<div class="section"><h2>Une seule équipe</h2></div><div class="segments" style="flex-wrap:wrap">${equipes.map((t) =>
        `<a href="../equipes/#${t.cle}">${esc(t.nom.replace(/ · .*/, ""))}</a>`).join("")}</div>` : "")
    + (liste.length ? `<div class="section"><h2>Les pages</h2></div><div class="grille">${liste.join("")}</div>` : "")
    + (avec.length ? `<div class="section"><h2>Les images à partager</h2></div>${avec.map(([t, l], i) => groupeImages(t, l, i === 0)).join("")}`
      : '<p class="vide">Pas encore d\'image pour cette rubrique : elles arrivent avec les résultats.</p>');
}

const verifie = (v) => !v ? "" : /NON GÉNÉRÉE|manquant|non lues|non récupéré/.test(v) ? `⚠ ${v}` : v;
function accueil(club, eq) {
  V2.titre("Tout le club", "Documents, images et espaces");
  const docs = club.documents || [], images = docs.filter((d) => d.type === "image"), pages = docs.filter((d) => d.type !== "image");
  const lien = (d) => `#doc/${encodeURIComponent(d.fichier)}`;
  // Par équipe : la fiche de chaque équipe (ses pages sur cette équipe seulement, ses images)
  let html = eq.length ? `<div class="section"><h2>Par équipe</h2><span class="petit">seulement ce qui concerne une équipe</span></div>
    <div class="segments" style="flex-wrap:wrap">${eq.map((t) => `<a href="../equipes/#${t.cle}">${esc(t.nom.replace(/ · .*/, ""))}${t.comp === "paris" ? " Paris" : t.comp === "jeunes" ? " " + esc(t.age ? t.age.replace("moins de ", "−").replace(" ans", "") : "jeunes") : ""}</a>`).join("")}</div>` : "";
  // Documents fournis (affiche, matériel, préparation mentale) : en tête, pour ne pas les chercher
  for (const r of club.ressources || []) html += `<div class="section"><h2>${esc(r.nom)}</h2></div><div class="grille">${r.documents.map((d) =>
    tuile(`#res/${encodeURIComponent(r.nom)}/${encodeURIComponent(d.fichier)}`, d.type === "image" ? "image" : "page", "doc", d.titre,
      [d.description, d.type === "pdf" ? "PDF" : "", d.taille ? taille(d.taille) : ""].filter(Boolean).join(" · "), false)).join("")}</div>`;
  html += `<div class="section"><h2>Pages détaillées</h2><span class="petit">tableaux complets du site actuel</span></div>
    <div class="grille">${pages.map((d) => tuile(lien(d), d.type === "excel" ? "telecharger" : "page", "", d.titre,
      [d.description, verifie(d.verification)].filter(Boolean).join(" · "), V2.estNouveau(d.date))).join("")}</div>`;
  html += `<div class="section" id="images"><h2>Images à partager</h2></div>`;
  for (const g of GROUPES) {
    const l = images.filter((d) => d.groupe === g);
    if (!l.length) continue;
    html += `<h3 style="margin:14px 2px 8px;font-size:.92rem">${esc(TITRES[g] || g)}</h3><div class="grille">${l.map((d) =>
      tuile(lien(d), "image", "img", d.titre, d.date ? V2.dateCourte(d.date) : "", V2.estNouveau(d.date))).join("")}</div>`;
  }
  if ((club.archives || []).length) html += `<div class="section"><h2>Archives du championnat de France</h2></div><div class="liste">${club.archives.map((a) =>
    `<a href="../../club/#archives/${encodeURIComponent(a.cle)}">${svg("club")}<span class="grow nom">${esc(a.titre)}</span><span class="petit">${esc(a.date_reference ? V2.dateCourte(a.date_reference) : "")}</span></a>`).join("")}</div>`;
  // Autres espaces : la page de la v2 quand elle existe, sinon celle du site actuel
  const V2_PAGES = { indivs: "../indivs/", 77: "../77/", tournois: "../tournois/", cal: "../agenda/#calendrier" };
  html += `<div class="section"><h2>Autres espaces</h2></div><div class="grille">${(club.espaces || []).map((e) =>
    tuile(V2_PAGES[e.chemin] || `../../${encodeURIComponent(e.chemin)}/`, V2_PAGES[e.chemin] ? "page" : "externe", "esp", ESPACES[e.chemin] || e.titre,
      V2_PAGES[e.chemin] ? "" : "site actuel", false)).join("")}</div>`;
  if (V2.admin()) html += `<div class="section"><h2>Administration</h2></div><div class="liste">
    <a href="https://ggman23.github.io/ggping/" target="_blank" rel="noopener">${svg("externe")}<span class="grow nom">Lancer une mise à jour du site</span></a>
    <a href="../../lundi/">${svg("etoile")}<span class="grow nom">Le roi du lundi</span></a></div>`;
  return html + `<div class="boutons" style="margin-top:16px"><button class="bouton second" type="button" id="tout">${svg("telecharger")} Tout télécharger (${docs.length} fichiers)</button></div>
    <div class="section"><h2>Réglages</h2></div><div class="liste"><button type="button" id="ouvrir-reglages">${svg("reglages")}<span class="grow nom">Mon espace, taille du texte, apparence</span></button>
    <a href="../../club/">${svg("retour")}<span class="grow nom">Revenir au site actuel</span></a></div>`;
}

const MOBILE = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || window.__appliCvtt;
const PDF_INTEGRE = navigator.pdfViewerEnabled === true && !MOBILE;
async function vue(d, rubrique, suite = null) {
  V2.titre(d.titre, rubrique || (d.type === "image" ? TITRES[d.groupe] || "Image" : "Page du site actuel"));
  const m = $("#contenu");
  m.innerHTML = '<p class="vide">Ouverture…</p>';
  if (url) { URL.revokeObjectURL(url); url = null; }
  const blob = await V2.fichierClub(d.apercu || d.chemin, d.apercu ? "x.jpg" : d.fichier);
  url = URL.createObjectURL(blob);
  const original = () => d.apercu ? V2.fichierClub(d.chemin, d.fichier) : Promise.resolve(blob);
  const boutons = `<div class="boutons" style="margin:10px 0">
    <button class="bouton" type="button" id="tele">${svg("telecharger")} Télécharger</button>
    ${d.type === "image" ? `<button class="bouton second" type="button" id="part" hidden>${svg("partager")} Partager</button>` : ""}</div>`;
  if (d.type === "page") m.innerHTML = `<iframe class="cadre" title="${esc(d.titre)}" src="${url}${suite ? "#" + suite : ""}"${rubrique ? ' sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms"' : ""}></iframe>`;
  else if (d.type === "pdf" && PDF_INTEGRE) m.innerHTML = `${boutons}<iframe class="cadre" title="${esc(d.titre)}" src="${url}"></iframe>`;
  else if (d.type === "image") m.innerHTML = `${boutons}<div class="vue-image"><img src="${url}" alt="${esc(d.titre)}"></div>
    ${d.apercu ? `<p class="petit" style="text-align:center">Aperçu allégé : « Télécharger » donne l'original${d.dimensions ? ` (${d.dimensions.join(" × ")} pixels)` : ""}.</p>` : ""}`;
  else m.innerHTML = `<div class="carte" style="text-align:center"><h3>${esc(d.titre)}</h3><p class="petit">${esc(d.description || "")}</p>${boutons}</div>`;
  const tele = $("#tele");
  if (tele) tele.addEventListener("click", async () => {
    tele.disabled = true;
    try { const b = await original(); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = d.fichier.replace(/^.*\//, "").replace(/\.chiffre$/, ""); document.body.append(a); a.click(); a.remove(); }
    finally { tele.disabled = false; }
  });
  const part = $("#part");
  if (part && navigator.canShare && navigator.canShare({ files: [new File([blob], "x.png", { type: blob.type })] })) {
    part.hidden = false;
    part.addEventListener("click", async () => { try { const b = await original(); await navigator.share({ files: [new File([b], d.fichier.replace(/\.chiffre$/, ""), { type: b.type })] }); } catch (e) { /* annulé */ } });
  }
}

// Document introuvable ou illisible (copie pas encore à jour, réseau) : un message plutôt qu'« Ouverture… » sans fin
async function ouvrir(f) {
  try { await f(); }
  catch (e) {
    $("#contenu").innerHTML = `<div class="carte"><b>Ce document ne s'ouvre pas pour le moment.</b>
      <p class="petit">${esc(e.message)} · <a href="../../club/">l'ouvrir dans l'espace club du site actuel</a></p></div>`;
  }
}
V2.demarrer({ titre: "Club" }, async () => {
  const m = $("#contenu");
  m.innerHTML = V2.squelettes(6);
  const [club, eq] = await Promise.all([V2.donnees("club"), V2.equipes().catch(() => [])]);
  const afficher = async () => {
    const h = location.hash.slice(1), retour = $(".haut .bouton-haut");
    if (h.startsWith("doc/")) {
      // #doc/<fichier>[/<suite>] : suite = seule/v2 (une équipe), paris (championnat de la page), paris/seule/v2
      const [fichier, ...suite] = decodeURIComponent(h.slice(4)).split("/");
      const d = (club.documents || []).find((x) => x.fichier === fichier);
      if (d) return ouvrir(() => vue(d, null, suite.join("/") || null));
    }
    if (h.startsWith("r/") && RUB[h.slice(2)]) {
      const id = h.slice(2);
      if (id !== "tout") { m.innerHTML = vueRubrique(club, eq, id); window.scrollTo(0, 0); return; }
    }
    if (!h) {
      m.innerHTML = accueilRubriques(club, eq);
      const r = $("#ouvrir-reglages");
      if (r) r.addEventListener("click", () => $("#v2-reglages").click());
      window.scrollTo(0, 0);
      return;
    }
    if (h.startsWith("res/")) {
      const [nom, fichier] = h.slice(4).split("/").map(decodeURIComponent);
      const d = (club.ressources || []).find((r) => r.nom === nom)?.documents.find((x) => x.fichier === fichier);
      if (d) return ouvrir(() => vue(d, nom));
    }
    m.innerHTML = changer("tout") + accueil(club, eq);
    $("#tout").addEventListener("click", async (ev) => {  // tous les fichiers du jour, l'un après l'autre (comme l'espace club)
      const b = ev.currentTarget; b.disabled = true;
      const docs = club.documents || [];
      for (const [i, d] of docs.entries()) {
        b.textContent = `Téléchargement ${i + 1}/${docs.length}…`;
        try { const blob = await V2.fichierClub(d.chemin, d.fichier); const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
          a.download = d.fichier; document.body.append(a); a.click(); a.remove(); } catch (e) { /* fichier suivant */ }
        await new Promise((ok) => setTimeout(ok, 600));
      }
      b.disabled = false; b.textContent = "Tout télécharger";
    });
    const b = $("#ouvrir-reglages");
    if (b) b.addEventListener("click", () => $("#v2-reglages").click());
    if (h === "images") $("#images").scrollIntoView(); else window.scrollTo(0, 0);
  };
  window.addEventListener("hashchange", afficher);
  await afficher();
});
</script>
</body>
