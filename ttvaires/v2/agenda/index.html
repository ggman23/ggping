<!doctype html>
<html lang="fr" data-racine="../" data-page="agenda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="cvtt-cle" content="cvtt-vaires-cle-club">
<meta name="theme-color" content="#0f2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVTT Vaires">
<title>Agenda · CVTT Vaires</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone-192.png">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<link rel="stylesheet" href="../commun.css?v=__VERSION__">
<style>
.jour { margin: 16px 2px 8px; font-weight: 750; font-size: .92rem; display: flex; gap: 8px; align-items: baseline; }
.jour .petit { font-weight: 500; }
a.carte.evenement, .evenement { display: flex; gap: 10px; align-items: center; }
.evenement .puce { flex: 0 0 auto; }
.mois { position: sticky; top: 60px; z-index: 5; background: var(--fond); padding: 8px 2px 4px; margin-top: 18px; text-transform: capitalize; }
@media (min-width: 900px) { .mois { top: 108px; } }
.indivs { --c: #0e8a7e; --cf: #dff3f0; }
.comite { --c: #7a8699; --cf: var(--surface2); }
/* Vue calendrier : une grille par mois */
.entete-mois { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.entete-mois h2 { flex: 1; text-align: center; text-transform: capitalize; font-size: 1.15rem; }
.entete-mois button { border: 1px solid var(--bord); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 1.2rem; }
.grille-mois { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.grille-mois .tete { text-align: center; font-size: .72rem; color: var(--doux); font-weight: 700; padding: 2px 0; }
.grille-mois .case { min-height: 58px; border: 1px solid var(--bord); background: var(--surface); border-radius: 10px; padding: 4px; text-align: left;
  display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; color: inherit; }
.grille-mois .case.vide { background: transparent; border-color: transparent; cursor: default; }
.grille-mois .num { font-size: .8rem; font-weight: 700; align-self: flex-start; padding: 0 4px; border-radius: 6px; }
.grille-mois .auj .num { background: var(--accent); color: #fff; }
.grille-mois .choisi { outline: 2px solid var(--accent); outline-offset: -1px; }
.grille-mois .week-end { background: var(--surface2); }
.marques { display: flex; flex-wrap: wrap; gap: 2px; }
.marques i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); font-style: normal; font-size: 0; color: transparent; overflow: hidden; }
.legende { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
@media (min-width: 700px) {
  .grille-mois .case { min-height: 92px; }
  .marques i { width: auto; height: auto; border-radius: 6px; padding: 1px 5px; color: #fff; font-size: .66rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
}
</style>
</head>
<body>
<main id="contenu"></main>
<script src="../commun.js?v=__VERSION__"></script>
<script>
"use strict";
const { $, esc, svg, COMPET } = V2;
const DOUBLONS = ["equipes", "feminin", "paris", "jeunes"];  // déjà là avec les vraies rencontres de Vaires
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const COURT = { france: "V", femmes: "V", paris: "P", jeunes: "J" };
let quand = "avenir", quoi = "vaires", mois = V2.AUJ.slice(0, 7), choisi = V2.AUJ;

/* Tout ce qui se passe, jour par jour : rencontres de Vaires, tours des individuels, dates du comité */
function elements(eq, cal, indivs) {
  const l = V2.rencontres(eq).map((r) => ({ date: r.date, ordre: 0, c: r.equipe.comp, html: V2.carteMatch(r, { avecDate: false }),
    court: `${COURT[r.equipe.comp]}${r.equipe.numero}${r.equipe.comp === "femmes" ? "F" : ""}${r.exempt ? "" : r.domicile ? " dom." : " ext."}` }));
  const tours = {};
  for (const p of indivs?.poules || []) {
    const n = (p.joueurs || []).filter((j) => j.vaires).length;
    if (!n || !p.date) continue;
    const t = (tours[p.date] ||= { poules: 0, joueurs: 0, competition: p.competition, horaire: p.horaire });
    t.poules += 1; t.joueurs += n;
  }
  for (const [date, t] of Object.entries(tours)) l.push({ date, ordre: 1, c: "indivs", court: "Indivs", html: `<a class="carte evenement" href="../indivs/">
    <span class="puce comp indivs">Indivs</span><span><b>${esc(t.competition)}</b><br><span class="petit">${t.joueurs} joueur${t.joueurs > 1 ? "s" : ""} de Vaires
    · ${t.poules} poule${t.poules > 1 ? "s" : ""}${t.horaire ? " · " + esc(t.horaire) : ""}</span></span></a>` });
  if (quoi === "tout") for (const e of cal?.evenements || []) {
    if (DOUBLONS.includes(e.cat)) continue;
    const cat = (cal.categories || []).find((c) => c.cle === e.cat) || {};
    const html = `<div class="carte evenement"><span class="puce">${esc(cat.court || "Comité")}</span>
      <span><b>${esc(e.titre)}</b>${e.detail ? `<br><span class="petit">${esc(e.detail)}</span>` : ""}${e.fin && e.fin !== e.debut ? `<br><span class="petit">jusqu'au ${esc(V2.dateCourte(e.fin))}</span>` : ""}</span></div>`;
    // Évènement sur plusieurs jours (stage, championnats...) : sur chaque jour, une semaine au plus
    for (let d = V2.enDate(e.debut), k = 0; k < 7 && V2.iso(d) <= (e.fin || e.debut); d.setDate(d.getDate() + 1), k++) {
      l.push({ date: V2.iso(d), ordre: 2, c: "comite", court: e.court || cat.court || "Comité", html, suite: k > 0 });
    }
  }
  return l;
}
const seg = (nom, val, actuelle, k) => `<button type="button" data-${k}="${val}" class="${val === actuelle ? "actif" : ""}">${nom}</button>`;

function vueListe(eq, cal, indivs) {
  let l = elements(eq, cal, indivs).filter((x) => !x.suite && x.date && (quand === "avenir" ? x.date >= V2.AUJ : x.date < V2.AUJ));
  l.sort((a, b) => (quand === "avenir" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date)) || a.ordre - b.ordre);
  let html = `<div class="segments">${seg("À venir", "avenir", quand, "quand")}${seg("Passé", "passe", quand, "quand")}<span style="width:8px"></span>
      ${seg("Vaires", "vaires", quoi, "quoi")}${seg("Tout le comité", "tout", quoi, "quoi")}</div>
    <div class="boutons" style="margin:6px 0 4px"><button class="bouton second" type="button" id="ics">${svg("agenda")} Ajouter les matchs de Vaires à mon agenda</button></div>`;
  let m = "", jour = "";
  for (const x of l) {
    const d = V2.enDate(x.date), nom = `${MOIS[d.getMonth()]} ${d.getFullYear()}`;
    if (nom !== m) { html += `<h2 class="mois">${nom}</h2>`; m = nom; jour = ""; }
    if (x.date !== jour) { html += `<div class="jour">${esc(V2.dateLongue(x.date))}<span class="petit">${Math.abs(V2.ecart(x.date)) < 14 ? esc(V2.relatif(x.date)) : ""}</span></div>`; jour = x.date; }
    html += `<div class="pile" style="margin-bottom:8px">${x.html}</div>`;
  }
  return html + (l.length ? "" : '<p class="vide">Rien à afficher.</p>')
    + `<p class="petit" style="margin-top:18px">L'export agenda est fabriqué sur ton téléphone : rien n'est envoyé.</p>`;
}

function vueCalendrier(eq, cal, indivs) {
  const l = elements(eq, cal, indivs), parJour = {};
  for (const x of l) (parJour[x.date] ||= []).push(x);
  const [a, mo] = mois.split("-").map(Number), premier = new Date(a, mo - 1, 1), decale = (premier.getDay() + 6) % 7;
  const nb = new Date(a, mo, 0).getDate();
  let cases = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."].map((j) => `<div class="tete">${j}</div>`).join("");
  cases += '<div class="case vide"></div>'.repeat(decale);
  for (let j = 1; j <= nb; j++) {
    const iso = `${mois}-${String(j).padStart(2, "0")}`, xs = (parJour[iso] || []).sort((p, q) => p.ordre - q.ordre), we = (decale + j - 1) % 7 >= 5;
    cases += `<button type="button" class="case${we ? " week-end" : ""}${iso === V2.AUJ ? " auj" : ""}${iso === choisi ? " choisi" : ""}" data-jour="${iso}"
      aria-label="${esc(V2.dateLongue(iso))} : ${xs.length} évènement(s)"><span class="num">${j}</span>
      <span class="marques">${xs.slice(0, 6).map((x) => `<i class="${x.c}" title="${esc(x.court)}">${esc(x.court)}</i>`).join("")}</span></button>`;
  }
  const xs = (parJour[choisi] || []).sort((p, q) => p.ordre - q.ordre);
  return `<div class="segments">${seg("Vaires", "vaires", quoi, "quoi")}${seg("Tout le comité", "tout", quoi, "quoi")}</div>
    <div class="entete-mois"><button type="button" data-mois="-1" aria-label="Mois précédent">‹</button><h2>${MOIS[mo - 1]} ${a}</h2>
      <button type="button" data-mois="1" aria-label="Mois suivant">›</button></div>
    <div class="grille-mois">${cases}</div>
    <div class="legende">${[["france", "France"], ["femmes", "Femmes"], ["paris", "Paris"], ["jeunes", "Jeunes"], ["indivs", "Individuels"], ...(quoi === "tout" ? [["comite", "Comité"]] : [])]
      .map(([c, n]) => `<span class="puce comp ${c}">${n}</span>`).join("")}${mois !== V2.AUJ.slice(0, 7) ? '<button type="button" class="puce" data-auj="1" style="border:0;cursor:pointer">aujourd\'hui</button>' : ""}</div>
    <div class="section"><h2>${esc(V2.dateLongue(choisi))}</h2><span class="petit">${Math.abs(V2.ecart(choisi)) < 14 ? esc(V2.relatif(choisi)) : ""}</span></div>
    <div class="pile">${xs.map((x) => x.html).join("") || '<p class="vide">Rien ce jour-là.</p>'}</div>`;
}

V2.demarrer({ titre: "Agenda", sous: "Matchs de Vaires et dates du comité" }, async () => {
  const m = $("#contenu");
  m.innerHTML = V2.squelettes(5);
  const [eq, cal, indivs] = await Promise.all([V2.equipes(), V2.facultatif("agenda"), V2.facultatif("indivs")]);
  const afficher = () => {
    const calendrier = location.hash === "#calendrier";
    V2.titre(calendrier ? "Calendrier" : "Agenda", calendrier ? "Le mois en un coup d'œil" : "Matchs de Vaires et dates du comité");
    m.innerHTML = V2.sousNav("agenda", calendrier ? "calendrier" : "liste") + (calendrier ? vueCalendrier(eq, cal, indivs) : vueListe(eq, cal, indivs));
    m.querySelectorAll("[data-quand]").forEach((b) => b.addEventListener("click", () => { quand = b.dataset.quand; afficher(); }));
    m.querySelectorAll("[data-quoi]").forEach((b) => b.addEventListener("click", () => { quoi = b.dataset.quoi; afficher(); }));
    m.querySelectorAll("[data-jour]").forEach((b) => b.addEventListener("click", () => { choisi = b.dataset.jour; afficher(); }));
    m.querySelectorAll("[data-mois]").forEach((b) => b.addEventListener("click", () => {
      const [a, mo] = mois.split("-").map(Number), d = new Date(a, mo - 1 + Number(b.dataset.mois), 1);
      mois = V2.iso(d).slice(0, 7); choisi = mois === V2.AUJ.slice(0, 7) ? V2.AUJ : `${mois}-01`; afficher();
    }));
    const auj = m.querySelector("[data-auj]");
    if (auj) auj.addEventListener("click", () => { mois = V2.AUJ.slice(0, 7); choisi = V2.AUJ; afficher(); });
    const ics = $("#ics");
    if (ics) ics.addEventListener("click", () => V2.ics(V2.rencontres(eq).filter((r) => r.date >= V2.AUJ), "cvtt-vaires-matchs.ics"));
  };
  window.addEventListener("hashchange", afficher);
  afficher();
});
</script>
</body>
</html>
