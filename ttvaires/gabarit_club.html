<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="cvtt-cle" content="cvtt-vaires-cle-club"><!-- repère de l'application Android (android/src/.../Principale.java) -->
<title>CVTT Vaires · espace club</title>
<style>
:root { color-scheme: light dark; --fond: #eef1f5; --surface: #fff; --surface2: #f3f5f8; --texte: #1c2330; --doux: #5b6576;
  --bord: #dde1e7; --accent: #1f5fbf; --accent-fond: #e8f0fc; --bandeau: #173b60; --bandeau-texte: #fff;
  --ok: #1d7a46; --ok-fond: #e3f4ea; --att: #8a5a00; --att-fond: #fff4d6; --ko: #b3261e; --ko-fond: #fbe7e5;
  --page: #1f5fbf; --excel: #1d7a46; --image: #b0306a; --archive: #8a5a00; --pdf: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --fond: #12151b; --surface: #1b2029; --surface2: #232a35; --texte: #e6e9ef;
  --doux: #9aa4b5; --bord: #313a48; --accent: #7fb0ff; --accent-fond: #1d2a40; --bandeau: #0f2236;
  --ok: #6fd39b; --ok-fond: #173323; --att: #f3cd6b; --att-fond: #3a3014; --ko: #ff8f86; --ko-fond: #3d1c1a;
  --page: #7fb0ff; --excel: #6fd39b; --image: #f28dbd; --archive: #d9a441; --pdf: #ff8a80; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- Connexion ---------- */
#connexion { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
#connexion form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--bord); border-radius: 16px;
  padding: 28px 22px; box-shadow: 0 8px 30px rgba(0, 0, 0, .08); text-align: center; }
.marque { width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 16px; background: var(--bandeau); display: grid; place-items: center; }
#connexion h1 { font-size: 22px; margin: 0; }
#connexion p { color: var(--doux); margin: 4px 0 20px; font-size: 14.5px; }
#connexion input[type=password] { width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--bord); border-radius: 10px;
  background: var(--surface); color: var(--texte); }
#connexion label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0 16px; font-size: 14.5px; color: var(--doux); }
.principal { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 650; font-size: 16.5px; }
.principal:disabled { opacity: .6; }
#erreur { color: var(--ko); min-height: 1.4em; margin: 12px 0 0; font-size: 14.5px; }

/* ---------- Application ---------- */
#appli { height: 100%; display: flex; flex-direction: column; }
.barre { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bandeau); color: var(--bandeau-texte); }
.barre .titres { flex: 1 1 auto; min-width: 0; }
.barre b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .titres span { display: block; font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre button { flex: none; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff;
  border-radius: 9px; padding: 7px 12px; font-size: 14.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.barre button:hover { background: rgba(255, 255, 255, .22); }
.barre svg { width: 18px; height: 18px; }
.corps { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 330px 1fr; }

#menu { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--bord); padding: 8px 10px 24px; }
#menu h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin: 16px 8px 6px; }
.raccourcis { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 6px 2px; }
.raccourcis span { font-size: 12.5px; color: var(--doux); margin-right: 2px; }
.raccourcis a { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--bord); background: var(--surface2); color: var(--texte);
  font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.raccourcis a:hover { border-color: var(--accent); }
#menu h3 { font-size: 13.5px; color: var(--doux); margin: 12px 8px 2px; font-weight: 600; }
.doc { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 9px; border: 0; border-radius: 10px;
  background: none; color: inherit; text-decoration: none; }
.doc:hover { background: var(--surface2); }
.doc.actif { background: var(--accent-fond); }
.doc .icone { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.doc .icone svg { width: 19px; height: 19px; }
.icone.page { background: var(--page); } .icone.excel { background: var(--excel); } .icone.image { background: var(--image); }
.icone.archive { background: var(--archive); } .icone.pdf { background: var(--pdf); }
.doc .texte { min-width: 0; flex: 1 1 auto; }
.doc .texte b { display: block; font-size: 15px; font-weight: 600; }
.doc .texte span { display: block; font-size: 12.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc.image-doc { padding: 6px 9px; }
.doc.image-doc .icone { width: 28px; height: 28px; border-radius: 7px; }
.doc.image-doc .texte b { font-size: 14.5px; font-weight: 500; }
.pied-menu { margin: 18px 8px 0; display: grid; gap: 8px; }
.second { padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--surface2); color: var(--texte); font-weight: 600; }
.lien { border: 0; background: none; color: var(--doux); text-decoration: underline; font-size: 13.5px; padding: 4px; }
.petit { color: var(--doux); font-size: 12.5px; margin: 0; }

#vue { min-width: 0; min-height: 0; overflow: auto; position: relative; }
#vue iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.accueil { max-width: 860px; margin: 0 auto; padding: 28px 22px 40px; }
.accueil h1 { font-size: 24px; margin: 0 0 4px; }
.accueil > p { color: var(--doux); margin: 0 0 22px; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tuile { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px; border: 1px solid var(--bord); border-radius: 14px;
  background: var(--surface); color: inherit; text-decoration: none; }
.tuile:hover { border-color: var(--accent); }
.tuile .icone { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.tuile .icone svg { width: 21px; height: 21px; }
.tuile b { font-size: 16.5px; }
.tuile span { color: var(--doux); font-size: 13.5px; }
.etat { align-self: flex-start; font-size: 12.5px; border-radius: 6px; padding: 2px 8px; }
.ok { background: var(--ok-fond); color: var(--ok); } .att { background: var(--att-fond); color: var(--att); } .ko { background: var(--ko-fond); color: var(--ko); }
.neutre { background: var(--surface2); color: var(--doux); }
.image-vue { padding: 14px; display: flex; justify-content: center; }
.image-vue img { width: 100%; max-width: 1080px; height: auto; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, .12); background: #fff; }
.note-apercu { margin: 0 auto 18px; padding: 0 16px; max-width: 1080px; font-size: 13px; color: var(--doux); text-align: center; }
.carte-excel { max-width: 460px; margin: 48px auto; padding: 26px 22px; border: 1px solid var(--bord); border-radius: 16px; background: var(--surface); text-align: center; }
.carte-excel .icone { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--excel); }
.carte-excel .icone svg { width: 30px; height: 30px; }
.carte-excel h2 { margin: 0 0 4px; font-size: 20px; }
.carte-excel p { color: var(--doux); margin: 0 0 18px; }
.message { padding: 40px 20px; text-align: center; color: var(--doux); }
.titre-section { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); margin: 28px 0 10px; }
.etiquette { font-size: 13px; font-weight: 600; vertical-align: middle; color: var(--archive); border: 1px solid var(--archive);
  border-radius: 6px; padding: 1px 7px; }
.liste-images { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; padding: 4px 8px 8px; }
.liste-images h3 { font-size: 13.5px; color: var(--doux); margin: 12px 8px 2px; font-weight: 600; }
.ligne-bas { margin-top: 16px; }

/* Rubriques (accueil) : de gros boutons, un par rubrique ; dans une rubrique, une rangée de boutons pour changer */
.rubriques { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.rubrique { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; border: 1px solid var(--bord);
  background: var(--surface); color: inherit; text-decoration: none; min-height: 84px; }
.rubrique:hover { border-color: var(--accent); }
.rubrique .pastille { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
.rubrique .pastille svg { width: 28px; height: 28px; }
.rubrique b { display: block; font-size: 18.5px; line-height: 1.25; }
.rubrique span.texte { display: block; font-size: 14px; color: var(--doux); margin-top: 2px; }
.rubrique.tout { border-style: dashed; }
.changer { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin: 0 0 14px; border-bottom: 1px solid var(--bord); scrollbar-width: thin; }
.changer a { flex: none; padding: 9px 16px; border-radius: 99px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte);
  text-decoration: none; font-weight: 650; font-size: 15.5px; }
.changer a.actif { background: var(--bandeau); border-color: var(--bandeau); color: #fff; }
.autres { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.autres a { padding: 9px 14px; border-radius: 12px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); text-decoration: none; font-weight: 600; }
details.groupe-images { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; margin: 0 0 10px; }
details.groupe-images > summary { cursor: pointer; padding: 13px 16px; font-weight: 650; font-size: 16px; list-style: none; display: flex; gap: 10px; align-items: center; }
details.groupe-images > summary::-webkit-details-marker { display: none; }
details.groupe-images > summary::before { content: "▸"; color: var(--doux); transition: transform .15s; }
details.groupe-images[open] > summary::before { transform: rotate(90deg); }
details.groupe-images > summary .nb { margin-left: auto; font-size: 13px; color: var(--doux); font-weight: 500; }
details.groupe-images .liste { padding: 0 8px 8px; }
.menu-rubrique { display: flex; align-items: center; gap: 11px; padding: 10px 9px; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; font-size: 15.5px; }
.menu-rubrique:hover { background: var(--surface2); }
.menu-rubrique.actif { background: var(--accent-fond); }
.menu-rubrique .pastille { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.menu-rubrique .pastille svg { width: 18px; height: 18px; }

/* Téléphone : pas de menu à gauche ; l'accueil (les gros boutons) sert de menu, « Retour » remonte d'un cran */
@media (max-width: 860px) {
  .corps { grid-template-columns: 1fr; }
  #menu { display: none; }
  #appli:not(.document) #retour { display: none; }
  .barre .libelle { display: none; }
  .accueil { padding: 16px 12px 32px; }
  .rubriques { grid-template-columns: 1fr; gap: 10px; }
}
@media (min-width: 861px) { #appli:not(.document) #retour, #appli.sans-retour #retour { display: none; } }
/* Vue par équipe : un bouton par équipe */
.equipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 4px; }
.equipes a { display: block; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bord); background: var(--surface);
  color: inherit; text-decoration: none; }
.equipes a b { display: block; font-size: 15px; }
.equipes a span { display: block; font-size: 12px; color: var(--doux); }
.equipes a.actif, .equipes a:hover { border-color: var(--accent); background: var(--accent-fond); }
.mon-equipe { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--bandeau);
  color: #fff; text-decoration: none; margin: 8px 0 2px; }
.mon-equipe b { font-size: 17px; }
.mon-equipe span { opacity: .85; font-size: 13px; }
</style>
</head>
<body>
<div id="connexion">
  <form id="formulaire" autocomplete="on">
    <div class="marque"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 14.6 20.5 20.5" stroke="#f8cbad" stroke-width="3.6" stroke-linecap="round"/><circle cx="10" cy="10" r="7" fill="#e03131" stroke="#fff" stroke-width="1.4"/><circle cx="19.4" cy="4.6" r="2.2" fill="#f08c00"/></svg></div>
    <h1>CVTT Vaires</h1>
    <p>Espace club : pages, Excel et images du championnat</p>
    <input type="text" name="username" value="club" autocomplete="username" hidden>
    <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" required>
    <label><input type="checkbox" id="retenir" checked> Se souvenir sur cet appareil</label>
    <button class="principal" id="entrer">Entrer</button>
    <p id="erreur" role="alert"></p>
  </form>
</div>

<div id="appli" hidden>
  <header class="barre">
    <button id="retour" aria-label="Retour au menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Menu</span></button>
    <div class="titres"><b id="titre">CVTT Vaires · espace club</b><span id="sous-titre"></span></div>
    <button id="partager" aria-label="Partager" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span class="libelle">Partager</span></button>
    <button id="telecharger" aria-label="Télécharger" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="libelle">Télécharger</span></button>
  </header>
  <div class="corps">
    <nav id="menu" aria-label="Documents"></nav>
    <main id="vue"></main>
  </div>
</div>

<script id="donnees" type="application/json">__DONNEES_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("donnees").textContent);
const CLE = "cvtt-vaires-cle-club";  // distincte de celle de /gg/ (autre mot de passe, même site)
const GROUPES = ["récapitulatif", "programme", "paris", "classements", "adversaires", "résultats", "rencontres", "effectif", "classement virtuel", "progression", "individuels"];
const TITRES_GROUPES = { "récapitulatif": "Récapitulatif de la journée (à compléter avec la photo)",
  "programme": "Programme des équipes (France, Paris, jeunes)", "paris": "Championnat de Paris", "jeunes": "Championnat des jeunes",
  "classements": "Classements des poules",
  "adversaires": "Adversaires", "résultats": "Résultats des joueurs", "rencontres": "Feuilles de match",
  "effectif": "Effectif et brûlages", "classement virtuel": "Classement virtuel", "progression": "Progression des joueurs",
  "individuels": "Individuels (poules du critérium)" };
const TYPES = { html: "text/html;charset=utf-8", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", pdf: "application/pdf",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
const ICONES = {
  page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  excel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 17v-4h1.3a1.2 1.2 0 0 1 0 2.4H8.5M13 13v4h1a2 2 0 0 0 0-4z"/></svg>',
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lire = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ecrire = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* navigation privée */ } };
const quand = (iso) => iso ? new Date(iso).toLocaleString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const octets = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const b64 = (o) => btoa(String.fromCharCode(...o));
const classe = (r) => /NON GÉNÉRÉE|manquant|non lues|non récupéré/.test(r || "") ? "ko" : /indisponible|pas encore/.test(r || "") ? "att" : "ok";

/* Documents : ceux de la journée en cours, et ceux de chaque archive (journées passées). */
function preparer(liste, archive = null) {
  return liste.slice().sort((a, b) => (a.ordre ?? 99) - (b.ordre ?? 99)).map((d) => ({
    ...d, archive,
    id: archive ? `${archive.cle}/${d.fichier}` : d.fichier,
    chemin: d.chemin || `fichiers/${d.fichier}.chiffre`,
    // Fichier d'une archive : nommé avec sa journée (J2_resultats_vaires.html), sauf s'il l'est déjà (recap_J2.png)
    nom: archive && !d.fichier.includes(`J${archive.journee}`) ? `J${archive.journee}_${d.fichier}` : d.fichier,
  }));
}
const triImages = (a, b) => GROUPES.indexOf(a.groupe) - GROUPES.indexOf(b.groupe) || a.ordre - b.ordre;
const pagesDe = (liste) => liste.filter((d) => d.type !== "image");
const imagesDe = (liste) => liste.filter((d) => d.type === "image").sort(triImages);
const docs = preparer(D.documents);
const archives = (D.archives || []).map((a) => ({ ...a, docs: preparer(a.documents, a) }));
/* Rubriques permanentes après les archives (Matériel, Prépa mentale...) : documents fournis (ressources.py) */
const rubriques = (D.ressources || []).map((r) => ({ ...r, docs: r.documents.map((d) => ({
  ...d, rubrique: r.nom, id: `ressources/${d.fichier}`, nom: d.fichier })) }));
/* Espaces à leur propre adresse (/indivs/, /tournois/), même mot de passe : la clé gardée ici les ouvre directement */
const ESPACES = D.espaces || [];
const lienEspace = (e) => `<a class="doc" href="../${encodeURIComponent(e.chemin)}/"><span class="icone page">${ICONES.page}</span>
  <span class="texte"><b>${esc(e.titre)}</b><span>/${esc(e.chemin)}/</span></span></a>`;
/* Vue par équipe : chaque équipe de Vaires (France, femmes, Paris, jeunes) avec ses pages, en vue « une seule équipe »
   (#seule/<code> dans la page), et ses images à partager (prochain adversaire, feuille de match, disponibles, brûlés,
   progression). Le reste de l'espace club ne change pas. */
const EQUIPES = D.equipes || [];
const EQUIPE_CLE = "cvtt-club-equipe";  // dernière équipe choisie sur cet appareil
const NOMS_COMP = { france: "Championnat de France", femmes: "Championnat féminin", paris: "Championnat de Paris", jeunes: "Championnat des jeunes" };
const PAGES_EQUIPE = [["vaires.html", "Adversaires", "Prochain adversaire, ses joueurs, compo probable, calendrier"],
  ["rencontres_vaires.html", "Feuilles de match", "Chaque rencontre jouée : parties, joueurs, scores"],

async function deriver(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256",
    salt: new TextEncoder().encode(D.sel), iterations: D.iterations }, base, 256));
}
async function dechiffrer(chemin, k = cle, type = "application/octet-stream") {
  const r = await fetch(`${chemin.split("/").map(encodeURIComponent).join("/")}?v=${encodeURIComponent(D.maj || "")}`);
  if (!r.ok) throw new Error(`fichier introuvable (${r.status})`);
  const brut = new Uint8Array(await r.arrayBuffer());
  const cleAes = await crypto.subtle.importKey("raw", k, "AES-GCM", false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: brut.slice(0, 12) }, cleAes, brut.slice(12));
  const blob = await new Response(new Blob([clair]).stream().pipeThrough(new DecompressionStream("gzip"))).blob();
  return new Blob([blob], { type });
}

  const id = `${doc.id}#apercu`;

  ["resultats_vaires.html", "Résultats des joueurs", "Points gagnés ou perdus à chaque journée"]] };
function vueEquipe(t) {
  const lien = (d) => `#equipe/${encodeURIComponent(t.code)}/${encodeURIComponent(d.id)}`;
  const pages = t.espace
    ? [`<a class="tuile" href="../${t.espace}/#seule/${encodeURIComponent(t.seule)}"><span class="icone page" style="background: var(--page)">${ICONES.page}</span>
        <b>${esc(NOMS_COMP[t.competition])} : ${esc(t.nom)}</b><span>Poule, calendrier, adversaires et leurs joueurs (vue de l'équipe seulement)</span></a>`]
      .concat(t.espace === "paris" ? [`<a class="tuile" href="../paris/#dispo"><span class="icone page" style="background: var(--page)">${ICONES.page}</span>
        <b>Disponibilités des joueurs</b><span>Qui est disponible pour chaque journée</span></a>`] : [])
      .concat((PAGES_CHAMP[t.espace] || []).filter(([f]) => parId.has(f)).map(([f, titre, texte]) => `<a class="tuile" href="${lien(parId.get(f))}">
        <span class="icone page" style="background: var(--page)">${ICONES.page}</span><b>${esc(titre)}</b><span>${esc(texte)}</span></a>`))
    : PAGES_EQUIPE.filter(([f]) => parId.has(f)).map(([f, titre, texte]) => `<a class="tuile" href="${lien(parId.get(f))}">
        <span class="icone page" style="background: var(--page)">${ICONES.page}</span><b>${esc(titre)}</b><span>${esc(texte)}</span></a>`);
  const imgs = [...imagesEquipe(t), ...images.filter((d) => d.groupe === "programme")];
  return `<div class="accueil"><h1>${esc(t.nom)}</h1>
    <p>${esc([NOMS_COMP[t.competition], t.division, t.poule].filter(Boolean).join(" · "))}. Seulement ce qui concerne ${esc(t.nom)} :
      les pages s'ouvrent sur cette équipe (lien « Voir toutes les équipes » en haut de chacune).</p>
    <h2 class="titre-section">Ses pages</h2><div class="tuiles">${pages.join("")}</div>
    ${imgs.length ? `<h2 class="titre-section">Ses images à partager</h2><div class="tuiles">${imgs.map((d) => `<a class="tuile" href="${lien(d)}">
      <span class="icone image" style="background: var(--image)">${ICONES.image}</span><b>${esc(d.titre)}</b>
      <span>${esc(d.rubrique || TITRES_GROUPES[d.groupe] || "")}</span></a>`).join("")}</div>` : ""}
    ${t.espace && !imgs.length ? "<p>Pas encore de résultats ni d'images pour cette équipe : ils arriveront avec les premières journées.</p>" : ""}
    <h2 class="titre-section">Les autres équipes</h2>${choixEquipes(t.code)}</div>`;
}
function tuile(d, href = null) {
  return `<a class="tuile" href="${href || "#" + encodeURIComponent(d.id)}">
    <span class="icone ${d.type}" style="background: var(--${d.type})">${ICONES[d.type]}</span><b>${esc(d.titre)}</b>
    <span>${esc(d.type === "image" && !d.rubrique ? A_LA_UNE_TEXTE[d.groupe] || "" : d.description)}</span>
    ${d.type === "pdf" ? `<span class="etat neutre">PDF${d.taille ? " · " + taille(d.taille) : ""}</span>` : ""}
    ${d.verification ? `<span class="etat ${classe(d.verification)}">${esc(d.verification)}</span>` : ""}</a>`;
}
function accueil() {
  const mienne = EQUIPES.find((t) => t.code === lire(EQUIPE_CLE));
  const autres = ESPACES.filter((e) => !["paris", "jeunes", "indivs"].includes(e.chemin));
  return `<div class="accueil"><h1>Espace club</h1><p>Choisis une rubrique.</p>
    ${mienne ? `<a class="mon-equipe" href="#equipe/${encodeURIComponent(mienne.code)}" style="margin-bottom:14px"><b>Ton équipe : ${esc(mienne.nom)}</b><span>tout sur ton équipe ›</span></a>` : ""}
    <div class="rubriques">${RUBRIQUES.map((r) => `<a class="rubrique${r.id === "tout" ? " tout" : ""}" href="#rubrique/${r.id}">
      <span class="pastille" style="background: ${r.couleur}">${PICTOS[r.id]}</span><span><b>${esc(r.nom)}</b><span class="texte">${esc(r.texte)}</span></span></a>`).join("")}</div>
    ${autres.length ? `<h2 class="titre-section">Autres espaces</h2><div class="autres">${autres.map((e) =>
      `<a href="../${encodeURIComponent(e.chemin)}/">${esc(e.titre)}</a>`).join("")}</div>` : ""}
    <p class="petit" style="margin-top:22px">Mise à jour : ${esc(quand(D.maj))}. Fichiers lisibles sans connexion : à garder dans le club.</p>
    <button class="lien" id="quitter-accueil">Oublier le mot de passe sur cet appareil</button></div>`;
}
/* « Tout » : la page complète d'avant (toutes les pages, les images à la une, puis toutes les images, archives, documents) */
function vueTout() {
  const mienne = null;
  return `
    ${EQUIPES.length ? `<h2 class="titre-section">Par équipe</h2>
      ${mienne ? `<a class="mon-equipe" href="#equipe/${encodeURIComponent(mienne.code)}"><b>Ton équipe : ${esc(mienne.nom)}</b><span>ses pages et ses images ›</span></a>` : ""}
      <p>Seulement ce qui concerne une équipe (adversaires, feuilles de match, poule, effectif, images) :</p>${choixEquipes(null)}
      <h2 class="titre-section">Toutes les équipes</h2>` : ""}
    <p>Choisis une page, l'Excel ou une image : tu peux la regarder ici puis la télécharger.</p>
    <div class="tuiles">${[...recaps, ...pages].map(tuile).join("")}</div>
    ${archives.length ? `<h2 class="titre-section">Archives des journées passées</h2><div class="tuiles">${archives.map((a) =>
      `<a class="tuile" href="#archives/${encodeURIComponent(a.cle)}"><span class="icone archive">${ICONES.archive}</span>
        <b>${esc(a.titre)}</b><span>Phase ${esc(a.phase)} ${esc(a.saison)} · état au ${esc(jour(a.date_reference))}</span></a>`).join("")}</div>` : ""}
    ${rubriques.map((r) => `<h2 class="titre-section">${esc(r.nom)}</h2><div class="tuiles">${r.docs.map(tuile).join("")}</div>`).join("")}
    ${images.length ? `<h2 class="titre-section">Toutes les images à partager</h2><div class="liste-images">${listeImages(images)}</div>` : ""}
    ${ESPACES.length ? `<h2 class="titre-section">Autres espaces</h2><div class="tuiles">${ESPACES.map((e) =>
      `<a class="tuile" href="../${encodeURIComponent(e.chemin)}/"><span class="icone page" style="background: var(--page)">${ICONES.page}</span>
        <b>${esc(e.titre)}</b><span>/${esc(e.chemin)}/ · même mot de passe que l'espace club</span></a>`).join("")}</div>` : ""}
    <div class="ligne-bas"><button class="second" id="tout-tout">Tout télécharger (${docs.length} fichiers)</button></div>`;
}
function vueArchive(a) {
  const imgs = imagesDe(a.docs);
  return `<div class="accueil"><h1>${esc(a.titre)} du championnat de France <span class="etiquette">archive</span></h1>
    <p>Phase ${esc(a.phase)} ${esc(a.saison)} : les pages, l'Excel et les images telles qu'au ${esc(jour(a.date_reference))}
      (veille de la journée suivante).</p>
    <div class="tuiles">${[...imgs.filter((d) => A_LA_UNE.includes(d.groupe)), ...pagesDe(a.docs)].map(tuile).join("")}</div>
    ${imgs.length ? `<h2 class="titre-section">Images</h2><div class="liste-images">${listeImages(imgs)}</div>` : ""}
    <div class="ligne-bas"><button class="second" id="tout-archive">Tout télécharger (${a.docs.length} fichiers)</button></div>
  </div>`;
}
async function route() {
  if (!cle) return;
  const h = decodeURIComponent(location.hash.slice(1));
  const archive = h.startsWith("archives/") ? archives.find((a) => a.cle === h.slice(9)) || null : null;
  const mEq = /^equipe\/([a-z0-9]+)(?:\/(.+))?$/.exec(h);
  const equipe = mEq ? EQUIPES.find((t) => t.code === mEq[1]) || null : null;
  const mRub = /^rubrique\/([a-z]+)(?:\/(.+))?$/.exec(h);
  const rubrique = mRub && RUB[mRub[1]] ? mRub[1] : null;
  const doc = archive ? null : parId.get(equipe ? mEq[2] || "" : rubrique ? mRub[2] || "" : h) || null;
  const appli = document.getElementById("appli"), vue = document.getElementById("vue");
  const actif = rubrique ? `rubrique/${rubrique}` : equipe ? "rubrique/equipes" : doc?.archive || archive ? "rubrique/archives" : h;
  if (equipe) ecrire(EQUIPE_CLE, equipe.code);
  // Page ouverte sur l'équipe : #seule/v2 (championnat de France) ou #paris/seule/v2 (sélecteur de la page sur Paris)
  seuleCourante = equipe && doc && doc.type === "page" ? `${equipe.espace ? equipe.espace + "/" : ""}seule/${equipe.seule}` : null;
  // Rubrique Paris ou jeunes : les pages à sélecteur s'ouvrent sur ce championnat (#paris)
  if (rubrique && doc && doc.type === "page" && (PAGES_CHAMP[rubrique] || []).some(([f]) => f === doc.fichier)) seuleCourante = rubrique;
  document.querySelectorAll("#menu .doc, #menu .menu-rubrique").forEach((a) => a.classList.toggle("actif", a.dataset.id === actif));
  if (urlCourante) { URL.revokeObjectURL(urlCourante); urlCourante = null; }
  courant = doc;
  retourVers = doc?.archive ? `archives/${doc.archive.cle}` : equipe && doc ? `equipe/${equipe.code}` : rubrique && doc ? `rubrique/${rubrique}`
    : equipe ? "rubrique/equipes" : archive ? "rubrique/archives" : "";
  document.querySelector("#retour span").textContent = retourVers.startsWith("equipe/") ? "Équipe" : retourVers.startsWith("archives/") ? "Archive"
    : retourVers.startsWith("rubrique/") ? (RUB[retourVers.slice(9)]?.id === "equipes" ? "Équipes" : "Retour") : "Accueil";
  appli.classList.toggle("document", !!(doc || archive || equipe || rubrique));
  // Ordinateur : le menu de gauche suffit pour une rubrique ; « Retour » sert quand un document ou une équipe est ouvert
  appli.classList.toggle("sans-retour", !!rubrique && !doc);
  document.getElementById("telecharger").hidden = !doc;
  document.getElementById("partager").hidden = true;
  const titre = document.getElementById("titre"), sous = document.getElementById("sous-titre");
  if (archive) {
    titre.textContent = `${archive.titre} · championnat de France · archive`;
    sous.textContent = `Phase ${archive.phase} · état au ${jour(archive.date_reference)}`;
    vue.innerHTML = vueArchive(archive);
    document.getElementById("tout-archive").addEventListener("click", (ev) => toutTelecharger(archive.docs, ev.target, archive));
    vue.scrollTop = 0;
    compter(`/club/archives/${archive.cle}`, `Archive · ${archive.titre}`);
    return;
  }
  if (equipe && !doc) {
    titre.textContent = `${equipe.nom} · espace club`;
    sous.textContent = [NOMS_COMP[equipe.competition], equipe.division].filter(Boolean).join(" · ");
    vue.innerHTML = vueEquipe(equipe);
    vue.scrollTop = 0;
    compter(`/club/equipe/${equipe.code}`, `Par équipe · ${equipe.nom}`);
    return;
  }
  if (rubrique && !doc) {
    titre.textContent = RUB[rubrique].nom;
    sous.textContent = `Espace club · mise à jour : ${quand(D.maj)}`;
    vue.innerHTML = vueRubrique(rubrique);
    const tout = document.getElementById("tout-tout");
    if (tout) tout.addEventListener("click", (ev) => toutTelecharger(docs, ev.target));
    const actifs = vue.querySelector(".changer .actif");
    if (actifs) actifs.scrollIntoView({ inline: "center", block: "nearest" });
    vue.scrollTop = 0;
    compter(`/club/rubrique/${rubrique}`, `Rubrique · ${RUB[rubrique].nom}`);
    return;
  }
  if (!doc) {
    titre.textContent = "CVTT Vaires · espace club";
    sous.textContent = `Mise à jour : ${quand(D.maj)}`;
    vue.innerHTML = accueil();
    document.getElementById("quitter-accueil").addEventListener("click", quitter);
    vue.scrollTop = 0;
    compter("/club/", "Accueil de l'espace club");
    return;
  }
  titre.textContent = doc.archive ? `${doc.archive.titre} · ${doc.titre}` : doc.titre;
  sous.textContent = doc.archive ? `Archive · état au ${jour(doc.archive.date_reference)}`
    : rubrique && RUB[rubrique] ? RUB[rubrique].nom : doc.rubrique || (doc.type === "image" ? TITRES_GROUPES[doc.groupe] || "" : quand(doc.date));
  vue.innerHTML = '<p class="message">Ouverture…</p>';
  compter(`/club/${nomCompte(doc)}`, titreCompte(doc));
  try {
    // Grande image (affiche 8K...) : on affiche son aperçu allégé ; « Télécharger » et « Partager » donnent l'original
    const blob = doc.apercu ? await apercu(doc) : await contenu(doc);
    if (courant !== doc) return;  // un autre document a été choisi entre-temps
    if (doc.type === "page") {
      urlCourante = URL.createObjectURL(blob);
      // Page fournie (rubriques) : isolée de l'espace club (pas d'accès à la clé ni aux autres documents)
      const isolee = doc.rubrique ? ' sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms"' : "";
      vue.innerHTML = `<iframe title="${esc(doc.titre)}" src="${urlCourante}${seuleCourante ? "#" + seuleCourante : ""}"${isolee}></iframe>`;
    } else if (doc.type === "pdf" && PDF_INTEGRE) {
      urlCourante = URL.createObjectURL(blob);
      vue.innerHTML = `<iframe title="${esc(doc.titre)}" src="${urlCourante}"></iframe>`;
    } else if (doc.type === "pdf") {
      urlCourante = URL.createObjectURL(blob);
      vue.innerHTML = `<div class="carte-excel"><div class="icone" style="background: var(--pdf)">${ICONES.pdf}</div><h2>${esc(doc.titre)}</h2>
        <p>${esc(doc.description)}<br>PDF${doc.taille ? " · " + taille(doc.taille) : ""} : il s'ouvre avec le lecteur PDF de l'appareil.</p>
        <button class="principal" id="ouvrir-pdf">Ouvrir le PDF</button></div>`;
      document.getElementById("ouvrir-pdf").addEventListener("click", () => {
        // iPhone, iPad : nouvel onglet ; Android (navigateur ou application) : téléchargé puis ouvert
        if (!(IOS && window.open(urlCourante, "_blank"))) enregistrer(blob, doc.nom);
        compter(`club/telechargement/${nomCompte(doc)}`, `Ouverture · ${titreCompte(doc)}`, true);
      });
    } else if (doc.type === "image") {
      urlCourante = URL.createObjectURL(blob);
      vue.innerHTML = `<div class="image-vue"><img src="${urlCourante}" alt="${esc(doc.titre)}"></div>`
        + (doc.apercu ? `<p class="note-apercu">Aperçu allégé. « Télécharger » donne l'original en pleine résolution
          (${doc.dimensions ? doc.dimensions.join(" × ") + " pixels, " : ""}${taille(doc.taille)}).</p>` : "");
      const fichier = new File([blob], doc.nom, { type: blob.type || "image/png" });  // PNG ou JPEG
      document.getElementById("partager").hidden = !(navigator.canShare && navigator.canShare({ files: [fichier] }));
    } else {
      vue.innerHTML = `<div class="carte-excel"><div class="icone">${ICONES.excel}</div><h2>${esc(doc.titre)}</h2>
        <p>${esc(doc.description)}<br>S'ouvre avec Excel, LibreOffice ou Google Sheets.</p>
        <button class="principal" id="telecharger-excel">Télécharger ${esc(doc.nom)}</button></div>`;
      document.getElementById("telecharger-excel").addEventListener("click", () => {
        enregistrer(blob, doc.nom);
        compter(`club/telechargement/${nomCompte(doc)}`, `Téléchargement · ${titreCompte(doc)}`, true);
      });
    }
    vue.scrollTop = 0;
  } catch (e) {
    vue.innerHTML = `<p class="message">Impossible d'ouvrir ce document (${esc(e.message)}).</p>`;
  }
}
function enregistrer(blob, nom) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
document.getElementById("telecharger").addEventListener("click", async () => {
  if (!courant) return;
  const bouton = document.getElementById("telecharger"), libelle = bouton.querySelector(".libelle");
  bouton.disabled = true; libelle.textContent = "Préparation…";  // un original de 15 Mo met quelques secondes
  try { enregistrer(await contenu(courant), courant.nom); }
  finally { bouton.disabled = false; libelle.textContent = "Télécharger"; }
  compter(`club/telechargement/${nomCompte(courant)}`, `Téléchargement · ${titreCompte(courant)}`, true);
});
document.getElementById("partager").addEventListener("click", async () => {
  if (!courant) return;
  const doc = courant;
  try {
    const blob = await contenu(doc);
    await navigator.share({ files: [new File([blob], doc.nom, { type: blob.type || "image/png" })] });
    compter(`club/partage/${nomCompte(doc)}`, `Partage · ${titreCompte(doc)}`, true);
  } catch (e) { /* partage annulé */ }
});
/* Retour : d'un document d'archive vers son archive, sinon vers le menu. (Pas history.back() : les
   onglets d'une page affichée, J1, J2, Cumul..., ajoutent eux aussi des étapes à l'historique.) */
document.getElementById("retour").addEventListener("click", () => { location.hash = retourVers; });
async function toutTelecharger(liste, bouton, archive = null) {
  const libelle = bouton.textContent;
  bouton.disabled = true;
  compter(archive ? `club/tout-telecharger/${archive.cle}` : "club/tout-telecharger",
          archive ? `Tout télécharger · ${archive.titre}` : "Tout télécharger", true);
  try {
    for (const [i, d] of liste.entries()) {
      bouton.textContent = `Téléchargement ${i + 1}/${liste.length}…`;
      enregistrer(await contenu(d), d.nom);
      await new Promise((ok) => setTimeout(ok, 600));  // le navigateur enchaîne mieux les téléchargements
    }
  } catch (e) {
    alert("Téléchargement interrompu : " + e.message);
  } finally {
    bouton.disabled = false;
    bouton.textContent = libelle;
  }
}
window.addEventListener("hashchange", route);

/* Clé déjà mémorisée sur cet appareil : on entre directement. */
(async () => {
  const memo = lire(CLE);
  if (!memo) { document.getElementById("mdp").focus(); compter("/club/connexion", "Connexion à l'espace club"); return; }
  try { await entrer(octets(memo)); }
  catch (e) { ecrire(CLE, null); document.getElementById("mdp").focus(); compter("/club/connexion", "Connexion à l'espace club"); }
})();
</script>
