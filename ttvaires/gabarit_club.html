<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CVTT Vaires · espace club</title>
<style>
:root { color-scheme: light dark; --fond: #eef1f5; --surface: #fff; --surface2: #f3f5f8; --texte: #1c2330; --doux: #5b6576;
  --bord: #dde1e7; --accent: #1f5fbf; --accent-fond: #e8f0fc; --bandeau: #173b60; --bandeau-texte: #fff;
  --ok: #1d7a46; --ok-fond: #e3f4ea; --att: #8a5a00; --att-fond: #fff4d6; --ko: #b3261e; --ko-fond: #fbe7e5;
  --page: #1f5fbf; --excel: #1d7a46; --image: #b0306a; --archive: #8a5a00; }
@media (prefers-color-scheme: dark) { :root { --fond: #12151b; --surface: #1b2029; --surface2: #232a35; --texte: #e6e9ef;
  --doux: #9aa4b5; --bord: #313a48; --accent: #7fb0ff; --accent-fond: #1d2a40; --bandeau: #0f2236;
  --ok: #6fd39b; --ok-fond: #173323; --att: #f3cd6b; --att-fond: #3a3014; --ko: #ff8f86; --ko-fond: #3d1c1a;
  --page: #7fb0ff; --excel: #6fd39b; --image: #f28dbd; --archive: #d9a441; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- Connexion ---------- */
#connexion { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
#connexion form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--bord); border-radius: 16px;
  padding: 28px 22px; box-shadow: 0 8px 30px rgba(0, 0, 0, .08); text-align: center; }
.marque { width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 16px; background: var(--bandeau); display: grid; place-items: center; }
#connexion h1 { font-size: 22px; margin: 0; }
#connexion p { color: var(--doux); margin: 4px 0 20px; font-size: 14.5px; }
#connexion input[type=password] { width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--bord); border-radius: 10px;
  background: var(--surface); color: var(--texte); }
#connexion label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0 16px; font-size: 14.5px; color: var(--doux); }
.principal { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 650; font-size: 16.5px; }
.principal:disabled { opacity: .6; }
#erreur { color: var(--ko); min-height: 1.4em; margin: 12px 0 0; font-size: 14.5px; }

/* ---------- Application ---------- */
#appli { height: 100%; display: flex; flex-direction: column; }
.barre { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bandeau); color: var(--bandeau-texte); }
.barre .titres { flex: 1 1 auto; min-width: 0; }
.barre b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .titres span { display: block; font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre button { flex: none; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff;
  border-radius: 9px; padding: 7px 12px; font-size: 14.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.barre button:hover { background: rgba(255, 255, 255, .22); }
.barre svg { width: 18px; height: 18px; }
.corps { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 330px 1fr; }

#menu { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--bord); padding: 8px 10px 24px; }
#menu h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin: 16px 8px 6px; }
#menu h3 { font-size: 13.5px; color: var(--doux); margin: 12px 8px 2px; font-weight: 600; }
.doc { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 9px; border: 0; border-radius: 10px;
  background: none; color: inherit; text-decoration: none; }
.doc:hover { background: var(--surface2); }
.doc.actif { background: var(--accent-fond); }
.doc .icone { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.doc .icone svg { width: 19px; height: 19px; }
.icone.page { background: var(--page); } .icone.excel { background: var(--excel); } .icone.image { background: var(--image); }
.icone.archive { background: var(--archive); }
.doc .texte { min-width: 0; flex: 1 1 auto; }
.doc .texte b { display: block; font-size: 15px; font-weight: 600; }
.doc .texte span { display: block; font-size: 12.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc.image-doc { padding: 6px 9px; }
.doc.image-doc .icone { width: 28px; height: 28px; border-radius: 7px; }
.doc.image-doc .texte b { font-size: 14.5px; font-weight: 500; }
.pied-menu { margin: 18px 8px 0; display: grid; gap: 8px; }
.second { padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--surface2); color: var(--texte); font-weight: 600; }
.lien { border: 0; background: none; color: var(--doux); text-decoration: underline; font-size: 13.5px; padding: 4px; }
.petit { color: var(--doux); font-size: 12.5px; margin: 0; }

#vue { min-width: 0; min-height: 0; overflow: auto; position: relative; }
#vue iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.accueil { max-width: 860px; margin: 0 auto; padding: 28px 22px 40px; }
.accueil h1 { font-size: 24px; margin: 0 0 4px; }
.accueil > p { color: var(--doux); margin: 0 0 22px; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tuile { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px; border: 1px solid var(--bord); border-radius: 14px;
  background: var(--surface); color: inherit; text-decoration: none; }
.tuile:hover { border-color: var(--accent); }
.tuile .icone { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.tuile .icone svg { width: 21px; height: 21px; }
.tuile b { font-size: 16.5px; }
.tuile span { color: var(--doux); font-size: 13.5px; }
.etat { align-self: flex-start; font-size: 12.5px; border-radius: 6px; padding: 2px 8px; }
.ok { background: var(--ok-fond); color: var(--ok); } .att { background: var(--att-fond); color: var(--att); } .ko { background: var(--ko-fond); color: var(--ko); }
.image-vue { padding: 14px; display: flex; justify-content: center; }
.image-vue img { width: 100%; max-width: 1080px; height: auto; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, .12); background: #fff; }
.carte-excel { max-width: 460px; margin: 48px auto; padding: 26px 22px; border: 1px solid var(--bord); border-radius: 16px; background: var(--surface); text-align: center; }
.carte-excel .icone { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--excel); }
.carte-excel .icone svg { width: 30px; height: 30px; }
.carte-excel h2 { margin: 0 0 4px; font-size: 20px; }
.carte-excel p { color: var(--doux); margin: 0 0 18px; }
.message { padding: 40px 20px; text-align: center; color: var(--doux); }
.titre-section { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); margin: 28px 0 10px; }
.etiquette { font-size: 13px; font-weight: 600; vertical-align: middle; color: var(--archive); border: 1px solid var(--archive);
  border-radius: 6px; padding: 1px 7px; }
.liste-images { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; padding: 4px 8px 8px; }
.liste-images h3 { font-size: 13.5px; color: var(--doux); margin: 12px 8px 2px; font-weight: 600; }
.ligne-bas { margin-top: 16px; }

/* Téléphone : le menu, puis le document en plein écran (bouton Retour ou retour du téléphone) */
@media (max-width: 860px) {
  .corps { grid-template-columns: 1fr; }
  #menu { border-right: 0; }
  #appli:not(.document) #vue, #appli:not(.document) #retour { display: none; }
  #appli.document #menu { display: none; }
  .barre .libelle { display: none; }
  .accueil { padding: 20px 14px 32px; }
}
@media (min-width: 861px) { #retour { display: none; } }
</style>
</head>
<body>
<div id="connexion">
  <form id="formulaire" autocomplete="on">
    <div class="marque"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 14.6 20.5 20.5" stroke="#f8cbad" stroke-width="3.6" stroke-linecap="round"/><circle cx="10" cy="10" r="7" fill="#e03131" stroke="#fff" stroke-width="1.4"/><circle cx="19.4" cy="4.6" r="2.2" fill="#f08c00"/></svg></div>
    <h1>CVTT Vaires</h1>
    <p>Espace club : pages, Excel et images du championnat</p>
    <input type="text" name="username" value="club" autocomplete="username" hidden>
    <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" required>
    <label><input type="checkbox" id="retenir" checked> Se souvenir sur cet appareil</label>
    <button class="principal" id="entrer">Entrer</button>
    <p id="erreur" role="alert"></p>
  </form>
</div>

<div id="appli" hidden>
  <header class="barre">
    <button id="retour" aria-label="Retour au menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Menu</span></button>
    <div class="titres"><b id="titre">CVTT Vaires · espace club</b><span id="sous-titre"></span></div>
    <button id="partager" aria-label="Partager" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span class="libelle">Partager</span></button>
    <button id="telecharger" aria-label="Télécharger" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="libelle">Télécharger</span></button>
  </header>
  <div class="corps">
    <nav id="menu" aria-label="Documents"></nav>
    <main id="vue"></main>
  </div>
</div>

<script id="donnees" type="application/json">__DONNEES_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("donnees").textContent);
const CLE = "cvtt-vaires-cle-club";  // distincte de celle de /gg/ (autre mot de passe, même site)
const GROUPES = ["récapitulatif", "classements", "adversaires", "résultats", "rencontres", "effectif", "classement virtuel"];
const TITRES_GROUPES = { "récapitulatif": "Récapitulatif de la journée (à compléter avec la photo)",
  "classements": "Classements des poules",
  "adversaires": "Adversaires", "résultats": "Résultats des joueurs", "rencontres": "Feuilles de match",
  "effectif": "Effectif et brûlages", "classement virtuel": "Classement virtuel" };
const TYPES = { html: "text/html;charset=utf-8", png: "image/png",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
const ICONES = {
  page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  excel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lire = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ecrire = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* navigation privée */ } };
const quand = (iso) => iso ? new Date(iso).toLocaleString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const octets = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const b64 = (o) => btoa(String.fromCharCode(...o));
const classe = (r) => /NON GÉNÉRÉE|manquant|non lues|non récupéré/.test(r || "") ? "ko" : /indisponible|pas encore/.test(r || "") ? "att" : "ok";

/* Documents : ceux de la journée en cours, et ceux de chaque archive (journées passées). */
function preparer(liste, archive = null) {
  return liste.slice().sort((a, b) => (a.ordre ?? 99) - (b.ordre ?? 99)).map((d) => ({
    ...d, archive,
    id: archive ? `${archive.cle}/${d.fichier}` : d.fichier,
    chemin: d.chemin || `fichiers/${d.fichier}.chiffre`,
    // Fichier d'une archive : nommé avec sa journée (J2_resultats_vaires.html), sauf s'il l'est déjà (recap_J2.png)
    nom: archive && !d.fichier.includes(`J${archive.journee}`) ? `J${archive.journee}_${d.fichier}` : d.fichier,
  }));
}
const triImages = (a, b) => GROUPES.indexOf(a.groupe) - GROUPES.indexOf(b.groupe) || a.ordre - b.ordre;
const pagesDe = (liste) => liste.filter((d) => d.type !== "image");
const imagesDe = (liste) => liste.filter((d) => d.type === "image").sort(triImages);
const docs = preparer(D.documents);
const archives = (D.archives || []).map((a) => ({ ...a, docs: preparer(a.documents, a) }));
const parId = new Map([...docs, ...archives.flatMap((a) => a.docs)].map((d) => [d.id, d]));
const pages = pagesDe(docs), images = imagesDe(docs);
const A_LA_UNE = ["récapitulatif", "classements"];  // images aussi en tuile sur l'accueil
const A_LA_UNE_TEXTE = { "récapitulatif": "L'image de la journée, à compléter avec la photo et les logos",
  "classements": "La poule de chaque équipe de Vaires, en une image à partager" };
const recaps = images.filter((d) => A_LA_UNE.includes(d.groupe));
const jour = (iso) => iso ? new Date(iso + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }) : "";
let cle = null;
const cacheClair = new Map();  // id -> Blob déchiffré
let courant = null, urlCourante = null, retourVers = "";

/* ---------- Statistiques de visite ----------
   Seulement si la copie Netlify a un compteur GoatCounter (variable GOATCOUNTER) : sinon rien.
   Pages vues : l'accueil, chaque document et chaque archive ouverts (/club/<fichier>) ; événements :
   connexion, téléchargement, partage, tout télécharger. Jamais de nom de joueur : des noms de fichiers. */
const enAttente = [];
function compter(chemin, titre, evenement = false) {
  const gc = window.goatcounter;
  if (gc && gc.count) gc.count({ path: chemin, title: titre, event: evenement });
  else if (document.querySelector("script[data-goatcounter]")) enAttente.push([chemin, titre, evenement]);
}
window.compteurPret = () => enAttente.splice(0).forEach((a) => compter(...a));
const nomCompte = (d) => d.archive ? `${d.archive.cle}/${d.fichier}` : d.fichier;
const titreCompte = (d) => d.archive ? `${d.archive.titre} · ${d.titre}` : d.titre;

/* ---------- Déchiffrement (mêmes réglages que le site GitHub) ---------- */
async function deriver(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256",
    salt: new TextEncoder().encode(D.sel), iterations: D.iterations }, base, 256));
}
async function dechiffrer(chemin, k = cle, type = "application/octet-stream") {
  const r = await fetch(`${chemin.split("/").map(encodeURIComponent).join("/")}?v=${encodeURIComponent(D.maj || "")}`);
  if (!r.ok) throw new Error(`fichier introuvable (${r.status})`);
  const brut = new Uint8Array(await r.arrayBuffer());
  const cleAes = await crypto.subtle.importKey("raw", k, "AES-GCM", false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: brut.slice(0, 12) }, cleAes, brut.slice(12));
  const blob = await new Response(new Blob([clair]).stream().pipeThrough(new DecompressionStream("gzip"))).blob();
  return new Blob([blob], { type });
}
async function contenu(doc) {
  if (!cacheClair.has(doc.id)) {
    cacheClair.set(doc.id, await dechiffrer(doc.chemin, cle, TYPES[doc.fichier.split(".").pop()] || "application/octet-stream"));
  }
  return cacheClair.get(doc.id);
}

/* ---------- Connexion ---------- */
async function entrer(k) {
  const verif = await (await dechiffrer("fichiers/verif.chiffre", k)).text();  // lève une erreur si la clé est fausse
  if (verif !== "cvtt-vaires-club") throw new Error("vérification");
  cle = k;
  document.getElementById("connexion").hidden = true;
  document.getElementById("appli").hidden = false;
  construireMenu();
  route();
}
document.getElementById("formulaire").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const bouton = document.getElementById("entrer"), erreur = document.getElementById("erreur");
  bouton.disabled = true; erreur.textContent = ""; bouton.textContent = "Vérification…";
  try {
    const k = await deriver(document.getElementById("mdp").value);
    await entrer(k);
    const retenir = document.getElementById("retenir").checked;
    if (retenir) ecrire(CLE, b64(k));
    compter("club/connexion", retenir ? "Connexion (mot de passe retenu)" : "Connexion", true);
  } catch (e) {
    if (e.name === "OperationError" || e.message === "vérification") compter("club/connexion-refusee", "Mot de passe incorrect", true);
    erreur.textContent = e.name === "OperationError" || e.message === "vérification" ? "Mot de passe incorrect." : "Problème : " + e.message;
  } finally {
    bouton.disabled = false; bouton.textContent = "Entrer";
  }
});
function quitter() {
  ecrire(CLE, null);
  location.hash = "";
  location.reload();
}

/* ---------- Menu ---------- */
function ligne(d, classeEnPlus = "") {
  const sous = d.type === "image" ? "" : `<span>${esc(d.type === "excel" ? "Classeur Excel" : d.description)}</span>`;
  return `<a class="doc ${classeEnPlus}" href="#${encodeURIComponent(d.id)}" data-id="${esc(d.id)}">
    <span class="icone ${d.type}">${ICONES[d.type]}</span><span class="texte"><b>${esc(d.titre)}</b>${sous}</span></a>`;
}
function listeImages(liste) {
  const groupes = [...new Set(liste.map((i) => i.groupe))];
  return groupes.map((g) => `<h3>${esc(TITRES_GROUPES[g] || g)}</h3>`
    + liste.filter((i) => i.groupe === g).map((d) => ligne(d, "image-doc")).join("")).join("");
}
function construireMenu() {
  document.getElementById("menu").innerHTML =
    `<h2>Pages et Excel</h2>${pages.map((d) => ligne(d)).join("")}`
    + (images.length ? `<h2>Images à partager</h2>${listeImages(images)}` : "")
    + (archives.length ? `<h2>Archives des journées passées</h2>` + archives.map((a) =>
        `<a class="doc" href="#archives/${encodeURIComponent(a.cle)}" data-id="archives/${esc(a.cle)}">
          <span class="icone archive">${ICONES.archive}</span><span class="texte"><b>${esc(a.titre)}</b>
          <span>Phase ${esc(a.phase)} · état au ${esc(jour(a.date_reference))}</span></span></a>`).join("") : "")
    + `<div class="pied-menu">
        <button class="second" id="tout">Tout télécharger (${docs.length} fichiers)</button>
        <p class="petit">Mise à jour : ${esc(quand(D.maj))}. Fichiers lisibles sans connexion : à garder dans le club.</p>
        <button class="lien" id="quitter">Oublier le mot de passe sur cet appareil</button>
      </div>`;
  document.getElementById("tout").addEventListener("click", (ev) => toutTelecharger(docs, ev.target));
  document.getElementById("quitter").addEventListener("click", quitter);
  document.getElementById("sous-titre").textContent = `Mise à jour : ${quand(D.maj)}`;
}

/* ---------- Vues : accueil, archive d'une journée, document ---------- */
function tuile(d) {
  return `<a class="tuile" href="#${encodeURIComponent(d.id)}">
    <span class="icone ${d.type}" style="background: var(--${d.type})">${ICONES[d.type]}</span><b>${esc(d.titre)}</b>
    <span>${esc(d.type === "image" ? A_LA_UNE_TEXTE[d.groupe] || "" : d.description)}</span>
    ${d.verification ? `<span class="etat ${classe(d.verification)}">${esc(d.verification)}</span>` : ""}</a>`;
}
function accueil() {
  return `<div class="accueil"><h1>Espace club</h1>
    <p>Choisis une page, l'Excel ou une image : tu peux la regarder ici puis la télécharger.</p>
    <div class="tuiles">${[...recaps, ...pages].map(tuile).join("")}</div>
    ${archives.length ? `<h2 class="titre-section">Archives des journées passées</h2><div class="tuiles">${archives.map((a) =>
      `<a class="tuile" href="#archives/${encodeURIComponent(a.cle)}"><span class="icone archive">${ICONES.archive}</span>
        <b>${esc(a.titre)}</b><span>Phase ${esc(a.phase)} ${esc(a.saison)} · état au ${esc(jour(a.date_reference))}</span></a>`).join("")}</div>` : ""}
  </div>`;
}
function vueArchive(a) {
  const imgs = imagesDe(a.docs);
  return `<div class="accueil"><h1>${esc(a.titre)} <span class="etiquette">archive</span></h1>
    <p>Phase ${esc(a.phase)} ${esc(a.saison)} : les pages, l'Excel et les images telles qu'au ${esc(jour(a.date_reference))}
      (veille de la journée suivante).</p>
    <div class="tuiles">${[...imgs.filter((d) => A_LA_UNE.includes(d.groupe)), ...pagesDe(a.docs)].map(tuile).join("")}</div>
    ${imgs.length ? `<h2 class="titre-section">Images</h2><div class="liste-images">${listeImages(imgs)}</div>` : ""}
    <div class="ligne-bas"><button class="second" id="tout-archive">Tout télécharger (${a.docs.length} fichiers)</button></div>
  </div>`;
}
async function route() {
  if (!cle) return;
  const h = decodeURIComponent(location.hash.slice(1));
  const archive = h.startsWith("archives/") ? archives.find((a) => a.cle === h.slice(9)) || null : null;
  const doc = archive ? null : parId.get(h) || null;
  const appli = document.getElementById("appli"), vue = document.getElementById("vue");
  const actif = doc?.archive ? `archives/${doc.archive.cle}` : h;
  document.querySelectorAll("#menu .doc").forEach((a) => a.classList.toggle("actif", a.dataset.id === actif));
  if (urlCourante) { URL.revokeObjectURL(urlCourante); urlCourante = null; }
  courant = doc;
  retourVers = doc?.archive ? `archives/${doc.archive.cle}` : "";
  document.querySelector("#retour span").textContent = retourVers ? "Archive" : "Menu";
  appli.classList.toggle("document", !!(doc || archive));
  document.getElementById("telecharger").hidden = !doc;
  document.getElementById("partager").hidden = true;
  const titre = document.getElementById("titre"), sous = document.getElementById("sous-titre");
  if (archive) {
    titre.textContent = `${archive.titre} · archive`;
    sous.textContent = `Phase ${archive.phase} · état au ${jour(archive.date_reference)}`;
    vue.innerHTML = vueArchive(archive);
    document.getElementById("tout-archive").addEventListener("click", (ev) => toutTelecharger(archive.docs, ev.target, archive));
    vue.scrollTop = 0;
    compter(`/club/archives/${archive.cle}`, `Archive · ${archive.titre}`);
    return;
  }
  if (!doc) {
    titre.textContent = "CVTT Vaires · espace club";
    sous.textContent = `Mise à jour : ${quand(D.maj)}`;
    vue.innerHTML = accueil();
    vue.scrollTop = 0;
    compter("/club/", "Accueil de l'espace club");
    return;
  }
  titre.textContent = doc.archive ? `${doc.archive.titre} · ${doc.titre}` : doc.titre;
  sous.textContent = doc.archive ? `Archive · état au ${jour(doc.archive.date_reference)}`
    : doc.type === "image" ? TITRES_GROUPES[doc.groupe] || "" : quand(doc.date);
  vue.innerHTML = '<p class="message">Ouverture…</p>';
  compter(`/club/${nomCompte(doc)}`, titreCompte(doc));
  try {
    const blob = await contenu(doc);
    if (courant !== doc) return;  // un autre document a été choisi entre-temps
    if (doc.type === "page") {
      urlCourante = URL.createObjectURL(blob);
      vue.innerHTML = `<iframe title="${esc(doc.titre)}" src="${urlCourante}"></iframe>`;
    } else if (doc.type === "image") {
      urlCourante = URL.createObjectURL(blob);
      vue.innerHTML = `<div class="image-vue"><img src="${urlCourante}" alt="${esc(doc.titre)}"></div>`;
      const fichier = new File([blob], doc.nom, { type: "image/png" });
      document.getElementById("partager").hidden = !(navigator.canShare && navigator.canShare({ files: [fichier] }));
    } else {
      vue.innerHTML = `<div class="carte-excel"><div class="icone">${ICONES.excel}</div><h2>${esc(doc.titre)}</h2>
        <p>${esc(doc.description)}<br>S'ouvre avec Excel, LibreOffice ou Google Sheets.</p>
        <button class="principal" id="telecharger-excel">Télécharger ${esc(doc.nom)}</button></div>`;
      document.getElementById("telecharger-excel").addEventListener("click", () => {
        enregistrer(blob, doc.nom);
        compter(`club/telechargement/${nomCompte(doc)}`, `Téléchargement · ${titreCompte(doc)}`, true);
      });
    }
    vue.scrollTop = 0;
  } catch (e) {
    vue.innerHTML = `<p class="message">Impossible d'ouvrir ce document (${esc(e.message)}).</p>`;
  }
}
function enregistrer(blob, nom) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
document.getElementById("telecharger").addEventListener("click", async () => {
  if (!courant) return;
  enregistrer(await contenu(courant), courant.nom);
  compter(`club/telechargement/${nomCompte(courant)}`, `Téléchargement · ${titreCompte(courant)}`, true);
});
document.getElementById("partager").addEventListener("click", async () => {
  if (!courant) return;
  const doc = courant;
  try {
    await navigator.share({ files: [new File([await contenu(doc)], doc.nom, { type: "image/png" })] });
    compter(`club/partage/${nomCompte(doc)}`, `Partage · ${titreCompte(doc)}`, true);
  } catch (e) { /* partage annulé */ }
});
/* Retour : d'un document d'archive vers son archive, sinon vers le menu. (Pas history.back() : les
   onglets d'une page affichée, J1, J2, Cumul..., ajoutent eux aussi des étapes à l'historique.) */
document.getElementById("retour").addEventListener("click", () => { location.hash = retourVers; });
async function toutTelecharger(liste, bouton, archive = null) {
  const libelle = bouton.textContent;
  bouton.disabled = true;
  compter(archive ? `club/tout-telecharger/${archive.cle}` : "club/tout-telecharger",
          archive ? `Tout télécharger · ${archive.titre}` : "Tout télécharger", true);
  try {
    for (const [i, d] of liste.entries()) {
      bouton.textContent = `Téléchargement ${i + 1}/${liste.length}…`;
      enregistrer(await contenu(d), d.nom);
      await new Promise((ok) => setTimeout(ok, 600));  // le navigateur enchaîne mieux les téléchargements
    }
  } catch (e) {
    alert("Téléchargement interrompu : " + e.message);
  } finally {
    bouton.disabled = false;
    bouton.textContent = libelle;
  }
}
window.addEventListener("hashchange", route);

/* Clé déjà mémorisée sur cet appareil : on entre directement. */
(async () => {
  const memo = lire(CLE);
  if (!memo) { document.getElementById("mdp").focus(); compter("/club/connexion", "Connexion à l'espace club"); return; }
  try { await entrer(octets(memo)); }
  catch (e) { ecrire(CLE, null); document.getElementById("mdp").focus(); compter("/club/connexion", "Connexion à l'espace club"); }
})();
</script>
