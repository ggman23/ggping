<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVTT Vaires · championnat de Paris</title>
<style>
:root {
  --fond: #f4f5f7; --surface: #ffffff; --surface2: #f0f2f5; --texte: #1c2330; --doux: #5b6576;
  --bord: #dde1e7; --accent: #1f5fbf; --accent-fond: #e7effb;
  --dom: #1d7a46; --dom-fond: #e3f4ea; --ext: #a45a00; --ext-fond: #fbeedd;
  --danger: #b3261e; --danger-fond: #fbe7e5; --fort: #b3261e; --faible: #8a93a3;
  --ok: #1d7a46; --ok-fond: #e3f4ea; --attention: #8a5a00; --attention-fond: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #12151b; --surface: #1b2029; --surface2: #232a35; --texte: #e6e9ef; --doux: #9aa4b5;
    --bord: #313a48; --accent: #7fb0ff; --accent-fond: #1e2c44;
    --dom: #6fd39b; --dom-fond: #173323; --ext: #f3b163; --ext-fond: #3a2a14;
    --danger: #ff8f86; --danger-fond: #3d1c1a; --fort: #ff8f86; --faible: #7c8698;
    --ok: #6fd39b; --ok-fond: #173323; --attention: #f3cd6b; --attention-fond: #3a3014;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header.entete { position: sticky; top: 0; z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--bord); }
.entete .titre { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  padding: 10px 16px 4px; }
.entete h1 { font-size: 18px; margin: 0; }
.entete p { margin: 0; color: var(--doux); font-size: 13px; }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 4px 12px 0; scrollbar-width: thin; }
nav a { flex: none; padding: 8px 12px; text-decoration: none; color: var(--doux);
  border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; }
nav a:hover { color: var(--texte); }
nav a.actif { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.demo { background: var(--attention-fond); color: var(--attention); padding: 8px 16px;
  font-weight: 600; text-align: center; }
h2 { font-size: 20px; margin: 4px 0 2px; }
h3 { font-size: 16px; margin: 0 0 8px; }
h4 { font-size: 15px; margin: 18px 0 8px; }
.sous { color: var(--doux); margin: 0 0 14px; }
.carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 10px;
  padding: 14px; margin-bottom: 14px; }
.grille2 { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; }
.grille4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 900px) { .grille2, .grille4 { grid-template-columns: 1fr; } }
.grille4 > div { background: var(--surface2); border-radius: 8px; padding: 10px; }
.grille4 h5 { margin: 0 0 6px; font-size: 14px; }
.grille4 h6 { margin: 12px 0 4px; font-size: 13px; color: var(--doux); }
.grille4 ul { list-style: none; margin: 0; padding: 0; }
.grille4 li { padding: 3px 0; border-bottom: 1px dashed var(--bord); font-size: 14px; }
.grille4 li:last-child { border-bottom: 0; }
.grille4 .vide { color: var(--doux); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--bord); vertical-align: top; }
th { color: var(--doux); font-weight: 600; font-size: 13px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
.defil { overflow-x: auto; }
table.placements td, table.placements th { white-space: nowrap; }
tr.vaires td { font-weight: 700; background: var(--accent-fond); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px;
  font-weight: 700; white-space: nowrap; }
.dom { background: var(--dom-fond); color: var(--dom); }
.ext { background: var(--ext-fond); color: var(--ext); }
.brule { background: var(--danger-fond); color: var(--danger); }
.okb { background: var(--ok-fond); color: var(--ok); }
.nouveau { background: var(--ok); color: var(--surface, #fff); }
.neutre { background: var(--surface2); color: var(--doux); }
.att { background: var(--attention-fond); color: var(--attention); }
.fille { background: var(--accent-fond); color: var(--accent); }
.petit { font-size: 12.5px; color: var(--doux); }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puces a { text-decoration: none; color: var(--texte); background: var(--surface2);
  border: 1px solid var(--bord); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
.puces a:hover { border-color: var(--accent); }
.puces a.actif { border-color: var(--accent); background: var(--accent-fond); }
.puces a b { display: block; }
.filtres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filtres a { text-decoration: none; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--bord);
  color: var(--texte); background: var(--surface); font-size: 14px; }
.filtres a.actif { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.semaine.courante { border: 2px solid var(--accent); }
.semaine h3 .badge { margin-left: 6px; }
.m { font-variant-numeric: tabular-nums; font-weight: 700; }
.forme { white-space: nowrap; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--doux); }
.forme b { font-weight: 700; color: var(--texte); }
.forme.plus b { color: var(--ok); }
.forme.moins b { color: var(--danger); }
.forme.vide { font-style: italic; }
.tris { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; font-size: 13px; color: var(--doux); }
button.tri { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--bord);
  background: var(--surface); color: var(--texte); cursor: pointer; }
button.tri.actif { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.m.fort { color: var(--fort); }
.m.egal { color: var(--accent); }
.m.faible { color: var(--faible); }
.score { font-size: 18px; font-weight: 700; }
.haut { color: var(--ext); }
.note { background: var(--attention-fond); color: var(--attention); border-radius: 8px; padding: 8px 10px;
  margin: 10px 0 0; font-size: 14px; }
details { margin-top: 12px; }
details.suite { margin-top: 4px; font-size: 13px; }
details.suite summary { font-weight: 400; color: var(--accent); }
summary { cursor: pointer; font-weight: 600; }
.vide-page { color: var(--doux); padding: 30px 0; text-align: center; }
.verif-ok { background: var(--ok-fond); color: var(--ok); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; font-size: 14px; }
.verif-ko { background: var(--danger-fond); color: var(--danger); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; font-size: 14px; }
table.verif td.c, table.verif th.c { text-align: center; }
@media (max-width: 640px) {
  main { padding: 10px; }
  table.liste thead { display: none; }
  table.liste tr { display: block; border-bottom: 1px solid var(--bord); padding: 6px 0; }
  table.liste td { display: block; border: 0; padding: 2px 4px; }
  table.liste td[data-l]::before { content: attr(data-l) " : "; color: var(--doux); font-size: 12.5px; }
}
@media print {
  header.entete { position: static; }
  nav, .filtres, .puces { display: none; }
  .carte { break-inside: avoid; }
}
.bandeau { margin: 0 0 14px; }
.espaces { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px;
  max-width: 1200px; margin: 0 auto; padding: 6px 16px; }
.espaces a { text-decoration: none; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--bord); background: var(--surface); color: var(--texte); }
.espaces a:hover { border-color: var(--accent); }
@media (max-width: 520px) {
  .espaces { justify-content: stretch; padding: 6px 10px; }
  .espaces .petit { display: none; }
  .espaces a { flex: 1 1 0; text-align: center; padding: 5px 2px; font-size: 12.5px; }
}
@media print { .espaces { display: none; } }
</style>
</head>
<body>
<div class="espaces" aria-label="Autres espaces">
  <span class="petit">Autres espaces :</span>
  <a id="vers-club" href="../club/" title="Espace club : championnat de France, pages, images, archives">Club</a>
  <a id="vers-indivs" href="../indivs/" title="Individuels : poules du critérium et adversaires">Indivs</a>
  <a id="vers-tournois" href="../tournois/" title="Tournois à venir autour de Vaires">Tournois</a>
  <a id="vers-cal" href="../cal/" title="Calendrier de la saison">Calendrier</a>
  <a id="vers-77" href="../77/" title="Clubs du 77 : joueurs, niveau et équipes de chaque club">77</a>
</div>
<header class="entete">
  <div class="titre"><h1>CVTT Vaires — championnat de Paris</h1><p id="sous-titre"></p></div>
  <nav id="onglets"></nav>
</header>
<div id="bandeau"></div>
<main id="contenu"></main>
<script id="donnees" type="application/json">__DONNEES_JSON__</script>
<script>
"use strict";
/* Championnat de Paris IDF : la même présentation que la page adversaires du championnat de France
   (gabarit.html). Poules et calendrier : ttvaires/paris.py (documents de la ligue). Clubs adverses :
   adversaires.recuperer_paris (joueurs alignés en championnat de France, effectif et meilleur classement
   lus sur pingpocket.fr par le PC, forme depuis le début de la phase). Les rencontres du championnat de
   Paris ne sont pas dans l'API de la FFTT : ni score, ni composition, ni brûlage. */
const D = JSON.parse(document.getElementById("donnees").textContent);
const CLUBS = D.clubs || {};
const EQUIPES = D.equipes || [];
const AUJOURDHUI = D.date_reference || new Date().toISOString().slice(0, 10);
const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];

/* Statistiques de visite (GoatCounter et Umami, sur les copies du site qui en ont) : ce qu'on fait dans la
   page, en événements « paris/<action>/<détail> » (vue, fiche, tri, filtre, lien). Jamais un nom de joueur. */
const compterAction = (action, detail, titre) => {
  try { if (window.compteur) window.compteur(`paris/${action}/${String(detail).replace(/\//g, "-").slice(0, 80)}`, `Paris · ${titre}`, true); }
  catch (e) { /* sans compteur */ }
};
document.addEventListener("click", (ev) => {  // liens vers une autre page (pas les liens internes « #… »)
  const a = ev.target.closest("a[href]");
  if (a && !a.getAttribute("href").startsWith("#")) {
    const nom = a.dataset.lien || a.textContent.trim();
    compterAction("lien", nom, `lien ${nom}`);
  }
});

/* Autres espaces à côté de /paris/ (même mot de passe, déjà retenu), y compris sur le site GitHub (…/ggping/paris/) */
function racine() {
  const p = location.pathname, i = p.search(/\/(gg\/)?paris(\/|\.html)/);
  return i >= 0 ? p.slice(0, i) : p.replace(/\/[^/]*$/, "");
}
const BASE = location.protocol === "file:" ? ".." : racine();
const CLUB = `${BASE}/club/`, INDIVS = `${BASE}/indivs/`, TOURNOIS = `${BASE}/tournois/`, CAL = `${BASE}/cal/`, D77 = `${BASE}/77/`;
for (const [id, url] of [["vers-club", CLUB], ["vers-indivs", INDIVS], ["vers-tournois", TOURNOIS], ["vers-cal", CAL], ["vers-77", D77]])
  document.getElementById(id).href = url;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dateObj = (iso) => new Date(iso + "T12:00:00");
const dd = (n) => String(n).padStart(2, "0");
const listeClub = (num, tri) => `https://www.pingpocket.fr/?page=app%2Ffftt%2Fclubs%2F${num}%2Flicencies%3FSORT%3D${tri}`;
function fmtDate(iso, annee) {
  if (!iso) return "date inconnue";
  const d = dateObj(iso);
  return `${JOURS[d.getDay()]} ${dd(d.getDate())}/${dd(d.getMonth() + 1)}${annee ? "/" + d.getFullYear() : ""}`;
}
function lundi(iso) {
  const d = dateObj(iso);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
function plusJours(iso, n) { const d = dateObj(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
const dateRenc = (r) => r.date_reelle || r.date;
const clt = (p) => (p == null ? "—" : Math.max(5, Math.floor(p / 100)));
const cltJ = (j) => j.classement ?? clt(j.points ?? j.points_mensuels);
const pts = (j) => j.points_mensuels ?? j.points ?? 0;
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;

function nomJoueur(j) { return `${esc(j.nom)} ${esc(j.prenom)}`.trim(); }
// Inscrit ou réinscrit depuis la liste précédente de son club (voir adversaires.completer_avec_pingpocket)
const badgeNouveau = (j) => j.nouveau ? ' <span class="badge nouveau" title="inscrit ou réinscrit depuis la liste précédente de son club">nouveau</span>' : "";
/* Forme : parties depuis le début de la phase, toutes compétitions (championnat, critérium fédéral,
   tournois...) : victoires-défaites et points gagnés ou perdus (voir adversaires.ajouter_forme).
   j.forme absent : joueur non suivi ; null : parties non lues lors de la mise à jour. */
const signe = (x) => (Math.round(x) > 0 ? "+" : Math.round(x) < 0 ? "−" : "±") + Math.abs(Math.round(x));
const classeForme = (f) => (Math.round(f.points) > 0 ? "plus" : Math.round(f.points) < 0 ? "moins" : "");
const abrege = (nom) => (nom === "Critérium fédéral" ? "Critérium" : nom.length > 26 ? nom.slice(0, 25) + "…" : nom);
function formeTitre(f) {
  return `Depuis le début de la phase, toutes compétitions : ${pluriel(f.v, "victoire")}, ${pluriel(f.d, "défaite")}, ${signe(f.points)} points`
    + (f.virtuels != null ? ` (${Math.round(f.virtuels)} points virtuels)` : "")
    + (f.competitions || []).map((c) => `\n${c.nom} : ${c.v}/${c.v + c.d}, ${signe(c.points)} pts`).join("")
    + (f.derniere ? `\nDernière partie : ${fmtDate(f.derniere, true)}` : "");
}
function celForme(j) {
  const f = j.forme;
  if (f === undefined) return "";
  if (f === null) return '<span class="petit">non lue</span>';
  if (!(f.v + f.d)) return '<span class="forme vide">aucune partie</span>';
  return `<span class="forme ${classeForme(f)}" title="${esc(formeTitre(f))}">${f.v}/${f.v + f.d} <b>${signe(f.points)}</b></span>`
    + (f.virtuels != null ? ` <span class="petit">${Math.round(f.virtuels)}</span>` : "");
}
const celHorsChampionnat = (j) => ((j.forme || {}).competitions || []).filter((c) => c.nom !== "Championnat")
  .map((c) => `<span class="badge neutre" title="${esc(c.nom)} : ${c.v} V, ${c.d} D, ${signe(c.points)} pts">${esc(abrege(c.nom))} ${c.v}/${c.v + c.d} ${signe(c.points)}</span>`).join(" ");
const TRIS_EFFECTIF = {
  points: (j) => -pts(j),
  meilleur: (j) => -((j.meilleur || {}).points || 0),
  forme: (j) => (j.forme && j.forme.v + j.forme.d ? -j.forme.points : Infinity),
  parties: (j) => -(j.forme ? j.forme.v + j.forme.d : -1),
};
const NOMS_TRIS = { points: "points", meilleur: "meilleur classement", forme: "forme (points gagnés)", parties: "parties jouées" };
let triEffectif = "points";
const EFFECTIFS = {};  // tableau affiché : lignes à retrier sans redessiner la page
function trierEffectif(cle, tri, bouton) {
  triEffectif = tri;
  document.getElementById(cle).innerHTML = EFFECTIFS[cle](tri);
  bouton.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("actif", b === bouton));
  compterAction("tri", tri, `tri ${NOMS_TRIS[tri]}`);
}
function meilleur(j) {
  const m = j.meilleur;
  if (!m) return "—";
  const val = esc(m.classement ?? clt(m.points));
  // Mis en évidence quand le joueur a été classé au moins 2 classements au-dessus d'aujourd'hui.
  const haut = m.points && pts(j) && m.points - pts(j) >= 200;
  return `${haut ? `<b class="haut" title="${m.points} pts, nettement au-dessus du classement actuel">${val}</b>` : val}${m.annee ? ` <span class="petit">(${esc(m.annee)})</span>` : ""}`;
}
function lieu(r) {
  const club = r.vaires_domicile ? D.club : CLUBS[(r.adversaire || {}).club];
  const salle = club && club.salle;
  if (r.vaires_domicile) return `<span class="badge dom">DOM</span>${salle ? ` <span class="petit">${esc(salle.nom || "")}</span>` : ""}`;
  if (!salle) return '<span class="badge ext">EXT</span> <span class="petit">adresse pas encore lue</span>';
  const adr = [salle.nom, salle.adresse, [salle.cp, salle.ville].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const carte = salle.carte || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(
    [salle.nom, salle.adresse, salle.cp, salle.ville, salle.adresse ? "" : club && club.nom].filter(Boolean).join(" "));
  return `<span class="badge ext">EXT</span> ${esc(adr)} <a href="${carte}" target="_blank" rel="noopener" class="petit" data-lien="plan">plan</a>`;
}
function scoreTxt(r) {
  if (!r.adversaire) return "";
  if (!r.score) return dateRenc(r) && dateRenc(r) < AUJOURDHUI
    ? '<span class="petit" title="Les résultats du championnat de Paris ne sont pas dans l\'API de la FFTT">non disponible</span>' : "";
  const [a, b] = r.score;
  const nous = r.vaires_domicile ? a : b, eux = r.vaires_domicile ? b : a;
  const cls = nous > eux ? "okb" : nous < eux ? "brule" : "neutre";
  return `<span class="badge ${cls}">${a} – ${b}</span>`;
}
function libelleAdv(r) { return r.adversaire ? esc(r.adversaire.libelle) : '<span class="petit">exempt</span>'; }
function dateTxt(r) {
  const reportee = r.date_reelle && r.date_reelle !== r.date
    ? ` <span class="badge att" title="Date prévue : ${esc(fmtDate(r.date))}">déplacée</span>` : "";
  return `${fmtDate(dateRenc(r))}${r.heure ? " " + esc(r.heure) : ""}${reportee}`;
}

/* ---------- Onglets et navigation ---------- */
function onglets(actif) {
  document.getElementById("onglets").innerHTML = [`<a href="#recap" class="${actif === "recap" ? "actif" : ""}">Récapitulatif</a>`]
    .concat(EQUIPES.map((e) => `<a href="#e/${e.id}" class="${actif === e.id ? "actif" : ""}">${esc(e.nom_court || e.libelle)}</a>`)).join("");
}
let vueComptee = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [vue, id, sous, journee] = h.split("/");
  const main = document.getElementById("contenu");
  const e = vue === "e" ? EQUIPES.find((x) => x.id === id) : null;
  let compte;
  if (e) {
    const r = sous === "j" ? (e.rencontres || []).find((x) => x.journee === Number(journee)) : null;
    onglets(e.id);
    main.innerHTML = vueEquipe(e, r ? r.journee : null);
    if (r) document.getElementById("panneau")?.scrollIntoView({ behavior: "smooth", block: "start" });
    else window.scrollTo(0, 0);
    compte = r ? ["fiche", `${e.id}-J${r.journee} ${r.adversaire ? r.adversaire.libelle : "exempt"}`, `${e.nom_court} J${r.journee} contre ${r.adversaire ? r.adversaire.libelle : "exempt"}`]
      : ["vue", e.id, `${e.nom_court} (${e.division})`];
    document.title = `CVTT Vaires · championnat de Paris · ${e.nom_court}${r && r.adversaire ? " · " + r.adversaire.libelle : ""}`;
  } else {
    const filtre = vue === "recap" && EQUIPES.some((x) => x.id === id) ? id : null;
    onglets("recap");
    main.innerHTML = vueRecap(filtre);
    document.querySelector(".semaine.courante")?.scrollIntoView({ block: "start" });
    window.scrollBy(0, -110);
    compte = filtre ? ["filtre", `recap-${filtre}`, `récapitulatif ${filtre}`] : ["vue", "recap", "récapitulatif"];
    document.title = "CVTT Vaires · championnat de Paris";
  }
  if (compte.join("|") !== vueComptee) { vueComptee = compte.join("|"); compterAction(...compte); }
}

/* ---------- Ce qui manque encore (lu par le PC sur pingpocket.fr) ---------- */
function bandeauEtat() {
  const cs = Object.values(CLUBS);
  if (!cs.length) return `<div class="note bandeau">Clubs adverses pas encore lus : leurs joueurs, leur salle et leur forme viennent avec la mise à jour.</div>`;
  const complets = cs.filter((c) => c.effectif_complet).length, adresses = cs.filter((c) => c.salle).length;
  const reste = D.historiques_restants || 0;
  if (complets === cs.length && adresses === cs.length && !reste) return "";
  return `<div class="note bandeau">Clubs adverses : ${complets}/${cs.length} effectifs complets, ${adresses}/${cs.length} adresses de salle${reste
    ? `, ${reste} meilleur${reste > 1 ? "s" : ""} classement${reste > 1 ? "s" : ""} encore à lire` : ""}. Ils viennent de pingpocket.fr, lu par le PC : lancer la mise à jour
    depuis le PC (lancer.bat${reste ? ", option 8 pour tout lire d'un coup" : ""}).</div>`;
}

/* ---------- Récapitulatif par semaine ---------- */
function vueRecap(filtre) {
  if (!EQUIPES.length) return '<p class="vide-page">Aucune équipe trouvée.</p>';
  const equipes = filtre ? EQUIPES.filter((e) => e.id === filtre) : EQUIPES;
  const semaines = {};
  for (const e of equipes) for (const r of e.rencontres || []) {
    const cle = dateRenc(r) ? lundi(dateRenc(r)) : "inconnue";
    (semaines[cle] ||= []).push({ e, r });
  }
  const cles = Object.keys(semaines).sort();
  const courante = cles.find((c) => c !== "inconnue" && plusJours(c, 6) >= AUJOURDHUI);
  const filtres = `<div class="filtres"><a href="#recap" class="${filtre ? "" : "actif"}">Toutes les équipes</a>` +
    EQUIPES.map((e) => `<a href="#recap/${e.id}" class="${filtre === e.id ? "actif" : ""}">${esc(e.nom_court || e.libelle)}</a>`).join("") + "</div>";
  const blocs = cles.map((c) => {
    const lignes = semaines[c].sort((a, b) => (dateRenc(a.r) || "").localeCompare(dateRenc(b.r) || "") || EQUIPES.indexOf(a.e) - EQUIPES.indexOf(b.e));
    const journees = [...new Set(lignes.map((l) => "J" + l.r.journee))].join(", ");
    const titre = c === "inconnue" ? "Date inconnue" : `Semaine du ${fmtDate(c)} au ${fmtDate(plusJours(c, 6), true)}`;
    return `<article class="carte semaine ${c === courante ? "courante" : ""}">
      <h3>${titre}<span class="badge neutre">${journees}</span>${c === courante ? '<span class="badge okb">cette semaine / prochaine</span>' : ""}</h3>
      <div class="defil"><table class="liste"><thead><tr><th>Équipe</th><th>Date</th><th>Adversaire</th><th>Lieu</th><th>Score</th></tr></thead><tbody>
      ${lignes.map(({ e, r }) => `<tr>
        <td data-l="Équipe"><a href="#e/${e.id}"><b>${esc(e.nom_court || e.libelle)}</b></a> <span class="petit">${esc(e.code || "")}</span></td>
        <td data-l="Date">${dateTxt(r)}</td>
        <td data-l="Adversaire">${r.adversaire ? `<a href="#e/${e.id}/j/${r.journee}">${libelleAdv(r)}</a>` : libelleAdv(r)}</td>
        <td data-l="Lieu">${r.adversaire ? lieu(r) : ""}</td>
        <td data-l="Score">${scoreTxt(r)}</td></tr>`).join("")}
      </tbody></table></div></article>`;
  });
  const source = `<p class="petit">${esc(D.source || "")}. Les rencontres du championnat de Paris ne sont pas dans l'API de la FFTT :
    ni score ni composition. Pour chaque club adverse : ses joueurs (alignés en championnat de France, liste des licenciés
    de pingpocket.fr), leur meilleur classement et leur forme depuis le début de la phase.</p>`;
  return bandeauEtat() + filtres + blocs.join("") + source;
}

/* ---------- Onglet d'une équipe de Vaires ---------- */
function vueEquipe(e, journee) {
  const rencs = e.rencontres || [];
  const cal = `<div class="carte"><h3>Calendrier de la saison</h3><div class="defil"><table class="liste">
    <thead><tr><th>J</th><th>Date</th><th>Adversaire</th><th>Lieu</th><th>Score</th></tr></thead><tbody>
    ${rencs.map((r) => `<tr>
      <td data-l="Journée">J${r.journee}</td><td data-l="Date">${dateTxt(r)}</td>
      <td data-l="Adversaire">${r.adversaire ? `<a href="#e/${e.id}/j/${r.journee}">${libelleAdv(r)}</a>` : libelleAdv(r)}</td>
      <td data-l="Lieu">${r.adversaire ? lieu(r) : ""}</td><td data-l="Score">${scoreTxt(r)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  const classement = e.classement || [];
  const vide = classement.every((c) => c.points == null);
  const clst = `<div class="carte"><h3>Classement de la poule</h3><div class="defil"><table>
    <thead><tr><th class="num">#</th><th>Équipe</th><th class="num">Pts</th><th class="num">J</th><th class="num">V</th><th class="num">N</th><th class="num">D</th></tr></thead><tbody>
    ${classement.map((c) => `<tr class="${c.club === D.club.numero ? "vaires" : ""}"><td class="num">${c.rang ?? "—"}</td>
      <td>${esc(c.libelle)}${c.dep ? ` <span class="petit">(${esc(c.dep)})</span>` : ""}</td>
      ${["points", "joues", "v", "n", "d"].map((k) => `<td class="num">${c[k] ?? "—"}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>${vide ? `<p class="petit">Vide pour l'instant : les résultats du championnat de Paris ne sont pas dans l'API
    de la FFTT. Équipes dans l'ordre de la poule (documents de la ligue).</p>` : ""}</div>`;
  const puces = `<div class="carte"><h3>Adversaires — clique sur une équipe pour voir son club</h3><div class="puces">
    ${rencs.filter((r) => r.adversaire).map((r) => `<a href="#e/${e.id}/j/${r.journee}" class="${r.journee === journee ? "actif" : ""}">
      <b>${libelleAdv(r)}</b><span class="petit">J${r.journee} · ${fmtDate(dateRenc(r))} · ${r.vaires_domicile ? "dom." : "ext."}</span></a>`).join("")}
    </div></div>`;
  const r = journee != null ? rencs.find((x) => x.journee === journee) : null;
  return `<h2>${esc(e.libelle)}</h2><p class="sous">${[e.division, e.poule, "championnat de Paris IDF", e.jour].filter(Boolean).map(esc).join(" · ")}</p>
    ${bandeauEtat()}<div class="grille2">${cal}${clst}</div>${puces}<div id="panneau">${r && r.adversaire ? panneauRencontre(e, r) : ""}</div>`;
}

/* ---------- Fiche d'une rencontre : le club adverse et ses joueurs ---------- */
function panneauRencontre(e, r) {
  const club = CLUBS[r.adversaire.club];
  const tete = `<h3>J${r.journee} · ${dateTxt(r)} — ${r.vaires_domicile ? `${esc(e.libelle)} reçoit ${libelleAdv(r)}` : `${libelleAdv(r)} reçoit ${esc(e.libelle)}`}</h3>
    <p>${lieu(r)}</p>`;
  if (!club) return `<div class="carte">${tete}<p class="petit">${esc(r.adversaire.libelle)} : joueurs pas encore lus (ils viennent avec la mise à jour).</p></div>`;
  const idx = Object.fromEntries((club.joueurs || []).map((j) => [j.id, j]));
  const score = r.score ? `<p><span class="score">${esc(r.domicile?.libelle ?? "")} ${r.score[0]} – ${r.score[1]} ${esc(r.exterieur?.libelle ?? "")}</span></p>` : "";
  const france = (club.equipes || []).slice().sort((a, b) => (a.championnat || "").localeCompare(b.championnat || "") || (a.numero ?? 0) - (b.numero ?? 0));
  const equipesClub = france.length ? `<p class="petit">Équipes de ${esc(club.nom)} en championnat de France cette phase :
    ${france.map((x) => `<span class="badge neutre">${x.numero ?? "?"}${x.championnat === "F" ? " F" : ""} · ${esc(x.division || "?")}</span>`).join(" ")}</p>`
    : `<p class="petit">${esc(club.nom)} n'a pas d'équipe en championnat de France cette phase (API FFTT).</p>`;
  const erreur = club.erreur ? `<p class="verif-ko">⚠ ${esc(club.nom)} : ${esc(club.erreur)}. Relancer la mise à jour plus tard.</p>` : "";
  return `<div class="carte">${tete}${score}${erreur}${equipesClub}${tableEffectif(club, r)}${tableEquipes(club, idx)}</div>`;
}

// Équipe(s) du championnat de France où chaque joueur a joué cette phase : {repère du joueur: {"2": 4, "1 F": 1}}
function equipesFrance(club) {
  const res = {};
  for (const eq of club.equipes || []) for (const c of eq.compositions || []) for (const id of c.joueurs || []) {
    const k = `${eq.numero ?? "?"}${eq.championnat === "F" ? " F" : ""}`, par = (res[id] ||= {});
    par[k] = (par[k] || 0) + 1;
  }
  return res;
}
function celFrance(fr) {
  if (!fr) return "";
  return Object.entries(fr).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
    `<span class="m" title="Équipe ${esc(k)} du club en championnat de France : ${pluriel(n, "rencontre")}">${esc(k)}</span><span class="petit">×${n}</span>`).join(" ");
}

function tableEffectif(club, r) {
  const tous = club.joueurs || [];
  const actifs = tous.filter((j) => j.renouvele !== false);
  const anciens = tous.filter((j) => j.renouvele === false).sort((x, y) => pts(y) - pts(x));
  const avecForme = tous.some((j) => j.forme !== undefined);
  const fr = equipesFrance(club);
  const avecFrance = Object.keys(fr).length > 0;
  const ligne = (j) => `<tr>
    <td>${nomJoueur(j)}${j.sexe === "F" ? ' <span class="badge fille">F</span>' : ""}${badgeNouveau(j)}</td>
    <td title="${esc(j.categorie_long ?? "")}">${esc(j.categorie ?? "")}</td>
    <td class="num">${cltJ(j)} <span class="petit">${j.points ?? ""}</span></td>
    ${avecForme ? `<td>${celForme(j)}</td>` : ""}
    <td class="num">${j.points_mensuels ?? "—"}${j.points_mensuels && j.points ? ecartMensuel(j.points_mensuels - j.points) : ""}</td>
    <td>${meilleur(j)}</td>
    ${avecForme ? `<td>${celHorsChampionnat(j)}</td>` : ""}
    ${avecFrance ? `<td>${celFrance(fr[j.id])}</td>` : ""}</tr>`;
  const entete = `<thead><tr><th>Joueur</th><th>Cat.</th><th class="num">Officiel</th>
    ${avecForme ? '<th title="Victoires sur parties jouées et points gagnés ou perdus depuis le début de la phase, toutes compétitions ; en petit : points virtuels">Phase</th>' : ""}
    <th class="num">Mensuel</th><th>Meilleur (année)</th>${avecForme ? "<th>Hors championnat</th>" : ""}
    ${avecFrance ? '<th title="Équipe du club dans laquelle le joueur a joué cette phase en championnat de France">Éq. France</th>' : ""}</tr></thead>`;
  const legende = (avecForme ? `<p class="petit">Phase : victoires sur parties jouées (7/9 = 7 gagnées sur 9) et points gagnés ou perdus depuis
    le début de la phase dans toutes les compétitions (championnat, critérium fédéral, tournois…), comme le classement virtuel
    de Vaires ; en petit, les points virtuels. Hors championnat : les compétitions individuelles jouées. Lu pour les joueurs
    déjà alignés et les licenciés à plus de 500 points.</p>` : "")
    + (avecFrance ? `<p class="petit">Éq. France : équipe du club dans laquelle le joueur a joué cette phase en championnat de France
    (×4 = 4 rencontres). On ne sait pas qui joue dans quelle équipe du championnat de Paris : ses rencontres ne sont pas dans
    l'API de la FFTT.</p>` : "")
    + (D.historiques_restants ? `<p class="petit">Meilleur classement : ${pluriel(D.historiques_restants, "joueur")} des clubs adverses
    encore à lire (option 8 du menu du PC pour tout lire d'un coup).</p>` : "");
  const cle = `eff-${club.numero}`;
  const cles = Object.keys(TRIS_EFFECTIF).filter((t) => avecForme || !["forme", "parties"].includes(t));
  const tri = cles.includes(triEffectif) ? triEffectif : "points";
  EFFECTIFS[cle] = (t) => actifs.slice().sort((x, y) => TRIS_EFFECTIF[t](x) - TRIS_EFFECTIF[t](y) || pts(y) - pts(x)).map(ligne).join("");
  const tris = `<div class="tris">Trier par :${cles.map((t) => ` <button type="button" class="tri${t === tri ? " actif" : ""}"
    onclick="trierEffectif('${cle}', '${t}', this)">${NOMS_TRIS[t]}</button>`).join("")}</div>`;
  const partiel = club.effectif_complet === false
    ? `<p class="note">Effectif limité aux joueurs alignés cette phase en championnat de France : la liste des licenciés du club
       (pingpocket.fr, effectif complet, catégories, meilleur classement) n'a pas encore été lue. Elle vient avec la mise à jour
       lancée depuis le PC (lancer.bat), ou en enregistrant ses listes
       <a href="${listeClub(club.numero, "CATEGORY")}" target="_blank" rel="noopener" data-lien="pingpocket catégories">par catégorie d'âge</a> et
       <a href="${listeClub(club.numero, "LICENCE_STATE")}" target="_blank" rel="noopener" data-lien="pingpocket licences">par licences à jour</a>
       (Ctrl+S, « Page Web, complète ») dans le dossier import de l'outil.</p>` : "";
  // Les explications des colonnes sous le tableau : sur téléphone, les joueurs d'abord
  return `<h4>Effectif de ${esc(club.nom)} (${pluriel(actifs.length, "joueur")})</h4>${partiel}${noteListe(club)}
    ${actifs.length ? `${tris}<div class="defil"><table>${entete}<tbody id="${cle}">${EFFECTIFS[cle](tri)}</tbody></table></div>` : ""}${legende}
    ${anciens.length ? `<details><summary>Pas encore renouvelés (${anciens.length})</summary>
      <div class="defil"><table>${entete}<tbody>${anciens.map(ligne).join("")}</tbody></table></div></details>` : ""}`;
}
/* Date de la liste des licenciés du club (lue sur pingpocket.fr par le PC) : les inscriptions plus
   récentes n'y sont pas. Ancienne de plus de 10 jours : à relire en lançant la mise à jour du PC. */
function noteListe(club) {
  if (!club.date_effectif) return "";
  const jours = Math.floor((new Date(D.genere_le) - new Date(club.date_effectif)) / 864e5);
  const nb = (club.joueurs || []).filter((j) => j.nouveau).length;
  const nouveaux = club.reference_nouveaux
    ? ` ${nb ? `<b>${nb} nouveau${nb > 1 ? "x" : ""}</b> (inscrit${nb > 1 ? "s" : ""} ou réinscrit${nb > 1 ? "s" : ""})` : "Aucun nouvel inscrit"} depuis la liste du ${fmtDate(club.reference_nouveaux.slice(0, 10), true)}.` : "";
  return jours > 10
    ? `<p class="note">Liste des licenciés du ${fmtDate(club.date_effectif.slice(0, 10), true)} (il y a ${jours} jours) : les inscriptions plus
        récentes n'y figurent pas. Pour la relire, lancer la mise à jour depuis le PC (lancer.bat).${nouveaux}</p>`
    : `<p class="petit">Liste des licenciés du ${fmtDate(club.date_effectif.slice(0, 10), true)}.${nouveaux}</p>`;
}
function ecartMensuel(d) {
  if (Math.abs(d) < 1) return "";
  return ` <span class="petit" style="color:var(${d > 0 ? "--ok" : "--danger"})">${d > 0 ? "+" : ""}${Math.round(d)}</span>`;
}

function tableEquipes(club, idx) {
  const equipes = (club.equipes || []).slice().sort((a, b) => (a.championnat || "").localeCompare(b.championnat || "") || (a.numero ?? 0) - (b.numero ?? 0));
  if (!equipes.length) return "";
  const maxJ = Math.max(1, ...equipes.flatMap((e) => (e.compositions || []).map((c) => c.journee || 1)));
  const js = Array.from({ length: maxJ }, (_, i) => i + 1);
  const cell = (e, jn) => {
    const c = (e.compositions || []).find((x) => x.journee === jn);
    if (!c) return "";
    return c.joueurs.map((id) => idx[id] ? `${esc(idx[id].nom)} ${esc((idx[id].prenom || "").charAt(0))}. <span class="petit">${cltJ(idx[id])}</span>` : "?").join("<br>");
  };
  return `<details><summary>Championnat de France : qui a joué dans quelle équipe (${pluriel(equipes.length, "équipe")} du club)</summary><div class="defil"><table>
    <thead><tr><th>Équipe</th>${js.map((jn) => `<th>J${jn}</th>`).join("")}</tr></thead><tbody>
    ${equipes.map((e) => `<tr><td><b>${esc(e.libelle)}</b><br><span class="petit">${esc(e.division || "")}${e.championnat === "F" ? " · féminin" : ""}</span></td>${js.map((jn) => `<td>${cell(e, jn)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></details>`;
}

/* ---------- Démarrage ---------- */
const prochaine = (D.journees || []).find((j) => j.date >= AUJOURDHUI);
document.getElementById("sous-titre").textContent = [`${D.club.nom} · championnat de Paris IDF ${D.saison ?? ""}`,
  prochaine ? `prochaine journée : J${prochaine.numero}, ${fmtDate(prochaine.date, true)}` : "",
  D.genere_le ? "données du " + new Date(D.genere_le).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) : ""].filter(Boolean).join(" · ");
if (D.demo) document.getElementById("bandeau").innerHTML = '<div class="demo">Données de démonstration (fictives)</div>';
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
