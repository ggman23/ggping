<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CVTT Vaires · championnat de Paris</title>
<style>
:root { color-scheme: light dark; --fond: #eef1f5; --surface: #fff; --surface2: #f3f5f8; --texte: #1c2330; --doux: #5b6576;
  --bord: #dde1e7; --accent: #1f5fbf; --accent-fond: #e8f0fc; --bandeau: #173b60; --bandeau-texte: #fff;
  --att: #8a5a00; --att-fond: #fff4d6; --vaires-fond: #fff1b8; --vaires-bord: #e0a800; --dom: #1e7b34; --ext: #6b4fbb; }
@media (prefers-color-scheme: dark) { :root { --fond: #12151b; --surface: #1b2029; --surface2: #232a35; --texte: #e6e9ef;
  --doux: #9aa4b5; --bord: #313a48; --accent: #7fb0ff; --accent-fond: #1d2a40; --bandeau: #0f2236;
  --att: #f3cd6b; --att-fond: #3a3014; --vaires-fond: #3d3214; --vaires-bord: #c98500; --dom: #5cc977; --ext: #b9a4ff; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
#appli { height: 100%; display: flex; flex-direction: column; }
.barre { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bandeau); color: var(--bandeau-texte); }
.barre .titres { flex: 1 1 auto; min-width: 0; }
.barre b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .titres span { display: block; font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre a { flex: none; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff;
  border-radius: 9px; padding: 7px 11px; font-size: 14.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.corps { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 300px 1fr; }
#menu { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--bord); padding: 8px 10px 24px; }
#menu h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin: 16px 8px 6px; }
.entree { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; color: inherit; text-decoration: none; }
.entree:hover { background: var(--surface2); }
.entree.actif { background: var(--accent-fond); }
.entree b { display: block; font-size: 15px; font-weight: 600; }
.entree span { display: block; font-size: 12.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vue { min-width: 0; min-height: 0; overflow: auto; }
.contenu { max-width: 760px; padding: 22px 20px 40px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h1 small { font-size: 15px; color: var(--doux); font-weight: 500; }
h2.titre { font-size: 17px; margin: 22px 0 8px; }
.infos { color: var(--doux); font-size: 14px; margin: 2px 0 12px; }
.carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.carte.vaires { border-left: 4px solid var(--vaires-bord); }
.match { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.match .eq { font-weight: 700; }
.match .contre { color: var(--doux); }
.lieu { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 7px; color: #fff; }
.lieu.dom { background: var(--dom); } .lieu.ext { background: var(--ext); }
.doux { color: var(--doux); }
.defil { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--surface); border-radius: 10px; overflow: hidden; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--bord); text-align: left; font-size: 14.5px; }
th { background: var(--surface2); font-size: 13px; color: var(--doux); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.vaires td { background: var(--vaires-fond); font-weight: 700; }
tr.passe td { color: var(--doux); }
tr.prochaine td { box-shadow: inset 0 0 0 2px var(--accent); }
.jour { margin: 12px 0 0; }
.jour h3 { font-size: 14.5px; margin: 0 0 4px; }
.jour ul { margin: 0; padding: 0; list-style: none; }
.jour li { padding: 3px 0; font-size: 14.5px; }
.jour li.vaires { font-weight: 700; }
.joueurs th { white-space: nowrap; }
.joueurs th button { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
.joueurs td.nom { white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 5px; margin-left: 4px;
  background: var(--accent-fond); color: var(--accent); }
.pos { color: var(--dom); } .neg { color: #c62828; }
@media (prefers-color-scheme: dark) { .neg { color: #ff7b72; } }
.filtres { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.filtres button { border: 1px solid var(--bord); background: var(--surface); color: var(--texte); border-radius: 999px; padding: 5px 12px;
  font: inherit; font-size: 14px; cursor: pointer; }
.filtres button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
a.club { font-weight: 700; }
@media (max-width: 600px) { .joueurs .opt { display: none; } }
.note { background: var(--att-fond); color: var(--att); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; margin: 16px 0 0; }
.source { color: var(--doux); font-size: 12.5px; margin: 14px 2px 0; }
#retour { display: none; }
@media (max-width: 860px) {
  .corps { grid-template-columns: 1fr; }
  #menu { border-right: 0; }
  #appli.sur-menu #vue, #appli:not(.sur-menu) #menu { display: none; }
  #appli:not(.sur-menu) #retour { display: inline-block; }
  .contenu { padding: 16px 12px 32px; }
  th, td { padding: 6px 6px; font-size: 14px; }
}
@media (max-width: 420px) { .barre { padding-left: 10px; padding-right: 10px; } .barre a { padding: 7px 9px; font-size: 14px; } }
.espaces { display: flex; gap: 8px; flex: none; }
@media (max-width: 520px) {
  /* En-tête : les liens vers les autres espaces sur leur propre ligne (le titre reste lisible) */
  .barre { flex-wrap: wrap; }
  .espaces { order: 3; flex-basis: 100%; gap: 6px; }
  .espaces a { flex: 1 1 0; text-align: center; padding: 7px 4px; font-size: 13.5px; }
}
</style>
</head>
<body>
<div id="appli">
  <header class="barre">
    <a id="retour" href="#menu" aria-label="Revenir au menu">‹ Menu</a>
    <div class="titres"><b>CVTT Vaires · championnat de Paris</b><span id="sous-titre"></span></div>
    <nav class="espaces" aria-label="Autres espaces">
      <a id="vers-club" href="../club/" title="Espace club : championnat de France, pages, images, archives">Club</a>
      <a id="vers-indivs" href="../indivs/" title="Individuels : poules du critérium et adversaires">Indivs</a>
      <a id="vers-tournois" href="../tournois/" title="Tournois à venir autour de Vaires">Tournois</a>
      <a id="vers-cal" href="../cal/" title="Calendrier de la saison">Calendrier</a>
      <a id="vers-77" href="../77/" title="Clubs du 77 : joueurs, niveau et équipes de chaque club">77</a>
    </nav>
  </header>
  <div class="corps">
    <nav id="menu" aria-label="Championnat de Paris"></nav>
    <main id="vue"></main>
  </div>
</div>
<script>
"use strict";
/* Championnat de Paris IDF : les trois équipes de Vaires, leurs poules et leur calendrier (ttvaires/paris.py,
   recopiés des documents de la ligue). Aucune donnée de la mise à jour : la page ne change qu'avec ces documents. */
const D = __DONNEES_JSON__;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Statistiques de visite (GoatCounter et Umami, sur les copies du site qui en ont) : ce qu'on fait dans la page,
   en événements « paris/<action>/<détail> » (vue, lien). Jamais un nom de joueur. */
const compterAction = (action, detail, titre) => {
  try { if (window.compteur) window.compteur(`paris/${action}/${String(detail).replace(/\//g, "-").slice(0, 80)}`, `Paris · ${titre}`, true); }
  catch (e) { /* sans compteur */ }
};
document.addEventListener("click", (ev) => {  // liens vers une autre page (pas les liens internes « #… »)
  const a = ev.target.closest("a[href]");
  if (a && !a.getAttribute("href").startsWith("#")) {
    const nom = a.dataset.lien || (a.querySelector("b") || a).textContent.trim();
    compterAction("lien", nom, `lien ${nom}`);
  }
});

/* Autres espaces à côté de /paris/ (même mot de passe, déjà retenu), y compris sur le site GitHub (…/ggping/paris/) */
function racine() {
  const p = location.pathname, i = p.search(/\/(gg\/)?paris(\/|\.html)/);
  return i >= 0 ? p.slice(0, i) : p.replace(/\/[^/]*$/, "");
}
const BASE = location.protocol === "file:" ? ".." : racine();
const CLUB = `${BASE}/club/`, INDIVS = `${BASE}/indivs/`, TOURNOIS = `${BASE}/tournois/`, CAL = `${BASE}/cal/`, D77 = `${BASE}/77/`;
for (const [id, url] of [["vers-club", CLUB], ["vers-indivs", INDIVS], ["vers-tournois", TOURNOIS], ["vers-cal", CAL], ["vers-77", D77]])
  document.getElementById(id).href = url;

const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const date = (iso) => new Date(iso + "T12:00:00");
const court = (iso) => { const d = date(iso); return `${JOURS[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`; };
const long = (iso) => { const d = date(iso); return `vendredi ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; };
const AUJ = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const PROCHAINE = D.journees.find((j) => j.date >= AUJ) || null;
const dans = (iso) => { const n = Math.round((date(iso) - date(AUJ)) / 864e5); return n === 0 ? "ce soir" : n === 1 ? "demain" : `dans ${n} jours`; };
const parPosition = (e) => new Map(e.equipes.map((p) => [p.position, p]));
const lieu = (domicile) => `<span class="lieu ${domicile ? "dom" : "ext"}">${domicile ? "Domicile" : "Extérieur"}</span>`;
const adversaire = (e, c) => parPosition(e).get(c.adversaire);
const nomDivision = (e) => `${e.division} · poule ${e.poule}`;
/* Clubs adverses (mise à jour : adversaires.recuperer_paris) : joueurs, points, meilleur classement, forme */
const CLUBS = D.clubs || {};
const AVEC_CLUBS = Object.keys(CLUBS).length > 0;
const lienClub = (num, texte) => (CLUBS[num] ? `<a class="club" href="#club-${esc(num)}">${esc(texte)}</a>` : `<b>${esc(texte)}</b>`);
const fr = (x, d = 0) => (x == null ? "—" : Number(x).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }));
const signe = (x) => (x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${fr(Math.abs(x), 1)}`);
/* Rencontres de Vaires contre chaque club (une équipe adverse du même club peut jouer contre deux équipes de Vaires) */
const FACE = {};
for (const e of D.equipes) for (const c of e.calendrier) {
  const a = parPosition(e).get(c.adversaire);
  (FACE[a.club] = FACE[a.club] || []).push({ e, c, a });
}

function menu(actif) {
  document.getElementById("menu").innerHTML = `<h2>Championnat de Paris ${esc(D.saison)}</h2>
    <a class="entree${actif === "prochaine" ? " actif" : ""}" href="#prochaine"><b>${PROCHAINE ? `Prochaine journée : J${PROCHAINE.numero}` : "Saison terminée"}</b>
      <span>${PROCHAINE ? `${esc(long(PROCHAINE.date))} · ${esc(dans(PROCHAINE.date))}` : "Les sept journées sont passées"}</span></a>
    ${D.equipes.map((e) => `<a class="entree${actif === e.cle ? " actif" : ""}" href="#${e.cle}"><b>${esc(e.nom)} · ${esc(e.division)}</b>
      <span>Poule ${e.poule} · calendrier et adversaires</span></a>`).join("")}
    <a class="entree${actif === "dates" ? " actif" : ""}" href="#dates"><b>Toutes les dates</b><span>Les 7 vendredis et les 3 rencontres de chacun</span></a>
    ${AVEC_CLUBS ? `<h2>Clubs adverses</h2>${Object.entries(CLUBS).sort((a, b) => a[1].nom.localeCompare(b[1].nom, "fr")).map(([num, c]) =>
      `<a class="entree${actif === "club-" + num ? " actif" : ""}" href="#club-${esc(num)}"><b>${esc(c.nom)}</b>
        <span>${FACE[num].map((f) => `${esc(f.e.nom)} J${f.c.journee}`).join(" · ")} · ${c.joueurs.length} joueurs</span></a>`).join("")}` : ""}
    <h2>Autres espaces</h2>
    <a class="entree" href="${CLUB}"><b>Espace club</b><span>Championnat de France : pages, images, archives</span></a>
    <a class="entree" href="${INDIVS}"><b>Individuels</b><span>Poules du critérium et adversaires</span></a>
    <a class="entree" href="${TOURNOIS}"><b>Tournois</b><span>Tournois à venir autour de Vaires</span></a>
    <a class="entree" href="${CAL}"><b>Calendrier</b><span>Dates de la saison : championnats, critérium</span></a>
    <a class="entree" href="${D77}"><b>Clubs du 77</b><span>Joueurs, niveau et équipes de chaque club</span></a>`;
}

/* Une rencontre de Vaires : l'équipe, domicile ou extérieur, l'adversaire */
function carteMatch(e, c, titre = true) {
  const a = adversaire(e, c);
  return `<div class="carte vaires"><div class="match">${titre ? `<span class="eq">${esc(e.nom)}</span>` : ""}${lieu(c.a_domicile)}
    <span>${c.a_domicile ? "reçoit" : "va chez"} ${lienClub(a.club, a.nom)}</span><span class="contre">(${esc(a.dep)})</span></div>
    <div class="doux">${esc(nomDivision(e))} · journée ${c.journee}</div></div>`;
}

function vueProchaine() {
  if (!PROCHAINE) return `<div class="contenu"><h1>Saison terminée</h1><p class="infos">Les sept journées du championnat de Paris sont passées.</p>${notes()}</div>`;
  return `<div class="contenu"><h1>Journée ${PROCHAINE.numero} <small>${esc(long(PROCHAINE.date))} · ${esc(dans(PROCHAINE.date))}</small></h1>
    <p class="infos">Les trois équipes de Vaires jouent le même vendredi.</p>
    ${D.equipes.map((e) => carteMatch(e, e.calendrier.find((c) => c.journee === PROCHAINE.numero))).join("")}
    ${notes()}</div>`;
}

function vueEquipe(e) {
  const pos = parPosition(e);
  const lignes = e.calendrier.map((c) => {
    const a = pos.get(c.adversaire), cls = c.date < AUJ ? "passe" : PROCHAINE && c.journee === PROCHAINE.numero ? "prochaine" : "";
    return `<tr class="${cls}"><td>J${c.journee}</td><td>${esc(court(c.date))}</td><td>${lieu(c.a_domicile)}</td><td>${lienClub(a.club, a.nom)}</td><td class="n">${esc(a.dep)}</td></tr>`;
  }).join("");
  const poule = e.equipes.map((p) => `<tr class="${p.vaires ? "vaires" : ""}"><td class="n">${p.position}</td><td>${esc(p.nom)}</td><td class="n">${esc(p.dep)}</td></tr>`).join("");
  const journees = D.journees.map((j) => `<div class="jour"><h3>J${j.numero} · ${esc(court(j.date))}</h3><ul>${e.rencontres.filter((r) => r.journee === j.numero)
    .map((r) => { const a = pos.get(r.domicile), b = pos.get(r.exterieur);
      return `<li class="${a.vaires || b.vaires ? "vaires" : ""}">${esc(a.nom)} <span class="doux">reçoit</span> ${esc(b.nom)}</li>`; }).join("")}</ul></div>`).join("");
  return `<div class="contenu"><h1>${esc(e.nom)} <small>${esc(nomDivision(e))}</small></h1>
    <p class="infos">Championnat de Paris IDF ${esc(D.saison)} · 8 équipes, 7 journées, le vendredi.</p>
    ${PROCHAINE ? carteMatch(e, e.calendrier.find((c) => c.journee === PROCHAINE.numero), false) : ""}
    <h2 class="titre">Calendrier de ${esc(e.nom)}</h2>
    <div class="defil"><table><tr><th>J.</th><th>Date</th><th>Lieu</th><th>Adversaire</th><th class="n">Dép.</th></tr>${lignes}</table></div>
    <h2 class="titre">La poule</h2>
    <div class="defil"><table><tr><th class="n">N°</th><th>Équipe</th><th class="n">Dép.</th></tr>${poule}</table></div>
    <h2 class="titre">Toutes les rencontres de la poule</h2>${journees}
    ${notes()}</div>`;
}

function vueDates() {
  return `<div class="contenu"><h1>Toutes les dates <small>${esc(D.saison)}</small></h1>
    <p class="infos">Les sept vendredis du championnat de Paris et les rencontres des trois équipes de Vaires.</p>
    ${D.journees.map((j) => `<h2 class="titre">J${j.numero} · ${esc(long(j.date))}${j.date < AUJ ? ' <span class="doux">(passée)</span>' : ""}</h2>
      ${D.equipes.map((e) => carteMatch(e, e.calendrier.find((c) => c.journee === j.numero))).join("")}`).join("")}
    ${notes()}</div>`;
}

let filtreJ = "tous", triJ = { cle: "pts", sens: -1 };
const COLONNES = [
  { cle: "nom", titre: "Joueur", texte: true }, { cle: "cat", titre: "Cat.", texte: true, opt: true },
  { cle: "pts", titre: "Points", n: true }, { cle: "meilleur", titre: "Meilleur", n: true },
  { cle: "eq", titre: "Éq. France", texte: true, opt: true, aide: "Équipe où il a le plus joué en championnat de France cette phase (nombre de rencontres)" },
  { cle: "vd", titre: "V – D", n: true, aide: "Victoires et défaites depuis le début de la phase, toutes compétitions" },
  { cle: "gain", titre: "+/−", n: true, aide: "Points gagnés ou perdus depuis le début de la phase (estimation)" },
  { cle: "virt", titre: "Virtuels", n: true, opt: true, aide: "Estimation des points virtuels" },
];
const valeur = (j, cle) => (cle === "vd" ? (j.v ?? -1) - (j.d ?? 0) / 1000 : cle === "eq" ? (j.eq ? parseInt(j.eq, 10) : 99) : j[cle]);
function vueClub(num) {
  const c = CLUBS[num];
  const garde = c.joueurs.filter((j) => filtreJ === "tous" || (filtreJ === "joue" ? (j.v || 0) + (j.d || 0) > 0 : j.nb > 0));
  const col = COLONNES.find((x) => x.cle === triJ.cle);
  garde.sort((a, b) => { const x = valeur(a, triJ.cle), y = valeur(b, triJ.cle);
    return (col.texte ? String(x ?? "").localeCompare(String(y ?? ""), "fr") : (x ?? -1e9) - (y ?? -1e9)) * triJ.sens || (b.pts || 0) - (a.pts || 0); });
  const th = (x) => `<th class="${x.n ? "n" : ""}${x.opt ? " opt" : ""}"${x.aide ? ` title="${esc(x.aide)}"` : ""}><button type="button" data-tri="${x.cle}">${esc(x.titre)}${triJ.cle === x.cle ? (triJ.sens > 0 ? " ▲" : " ▼") : ""}</button></th>`;
  const lignes = garde.map((j) => `<tr><td class="nom">${esc(j.nom)}${j.sexe === "F" ? ' <span class="doux">F</span>' : ""}${j.nouveau ? '<span class="tag">nouveau</span>' : ""}</td>
    <td class="opt">${esc(j.cat || "—")}</td><td class="n">${fr(j.pts)}</td>
    <td class="n" title="${j.annee ? "en " + esc(j.annee) : ""}">${j.meilleur ? fr(j.meilleur) + (j.annee ? ` <span class="doux">(${esc(String(j.annee).slice(-2))})</span>` : "") : "—"}</td>
    <td class="opt">${j.eq ? `${esc(j.eq)} <span class="doux">(${j.nb})</span>` : "—"}</td>
    <td class="n">${j.v == null ? "—" : `${j.v} – ${j.d}`}</td><td class="n ${j.gain > 0 ? "pos" : j.gain < 0 ? "neg" : ""}">${signe(j.gain)}</td>
    <td class="n opt">${fr(j.virt, 1)}</td></tr>`).join("");
  const france = c.france.length ? c.france.map((e) => `équipe ${e.numero}${e.ch === "F" ? " F" : ""} (${esc(e.division)})`).join(" · ") : "aucune équipe trouvée";
  return `<div class="contenu"><h1>${esc(c.nom)}</h1>
    ${FACE[num].map((f) => carteMatch(f.e, f.c)).join("")}
    <p class="infos">En championnat de France cette phase : ${france}.</p>
    <p class="infos">${c.complet ? `Effectif complet (liste des licenciés${c.date ? " du " + esc(c.date.slice(8, 10) + "/" + c.date.slice(5, 7)) : ""}), sans les licences loisir.`
      : "Effectif limité aux joueurs déjà alignés en championnat de France : la liste complète du club n'est pas encore lue (PC)."}${c.erreur ? " Équipes du club non lues (l'API FFTT n'a pas répondu) : relancer." : ""}</p>
    <div class="filtres" role="group" aria-label="Joueurs affichés">
      <button type="button" data-filtre="tous" aria-pressed="${filtreJ === "tous"}">Tous (${c.joueurs.length})</button>
      <button type="button" data-filtre="joue" aria-pressed="${filtreJ === "joue"}">Ont joué cette phase</button>
      <button type="button" data-filtre="france" aria-pressed="${filtreJ === "france"}">Alignés en championnat de France</button></div>
    <div class="defil"><table class="joueurs"><tr>${COLONNES.map(th).join("")}</tr>${lignes || `<tr><td colspan="8" class="doux">Aucun joueur.</td></tr>`}</table></div>
    <p class="source">Points : situation mensuelle (sinon points de la phase). Meilleur : meilleur classement de son historique (année).
      V – D et +/− : toutes compétitions depuis le ${D.debut_forme ? esc(D.debut_forme.split("-").reverse().join("/")) : "début de la phase"}, estimation
      comme le classement virtuel.${D.historiques_restants ? ` ${fr(D.historiques_restants)} meilleurs classements pas encore lus (PC).` : ""}
      Un club compose ses équipes du championnat de Paris à sa façon : toute la liste est montrée, du mieux classé au moins bien classé.</p>
    ${notes()}</div>`;
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tri]");
  if (t) { const cle = t.dataset.tri, col = COLONNES.find((x) => x.cle === cle);
    triJ = { cle, sens: triJ.cle === cle ? -triJ.sens : col.texte ? 1 : -1 }; compterAction("tri", cle, `tri ${col.titre}`); route(); return; }
  const f = ev.target.closest("[data-filtre]");
  if (f) { filtreJ = f.dataset.filtre; compterAction("filtre", filtreJ, `joueurs : ${f.textContent.trim()}`); route(); }
});

const notes = () => `<p class="note">Horaires et salles : ceux de chaque club (le club qui reçoit). Les rencontres du championnat
    de Paris ne sont pas dans l'API de la FFTT : ni résultats ni compositions ici${AVEC_CLUBS ? "" : " ; les joueurs des clubs adverses arrivent avec la prochaine mise à jour"}.</p>
  <p class="source">${esc(D.source)} ; « reçoit » : le premier nommé de la grille des rencontres.</p>`;

const TELEPHONE = matchMedia("(max-width: 860px)");
let vueComptee = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const surMenu = h === "menu" && TELEPHONE.matches;
  const e = D.equipes.find((x) => x.cle === h);
  const club = h.startsWith("club-") && CLUBS[h.slice(5)] ? h.slice(5) : null;
  const cle = e ? e.cle : club ? h : h === "dates" ? "dates" : "prochaine";
  document.getElementById("appli").classList.toggle("sur-menu", surMenu);
  menu(surMenu ? null : cle);
  if (!surMenu) {
    const memeVue = cle === vueComptee;
    document.getElementById("vue").innerHTML = e ? vueEquipe(e) : club ? vueClub(club) : cle === "dates" ? vueDates() : vueProchaine();
    if (!memeVue) document.getElementById("vue").scrollTop = 0;  // un tri ou un filtre garde la position
    if (!memeVue) { vueComptee = cle; compterAction("vue", club ? "club" : cle, e ? `${e.nom} (${e.division})` : club ? `club ${CLUBS[club].nom}`
      : cle === "dates" ? "toutes les dates" : "prochaine journée"); }
  }
  document.title = `CVTT Vaires · championnat de Paris${surMenu ? "" : e ? " · " + e.nom : club ? " · " + CLUBS[club].nom : ""}`;
}
document.getElementById("sous-titre").textContent = PROCHAINE ? `Prochaine journée : ${long(PROCHAINE.date)}` : `Saison ${D.saison}`;
window.addEventListener("hashchange", route);
TELEPHONE.addEventListener("change", route);
route();
</script>
</body>
</html>
